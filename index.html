nes, la importancia del entorno para la empresa, ya que los cuatro elementos de su matriz se refieren a elementos del entorno:", "doc": "U2-3", "page": 7}, {"t": "Factores de producción: Porter agrega aspectos como la infraestructura de telecomunicaciones y transportes, la disponibilidad de capital, etcétera, entre otros aspectos del entorno.", "doc": "U2-3", "page": 7}, {"t": "Rivalidad en el mercado local: se refieren a empresas competidores en la misma actividad en la región o en el país, aspecto del ambiente que para Porter es importante para lograr la competitividad.", "doc": "U2-3", "page": 8}]}, "GLO|EE": {"a": "GLO", "b": "EE", "link": "La apertura de mercados producto de la globalización generó cambios significativos en el entorno específico: oportunidades, pero también mercados más competitivos y compradores más exigentes.", "quotes": [{"t": "Por globalización entendemos la integración de los mercados internacionales de productos y de factores.", "doc": "U2-3", "page": 16}, {"t": "Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}, {"t": "Con respecto a este último, se observa que con la introducción de nuevas tecnologías, la apertura de mercados, producto de la globalización, se han generado cambios significativos en el entorno de las empresas, que se traducen en algunos casos en oportunidades para obtener recursos, en otras para incursionar en mercados, no obstante, han traído consigo amenazas que se re reflejan en situaciones de recesión económica, la aparición de mercados más competitivos y compradores más exigentes, lo cual demanda a las organizaciones programar acciones que garantice su estabilidad y respuesta ante dichas circunstancias.", "doc": "U2-3", "page": 5}]}, "GLO|PET": {"a": "GLO", "b": "PET", "link": "La postura etnocéntrica es una de las actitudes de los gerentes ante el entorno global: creer que los mejores métodos son los del país de la matriz.", "quotes": [{"t": "Por globalización entendemos la integración de los mercados internacionales de productos y de factores.", "doc": "U2-3", "page": 16}, {"t": "El entorno global es un conjunto de fuerzas y condiciones del mundo que están más allá de los límites de una organización y afectan la forma en que opera y moldean su conducta. Esas fuerzas cambian con el tiempo y por ello pueden representar oportunidades y amenazas para los gerentes.", "doc": "U2-3", "page": 17}, {"t": "Conocer qué es la globalización y sus diferentes posturas.", "doc": "U2-3", "page": 3}, {"t": "POSTURAS ETNOCÉNTRICA, POLICÉNTRICA Y GEOCÉNTRICA", "doc": "U2-3", "page": 18}, {"t": "Una postura etnocéntrica es la idea de que los mejores métodos y prácticas de trabajo son los del país donde está la matriz de la compañía. Los gerentes que se adhieren a esta postura piensan que los extranjeros no poseen las destrezas, competencia, conocimientos o experiencia que sus compatriotas. No confiarían a los empleados extranjeros decisiones o tecnologías fundamentales.", "doc": "U2-3", "page": 18}]}, "GLO|PPO": {"a": "GLO", "b": "PPO", "link": "La postura policéntrica es otra actitud ante la globalización: confiar en que los gerentes del país anfitrión conocen los mejores métodos.", "quotes": [{"t": "Por globalización entendemos la integración de los mercados internacionales de productos y de factores.", "doc": "U2-3", "page": 16}, {"t": "El entorno global es un conjunto de fuerzas y condiciones del mundo que están más allá de los límites de una organización y afectan la forma en que opera y moldean su conducta. Esas fuerzas cambian con el tiempo y por ello pueden representar oportunidades y amenazas para los gerentes.", "doc": "U2-3", "page": 17}, {"t": "Conocer qué es la globalización y sus diferentes posturas.", "doc": "U2-3", "page": 3}, {"t": "POSTURAS ETNOCÉNTRICA, POLICÉNTRICA Y GEOCÉNTRICA", "doc": "U2-3", "page": 18}, {"t": "La postura policéntrica es la idea de que los gerentes del país anfitrión (el país extranjero en el que la organización hace negocios) conocen los mejores métodos y prácticas para dirigir sus empresas. Los gerentes de postura policéntrica consideran que las operaciones foráneas son diferentes y difíciles de entender. Así, es probable que no intervengan en las instalaciones en el extranjero y dejen que los empleados locales determinen la mejor manera de hacer las cosas.", "doc": "U2-3", "page": 18}]}, "GLO|PGE": {"a": "GLO", "b": "PGE", "link": "La postura geocéntrica es la actitud cosmopolita ante la globalización: considerar las decisiones en términos globales y aprovechar los mejores métodos de todo el mundo.", "quotes": [{"t": "Por globalización entendemos la integración de los mercados internacionales de productos y de factores.", "doc": "U2-3", "page": 16}, {"t": "El entorno global es un conjunto de fuerzas y condiciones del mundo que están más allá de los límites de una organización y afectan la forma en que opera y moldean su conducta. Esas fuerzas cambian con el tiempo y por ello pueden representar oportunidades y amenazas para los gerentes.", "doc": "U2-3", "page": 17}, {"t": "Conocer qué es la globalización y sus diferentes posturas.", "doc": "U2-3", "page": 3}, {"t": "La última actitud ante el mundo que pueden adoptar los gerentes es la postura geocéntrica, que es una idea cosmopolita de que hay que aprovechar los mejores métodos y empleados de todo el mundo. Los gerentes con esta postura piensan que es importante tener un punto de vista mundial, tanto en la matriz de la organización en la patria como en las instalaciones situadas en el extranjero.", "doc": "U2-3", "page": 18}, {"t": "Con la postura geocéntrica, los principales temas y decisiones se consideran en términos globales y se buscan los mejores métodos, cualquiera que sea su origen. La buena administración global requiere afinar la sensibilidad a las diferencias de costumbres y prácticas nacionales.", "doc": "U2-3", "page": 18}]}, "ENT|CU": {"a": "ENT", "b": "CU", "link": "El entorno influye en el interior de la organización: la cultura tiene factores externos y debe incorporar capacidad de adaptación rápida ante los cambios del medio.", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Continuamos dentro de la temática general de la cultura organizacional, esta vez desarrollamos la relación de esta cultura y de toda la empresa con su entorno. Destacamos en primer lugar la importancia del ambiente externo y su influencia en el interior de la organización.", "doc": "U2-3", "page": 3}, {"t": "Factores externos: No forman parte de la organización, sino de su entorno, entre ellos destacamos clientes, proveedores, competidores, asociaciones, ciudadanos, gobierno, sociedad en general y accionistas.", "doc": "U2-1", "page": 9}, {"t": "Por ello es importante que la organización tenga una capacidad de adaptación rápida y versátil y para esto es importante que estas características se trabajen y se implementen en su cultura.", "doc": "U2-3", "page": 12}, {"t": "El primero se refiere a todo lo que está dentro de la organización, es decir los trabajadores, el clima organizacional, la cultura organizacional, etcétera. Por otro lado, el ambiente externo o entorno está compuesto por todo aquello que se encuentra fuera de la organización y que se relaciona con ella de algún modo.", "doc": "U2-3", "page": 9}]}, "PA|CT": {"a": "PA", "b": "CT", "link": "El texto define al control como la última fase del proceso administrativo, que cierra el ciclo pero en la práctica se da en simultáneo con las otras etapas.", "quotes": [{"t": "las primeras definiciones se concentraron fundamentalmente en la planeación, la organización, la dirección y el control, la cual es aceptada y se encuentra en la mayoría de los textos sobre el tema.", "doc": "U3-3", "page": 4}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "A través del control se garantiza el cumplimiento de los planes. Si el control se conceptualiza como la última etapa del proceso administrativo, esto no significa que en la práctica suceda de la misma manera, las etapas del proceso administrativo están relacionadas a tal grado que, generalmente, el control se realiza en forma simultánea a otras etapas.", "doc": "U3-1", "page": 4}, {"t": "Además, siendo el control la última de las funciones del proceso administrativo, esta cierra el ciclo del sistema al proveer retroalimentación respecto a desviaciones significativas contra el desempeño planeado.", "doc": "U3-1", "page": 7}]}, "CT|STD": {"a": "CT", "b": "STD", "link": "Establecer estándares es la primera etapa del proceso de control: el estándar es el patrón contra el cual el control evalúa los resultados.", "quotes": [{"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Un estándar es la unidad de medida que sirve como modelo, guía o patrón, para efectuar el control.", "doc": "U3-1", "page": 11}, {"t": "Las etapas del control son:\n\n   ●   Establecimiento de estándares\n   ●   Medición\n   ●   Corrección\n   ●   Retroalimentación", "doc": "U3-1", "page": 10}, {"t": "La acción correctiva que ajusta las operaciones a los estándares preestablecidos es la esencia del control, y su base es la información que reciben los gerentes.", "doc": "U3-1", "page": 14}]}, "STD|MED": {"a": "STD", "b": "MED", "link": "La medición aplica las unidades de medida definidas por los estándares para detectar fallas y desviaciones en relación con ellos.", "quotes": [{"t": "Un estándar es la unidad de medida que sirve como modelo, guía o patrón, para efectuar el control. La medición de resultados consiste en la aplicación de unidades de medida para evaluar la ejecución y los resultados.", "doc": "U3-1", "page": 11}, {"t": "La medición implica la determinación, detección de fallas, desviaciones o no conformidades en relación con los estándares. El establecimiento de las unidades de medida en ocasiones resulta complejo, sobre todo en áreas con funciones eminentemente cualitativas.", "doc": "U3-1", "page": 11}, {"t": "Al comparar los resultados con los estándares establecidos, la evaluación debe enviarse a la persona o al órgano responsable.", "doc": "U3-1", "page": 13}]}, "MED|COR": {"a": "MED", "b": "COR", "link": "La corrección se emprende sobre la base de los datos cuantitativos que arroja la medición, que indica cuándo las actividades no logran lo esperado.", "quotes": [{"t": "La medición implica la determinación, detección de fallas, desviaciones o no conformidades en relación con los estándares.", "doc": "U3-1", "page": 11}, {"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares. Antes de iniciar la acción correctiva es importante reconocer si la desviación es un síntoma o una causa.", "doc": "U3-1", "page": 12}, {"t": "Las medidas y los informes de control indican cuando las actividades que se realizan no logran los resultados esperados, y permiten establecer condiciones para poner en marcha la acción correctiva. El objetivo del control es indicar cuándo, cuanta, como y donde debe ejecutarse la corrección; la acción necesaria se emprende con base en los datos cuantitativos obtenidos en las tres fases anteriores del proceso de control.", "doc": "U3-1", "page": 14}]}, "COR|RET": {"a": "COR", "b": "RET", "link": "Corrección y retroalimentación son las dos últimas etapas del control: tras corregir, se retroalimentan los resultados para mejorar el proceso.", "quotes": [{"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares.", "doc": "U3-1", "page": 12}, {"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema. La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}, {"t": "Las etapas del control son:\n\n   ●   Establecimiento de estándares\n   ●   Medición\n   ●   Corrección\n   ●   Retroalimentación", "doc": "U3-1", "page": 10}, {"t": "Las decisiones respecto a las correcciones que deben hacerse representan la culminación del proceso de control. La acción correctiva que ajusta las operaciones a los estándares preestablecidos es la esencia del control, y su base es la información que reciben los gerentes.", "doc": "U3-1", "page": 14}]}, "STD|KPI": {"a": "STD", "b": "KPI", "link": "El texto equipara ambos términos: los estándares también son conocidos como indicadores.", "quotes": [{"t": "Un estándar es la unidad de medida que sirve como modelo, guía o patrón, para efectuar el control.", "doc": "U3-1", "page": 11}, {"t": "Los estándares deben abarcar las funciones básicas y áreas clave de resultados y también son conocidos como indicadores.", "doc": "U3-1", "page": 11}, {"t": "Para medir son utilizados indicadores que se componen de tres elementos que los hacen más que una medida de desempeño:\n\n    ●   El primer elemento es que es una medida de desempeño cuantifica lo que sucede\n    ●   El segundo elemento es que se constituye en una norma de rendimiento que considera si el rendimiento que se obtiene es malo o bueno, esto hace que sea una herramienta para guiar a la dirección de la organización;\n\n    ●   Y por último establece las consecuencias negativas de estar por debajo o por encima de las metas.", "doc": "U3-2", "page": 5}]}, "MED|DES": {"a": "MED", "b": "DES", "link": "La medición es la etapa que detecta las desviaciones respecto de los estándares; comparar lo real con lo proyectado sirve para localizarlas.", "quotes": [{"t": "La medición implica la determinación, detección de fallas, desviaciones o no conformidades en relación con los estándares.", "doc": "U3-1", "page": 11}, {"t": "Toda actividad experimenta algún tipo de variación, error o desvío. Es importante definir los límites dentro de los cuales esa variación se considera normal o deseable. No todas las variaciones requieren corrección, sino solo aquellas que sobrepasen los límites de los criterios de especificación.", "doc": "U3-1", "page": 12}, {"t": "La comparación del desempeño real con el proyectado no solo busca localizar las variaciones, errores o desvíos, sino también predecir otros resultados futuros.", "doc": "U3-1", "page": 13}]}, "COR|DES": {"a": "COR", "b": "DES", "link": "La corrección existe para eliminar desviaciones, pero solo las que sobrepasan los límites aceptables, y distinguiendo si son síntoma o causa.", "quotes": [{"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares. Antes de iniciar la acción correctiva es importante reconocer si la desviación es un síntoma o una causa.", "doc": "U3-1", "page": 12}, {"t": "Toda actividad experimenta algún tipo de variación, error o desvío. Es importante definir los límites dentro de los cuales esa variación se considera normal o deseable. No todas las variaciones requieren corrección, sino solo aquellas que sobrepasen los límites de los criterios de especificación.", "doc": "U3-1", "page": 12}, {"t": "El propósito y la naturaleza del control es fundamentalmente garantizar que los planes tengan éxito al detectar desviaciones de los mismos al ofrecer una base para adoptar acciones, a fin de corregir desviaciones indeseadas reales o potenciales.", "doc": "U3-1", "page": 5}]}, "CT|EXC": {"a": "CT", "b": "EXC", "link": "El control separa lo normal de lo excepcional y concentra la corrección en los desvíos, lo que el texto asocia al principio de excepción de Taylor.", "quotes": [{"t": "El control se enfoca en evaluar y corregir el desempeño de las actividades de los subordinados para asegurar que los objetivos y planes de la organización se están llevando a cabo.", "doc": "U3-1", "page": 6}, {"t": "El control separa lo normal de lo excepcional, opera que la corrección se concentre en las excepciones o los desvíos. Este aspecto recuerda mucho el principio de excepción propuesto por Taylor. Para concentrarse en las excepciones el control debe disponer de técnicas que señalen con rapidez donde se origina el problema.", "doc": "U3-1", "page": 13}]}, "PRE|CT": {"a": "PRE", "b": "CT", "link": "El texto sostiene que la prevención es la mejor forma de control: el control no debe ser solo a posteriori sino también una labor de previsión.", "quotes": [{"t": "Uno de los principios de la calidad total estipula que la prevención es la mejor forma de control, porque si se planean las actividades y se capacita al personal para trabajar con eficiencia, seguramente se minimizarán los errores y se evitará el control correctivo. Esto es muy importante porque la aspiración fundamental de la administración es el autocontrol y la autodirección de los trabajadores", "doc": "U3-1", "page": 5}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Sin embargo, es conveniente recordar que no debe existir solo el control a posteriori, sino que, al igual que el planteamiento, debe ser, por lo menos en parte, una labor de previsión.", "doc": "U3-1", "page": 7}]}, "RET|PL": {"a": "RET", "b": "PL", "link": "La retroalimentación que surge del control es el sustento de la planeación: con ella se reinicia el proceso de planear.", "quotes": [{"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema. La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}, {"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "Además, siendo el control la última de las funciones del proceso administrativo, esta cierra el ciclo del sistema al proveer retroalimentación respecto a desviaciones significativas contra el desempeño planeado. La retroalimentación de información pertinente a partir de la función de control puede afectar el proceso de planeación.", "doc": "U3-1", "page": 7}]}, "PA|PL": {"a": "PA", "b": "PL", "link": "La planeación es la primera de las funciones del proceso administrativo (planeación, organización, dirección y control) y se reinicia con la información del control.", "quotes": [{"t": "las primeras definiciones se concentraron fundamentalmente en la planeación, la organización, la dirección y el control, la cual es aceptada y se encuentra en la mayoría de los textos sobre el tema.", "doc": "U3-3", "page": 4}, {"t": "el proceso de distribuir las entradas de una organización (recursos humanos y económicos) mediante la planeación, organización, dirección y control, con el fin de producir las salidas (bienes y servicios) deseadas por sus clientes, de manera que se cumplan los objetivos de la organización.", "doc": "U3-3", "page": 4}, {"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "Es el fundamento para el proceso de planeación.", "doc": "U3-1", "page": 5}]}, "SCG|GD": {"a": "SCG", "b": "GD", "link": "El sistema de gestión del desempeño es en sí un marco de control: controla objetivos y metas mediante planificación, análisis, medición y control.", "quotes": [{"t": "Los sistemas de control de gestión abarcan medidas de desempeño tanto financieras como no financieras.", "doc": "U3-2", "page": 8}, {"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}, {"t": "Los sistemas de gestión del desempeño (SGD) se consideran como mecanismos, procesos, sistemas y estructuras que utilizan las organizaciones para controlar los objetivos clave y las metas planeadas por la administración, estos mecanismos ayudan al proceso de implementación de la estrategia y la gestión a través de la planificación, análisis, medición y control, impulsando de esta manera factores como la motivación, la gestión amplia del rendimiento, el aprendizaje organizacional y la gestión del cambio.", "doc": "U3-2", "page": 4}, {"t": "Siguiendo con SGD, es un marco de control que intenta garantizar que determinados fines sean alcanzados, y está influenciado por una racionalidad determinada.", "doc": "U3-2", "page": 5}, {"t": "Las relaciones entre sistemas de control de gestión y desempeño organizacional se reflejan en determinados ítems que proporcionan una visión general de los problemas de gestión del desempeño de una organización.", "doc": "U3-2", "page": 10}]}, "SCG|DOR": {"a": "SCG", "b": "DOR", "link": "Los sistemas de control de gestión se relacionan directamente con el desempeño organizacional: dan cuenta de si se alcanzan los objetivos y retroalimentan los factores que lo impulsan.", "quotes": [{"t": "Los sistemas de control de gestión se relacionan de manera directa con el desempeño organizacional e impactan sobre la estrategia empresarial, buscan lograr su cumplimiento para llegar a un desempeño deseado.", "doc": "U3-2", "page": 3}, {"t": "El control de gestión se relaciona con la intencionalidad de mejoramiento y de desempeño positivo que tienen los directivos de la organización, el desempeño se relaciona a su vez con el cumplimiento de los objetivos y de la estrategia, ya que la calificación que se le dé al desempeño depende de si se alcanzan de manera adecuada los objetivos, dando los sistemas de control de gestión cuenta de ello.", "doc": "U3-2", "page": 10}, {"t": "Dado lo anterior, los SCG colaboran en el logro de los objetivos con un rendimiento determinado, ya que aseguran y retroalimentan los factores que impulsan el desempeño.", "doc": "U3-2", "page": 10}, {"t": "El desempeño organizacional, por tanto, no sólo está relacionado con el rendimiento financiero, sino que está relacionado también con todos aquellos factores que lo pueden afectar al interior de la organización.", "doc": "U3-2", "page": 10}]}, "GD|DOR": {"a": "GD", "b": "DOR", "link": "La gestión del desempeño es el enfoque que planifica, supervisa, mide y revisa el desempeño de la organización para lograr sus mejores resultados.", "quotes": [{"t": "La gestión del desempeño pretende el logro de los mejores resultados para la organización y el aprovechamiento de sus recursos, de manera que el resultado se logre de manera efectiva. La visión hacia el desempeño crea una visión compartida de lo que se debe lograr, de manera tal que se aumente la probabilidad de que los objetivos se cumplan.", "doc": "U3-2", "page": 4}, {"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}, {"t": "Las formas de medición constituyen un elemento fundamental para dar cuenta del desempeño organizacional, a este respecto se identifica que una medida es el instrumento utilizado para cuantificar la eficiencia y la efectividad de la acción, por lo tanto, una medida de rendimiento es a la vez cuantificable y verificable.", "doc": "U3-2", "page": 5}, {"t": "El desempeño organizacional, por tanto, no sólo está relacionado con el rendimiento financiero, sino que está relacionado también con todos aquellos factores que lo pueden afectar al interior de la organización.", "doc": "U3-2", "page": 10}]}, "DOR|KPI": {"a": "DOR", "b": "KPI", "link": "Los indicadores son el instrumento para medir y dar cuenta del desempeño organizacional, y no se limitan a la información financiera.", "quotes": [{"t": "El desempeño organizacional, por tanto, no sólo está relacionado con el rendimiento financiero, sino que está relacionado también con todos aquellos factores que lo pueden afectar al interior de la organización.", "doc": "U3-2", "page": 10}, {"t": "Las formas de medición constituyen un elemento fundamental para dar cuenta del desempeño organizacional, a este respecto se identifica que una medida es el instrumento utilizado para cuantificar la eficiencia y la efectividad de la acción, por lo tanto, una medida de rendimiento es a la vez cuantificable y verificable. Para medir son utilizados indicadores que se componen de tres elementos que los hacen más que una medida de desempeño", "doc": "U3-2", "page": 5}, {"t": "Los indicadores que miden el desempeño organizacional, no se encuentran de manera exclusiva en la información financiera; factores como la cuota de mercado, calidad, innovación, mediciones de clientes, mediciones de empleados, entre otros, reflejan la situación de la empresa y la posibilidad de crecimiento mejor que la información registrada en la contabilidad financiera.", "doc": "U3-2", "page": 8}]}, "DOR|ESTR": {"a": "DOR", "b": "ESTR", "link": "El desempeño se califica según el cumplimiento de los objetivos y de la estrategia, que es el punto de partida común de toda la relación.", "quotes": [{"t": "El desempeño organizacional, por tanto, no sólo está relacionado con el rendimiento financiero, sino que está relacionado también con todos aquellos factores que lo pueden afectar al interior de la organización.", "doc": "U3-2", "page": 10}, {"t": "el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}, {"t": "el desempeño se relaciona a su vez con el cumplimiento de los objetivos y de la estrategia, ya que la calificación que se le dé al desempeño depende de si se alcanzan de manera adecuada los objetivos, dando los sistemas de control de gestión cuenta de ello.", "doc": "U3-2", "page": 10}, {"t": "La meta de los sistemas de medición de desempeño, es implantar la estrategia, por lo tanto los directivos seleccionan las medidas que representen mejor la estrategia de la empresa, es decir las medidas que den cuenta de los factores básicos de éxito actual y futuro, de tal modo son un mecanismo que mejora la probabilidad de que la organización ponga en marcha su estrategia con éxito.", "doc": "U3-2", "page": 10}]}, "GD|KPI": {"a": "GD", "b": "KPI", "link": "Para que el sistema de gestión del desempeño mida el progreso y detecte desvíos deben establecerse KPI's o indicadores.", "quotes": [{"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}, {"t": "Tienen que establecerse los KPI´s o indicadores que marcaran su progreso en las diferentes etapas o posibles correcciones que se deban realizar.", "doc": "U3-2", "page": 5}, {"t": "Para medir son utilizados indicadores que se componen de tres elementos que los hacen más que una medida de desempeño:\n\n    ●   El primer elemento es que es una medida de desempeño cuantifica lo que sucede\n    ●   El segundo elemento es que se constituye en una norma de rendimiento que considera si el rendimiento que se obtiene es malo o bueno, esto hace que sea una herramienta para guiar a la dirección de la organización;\n\n    ●   Y por último establece las consecuencias negativas de estar por debajo o por encima de las metas.", "doc": "U3-2", "page": 5}, {"t": "Al documentar la planeación estratégica y sus diferentes etapas y mediciones, será necesario que se establezcan los objetivos a mediano plazo, ya que, en el SGD se debe poder contar con las mediciones correspondientes, a fin, de evaluar posibles modificaciones o desvíos que se estén produciendo.", "doc": "U3-2", "page": 4}]}, "GD|TC": {"a": "GD", "b": "TC", "link": "El tablero de comando es un ejemplo de sistema de medición del desempeño: asigna metas y las mide desde cuatro perspectivas, financieras y no financieras.", "quotes": [{"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}, {"t": "El tablero de comando que veremos más adelante es un ejemplo de sistema medición del desempeño, la propuesta de este enfoque es asignar metas a las unidades de negocio y después medirlas de acuerdo a cuatro perspectivas:\n\n   1. Perspectiva financiera: márgenes de utilidad, rendimiento sobre los activos, flujo de efectivo, etc.\n\n   2. Perspectiva de clientes: participación de mercado, índice de satisfacción del cliente, etc.\n   3. Perspectiva de procesos internos: retención de empleados, reducción del ciclo de producción, etc.\n\n   4. Perspectiva de innovación y aprendizaje: porcentaje de ventas de productos nuevos, entre otros.", "doc": "U3-2", "page": 9}, {"t": "Depender de un solo tipo de medida de rendimiento no asegura que la estrategia se ejecute de manera exitosa, es por eso que se plantea utilizar medidas del desempeño financieras y no financieras, es decir asumir un enfoque múltiple de medición en diferentes áreas y niveles de la organización", "doc": "U3-2", "page": 9}]}, "KPI|BEN": {"a": "KPI", "b": "BEN", "link": "Los indicadores permiten comparaciones externas con otras empresas; esa comparación con las mejores prácticas es el benchmarking.", "quotes": [{"t": "una medida es el instrumento utilizado para cuantificar la eficiencia y la efectividad de la acción, por lo tanto, una medida de rendimiento es a la vez cuantificable y verificable. Para medir son utilizados indicadores que se componen de tres elementos que los hacen más que una medida de desempeño", "doc": "U3-2", "page": 5}, {"t": "Los indicadores de desempeño otorgan la posibilidad de establecer patrones de comparación internos y externos, se compara las referencias internas de la organización con el desempeño obtenido, y el desempeño obtenido con un enfoque orientado hacia el exterior para introducir mejoras.", "doc": "U3-2", "page": 8}, {"t": "La ventaja de la comparación externa es la identificación de prácticas óptimas (competidores y/o empresas de otros sectores), que son tomadas como ejemplos para mejorar las prácticas propias (benchmarking). Los índices de referencia internos pueden ser complementados por índices externos que permiten tener una visión de la organización dentro de su entorno económico.", "doc": "U3-2", "page": 8}]}, "SCG|ESTR": {"a": "SCG", "b": "ESTR", "link": "Los sistemas de control de gestión impactan sobre la estrategia y buscan su cumplimiento: su meta es implantarla con éxito.", "quotes": [{"t": "Los sistemas de control de gestión se relacionan de manera directa con el desempeño organizacional e impactan sobre la estrategia empresarial, buscan lograr su cumplimiento para llegar a un desempeño deseado.", "doc": "U3-2", "page": 3}, {"t": "el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}, {"t": "La meta de los sistemas de medición de desempeño, es implantar la estrategia, por lo tanto los directivos seleccionan las medidas que representen mejor la estrategia de la empresa, es decir las medidas que den cuenta de los factores básicos de éxito actual y futuro, de tal modo son un mecanismo que mejora la probabilidad de que la organización ponga en marcha su estrategia con éxito.", "doc": "U3-2", "page": 10}, {"t": "Para identificar las variables críticas para el rendimiento correcto, es necesario analizar la estrategia prevista de la empresa y los objetivos específicos asociados con esa estrategia.", "doc": "U3-2", "page": 9}]}, "PL|ESTR": {"a": "PL", "b": "ESTR", "link": "La planeación estratégica traduce la estrategia en objetivos y metas de largo plazo; la estrategia se plasma en objetivos, planes y programas.", "quotes": [{"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "Tengamos presente que para que el SGD arroje los resultados que esperamos medir, previamente la organización tuvo que haber trabajo en definir su planeación estratégica. Esta define los objetivos y las metas que espera alcanzar a largo plazo y ayuda a tener una visión realista del futuro del negocio. También de esta manera se guiará de manera correcta los esfuerzos de todos los colaboradores que conformen la organización al objetivo organizacional.", "doc": "U3-2", "page": 4}, {"t": "Es quien guía los objetivos de los equipos que componen a la organización, cada objetivo departamental debe aportar a los objetivos estratégicos.", "doc": "U3-2", "page": 5}, {"t": "el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}]}, "SCG|RET": {"a": "SCG", "b": "RET", "link": "El control de gestión exige una retroalimentación continua: los SCG retroalimentan los factores que impulsan el desempeño.", "quotes": [{"t": "Los sistemas de control de gestión abarcan medidas de desempeño tanto financieras como no financieras.", "doc": "U3-2", "page": 8}, {"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema.", "doc": "U3-1", "page": 12}, {"t": "La necesidad de controlar la gestión y de una retroalimentación continua requiere que se midan y se elaboren evaluaciones del desempeño a nivel general y a nivel de las unidades de negocio de la organización.", "doc": "U3-2", "page": 9}, {"t": "Dado lo anterior, los SCG colaboran en el logro de los objetivos con un rendimiento determinado, ya que aseguran y retroalimentan los factores que impulsan el desempeño.", "doc": "U3-2", "page": 10}, {"t": "¿Qué flujos de información de retroalimentación ha ideado la organización por sí misma? ¿Qué tipo de flujos de información de retroalimentación han sido creados para vigilar el desempeño actual y el logro de la adaptación de la conducta actual?", "doc": "U3-2", "page": 11}]}, "IES|NIV": {"a": "IES", "b": "NIV", "link": "La información estratégica es el tipo de información que corresponde a los niveles gerenciales altos.", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son:\n\n   ● Información operativa para los niveles gerenciales bajos.\n   ● Información táctica para los niveles gerenciales medios.\n   ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "Un hecho generalmente aceptado es que la información interna debe ser cada vez más resumida conforme el nivel gerencial, para el cual es preparada, aumenta en la estructura jerárquica, y la alta gerencia recibirá reportes resúmenes.", "doc": "U3-3", "page": 5}]}, "ITA|NIV": {"a": "ITA", "b": "NIV", "link": "La información táctica es el tipo de información que corresponde a los niveles gerenciales medios.", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son:\n\n   ● Información operativa para los niveles gerenciales bajos.\n   ● Información táctica para los niveles gerenciales medios.\n   ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "El tipo de información a ser suministrada se establecerá en base a la posición relativa del gerente en la jerarquía de la organización y en las actividades que describe la información (el ambiente interno de la organización o el ambiente externo en el cual opera).", "doc": "U3-3", "page": 5}]}, "IOP|NIV": {"a": "IOP", "b": "NIV", "link": "La información operativa es el tipo de información que corresponde a los niveles gerenciales bajos, orientados al control.", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son:\n\n   ● Información operativa para los niveles gerenciales bajos.\n   ● Información táctica para los niveles gerenciales medios.\n   ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}]}, "IES|PL": {"a": "IES", "b": "PL", "link": "La información estratégica es la de la alta gerencia, cuyo objetivo es la planeación, que requiere más información del entorno externo.", "quotes": [{"t": "Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}, {"t": "La información relacionada con el ambiente externo a la organización debe ser resumida en forma exactamente opuesta a lo descrito para el ambiente interno. Esto es, dado que los niveles gerenciales superiores se ocupan de la planeación y dado que la planeación requiere de mayor cantidad de información concerniente al entorno externo, la información relativa al entorno externo deberá ser cada vez más resumida y selectiva conforme la posición del receptor sea menor dentro de la jerarquía gerencial.", "doc": "U3-3", "page": 5}]}, "IOP|CT": {"a": "IOP", "b": "CT", "link": "La información operativa es la de los niveles gerenciales bajos, cuyos datos internos tienen por objetivo el control.", "quotes": [{"t": "Información operativa para los niveles gerenciales bajos.", "doc": "U3-3", "page": 5}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}]}, "NIV|PL": {"a": "NIV", "b": "PL", "link": "Según el nivel gerencial cambia el objetivo: la alta gerencia tiene por objetivo la planeación, y los tiempos de planeación y control se complementan entre niveles.", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia.", "doc": "U3-3", "page": 5}, {"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}, {"t": "De esta forma, los tiempos dedicados a la planeación y el control por los niveles gerenciales inferiores, medios y superiores se complementan mutuamente en un sistema de información gerencial.", "doc": "U3-3", "page": 6}]}, "NIV|CT": {"a": "NIV", "b": "CT", "link": "Los niveles gerenciales inferiores y medios tienen por objetivo el control, por eso reciben información interna más detallada.", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia.", "doc": "U3-3", "page": 5}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}, {"t": "De esta forma, los tiempos dedicados a la planeación y el control por los niveles gerenciales inferiores, medios y superiores se complementan mutuamente en un sistema de información gerencial.", "doc": "U3-3", "page": 6}]}, "FLU|FV": {"a": "FLU", "b": "FV", "link": "El flujo vertical es un modelo de flujo de información en el que la información sube y las órdenes bajan por la jerarquía.", "quotes": [{"t": "En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos:", "doc": "U3-3", "page": 8}]}, "FLU|FH": {"a": "FLU", "b": "FH", "link": "El modelo horizontal es el otro modelo de flujo de información: la información circula entre iguales en lugar de subir y bajar.", "quotes": [{"t": "En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos:", "doc": "U3-3", "page": 8}, {"t": "Cada vez es más claro que para que una empresa funcione es esencial que cada persona disponga de la información que requiere para el ejercicio de su función, sea cual sea ésta.", "doc": "U3-3", "page": 10}]}, "FV|FH": {"a": "FV", "b": "FH", "link": "El texto plantea la sustitución del modelo de flujo vertical por el modelo horizontal de información entre iguales.", "quotes": [{"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos:", "doc": "U3-3", "page": 8}, {"t": "Por lo tanto, todos deben ser considerados consumidores, procesadores y generadores de información. Todo esto lleva a considerar una modificación que incorpora tanto la disminución del número de niveles directivos como la ampliación de las atribuciones informacionales de una parte importante de los miembros de la empresa.", "doc": "U3-3", "page": 10}]}, "EJE|FV": {"a": "EJE", "b": "FV", "link": "En el esquema jerárquico la información fluye bottom-up y las órdenes top-down: ese es el flujo vertical de información.", "quotes": [{"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc. En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales)", "doc": "U3-3", "page": 8}]}, "EJE|ACH": {"a": "EJE", "b": "ACH", "link": "El esquema jerárquico resulta poco adecuado para la complejidad actual, que exige achatar la pirámide jerárquica con menos mandos intermedios.", "quotes": [{"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc.", "doc": "U3-3", "page": 8}, {"t": "Pero en la actualidad este esquema de mando jerárquico resulta poco adecuado para manejar la complejidad de muchas empresas en la que es preciso que las decisiones se tomen donde se presenta el problema y no en algún nivel superior en la escala jerárquica.", "doc": "U3-3", "page": 8}, {"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos), achatamiento que será más o menos pronunciado según el tipo de empresa de que se trate.", "doc": "U3-3", "page": 8}]}, "EJE|CT": {"a": "EJE", "b": "CT", "link": "El esquema jerárquico se apoya en nociones como control, mando y autoridad; el control es una de sus ideas constitutivas.", "quotes": [{"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc. En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}]}, "ACH|FH": {"a": "ACH", "b": "FH", "link": "El achatamiento de la pirámide es el cambio de estructura que conlleva reemplazar el flujo vertical por el modelo horizontal de información.", "quotes": [{"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos), achatamiento que será más o menos pronunciado según el tipo de empresa de que se trate.", "doc": "U3-3", "page": 8}, {"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos:", "doc": "U3-3", "page": 8}, {"t": "Todo esto lleva a considerar una modificación que incorpora tanto la disminución del número de niveles directivos como la ampliación de las atribuciones informacionales de una parte importante de los miembros de la empresa.", "doc": "U3-3", "page": 10}]}, "GC|TAC": {"a": "GC", "b": "TAC", "link": "La gestión del conocimiento se ocupa de convertir el conocimiento tácito, que vive en la experiencia de las personas, en explícito y disponible para todos.", "quotes": [{"t": "La gestión del conocimiento se ocupa precisamente de la identificación, captura, recuperación, presentación y transmisión de los datos, informaciones y conocimientos de la organización.", "doc": "U3-3", "page": 11}, {"t": "El conocimiento puede ser explícito - cuando está plasmado en documentos, procedimientos, bases de datos de información, etc. o tácito - cuando forma parte de la experiencia de los individuos que trabajan en la empresa. Una empresa con experiencia en la administración de conocimientos se preocupa por convertir el conocimiento tácito en explícito y, para ello, lo organiza y lo pone a disposición de todos de manera comprensible.", "doc": "U3-3", "page": 13}]}, "GC|OA": {"a": "GC", "b": "OA", "link": "Gestionar el conocimiento es lo que hace de una empresa una organización que aprende: las líderes gestionan conocimiento y mejoran su capacidad de aprendizaje.", "quotes": [{"t": "mediante la identificación y perfeccionamiento de los flujos de información útiles mediante la gestión del conocimiento.\n\nLa gestión del conocimiento se ocupa precisamente de la identificación, captura, recuperación, presentación y transmisión de los datos, informaciones y conocimientos de la organización. La información puede captarse, tanto desde el interior como del exterior de la empresa. El objetivo es que el conocimiento que reside en la organización pueda utilizarse por aquellos que lo necesitan para actuar de manera adecuada en cada momento.\n\nUna organización que aspire a competir con éxito, debe ser una organización que aprenda; debe, también, revelar los procesos que le permitan incorporar a su actividad, la información pertinente y relevante que posee.", "doc": "U3-3", "page": 11}, {"t": "Las empresas líderes son actualmente aquellas que, dentro de sí, gestionan conocimiento y mejoran su capacidad de aprendizaje. El conocimiento en una organización es mucho más que simples datos e información, es el recurso de los individuos y grupos para tomar decisiones y por ello, uno de sus principales activos estratégicos.", "doc": "U3-3", "page": 12}]}, "GC|IAG": {"a": "GC", "b": "IAG", "link": "La gestión del conocimiento también capta información del exterior: la información ambiental (general y específica) del entorno que rodea a la empresa.", "quotes": [{"t": "La gestión del conocimiento se ocupa precisamente de la identificación, captura, recuperación, presentación y transmisión de los datos, informaciones y conocimientos de la organización. La información puede captarse, tanto desde el interior como del exterior de la empresa.", "doc": "U3-3", "page": 11}, {"t": "Estas necesidades están condicionadas por el importante cúmulo de información que rodea a la empresa y de la que no puede aislarse para establecer sus metas, objetivos, mercados, etcétera. Implica la información del entorno en el que suelen establecerse dos niveles de análisis: uno, social o general (con información ambiental general) y otro, para tareas específicas (información ambiental específica).", "doc": "U3-3", "page": 14}, {"t": "La información ambiental general es aquella que su relación con la organización es más remota, con ella no se relaciona a diario, pero debe observársele con sistematicidad porque puede incidir en los cambios, políticas y estrategias de la empresa a mediano o largo plazo.", "doc": "U3-3", "page": 15}, {"t": "La información ambiental específica es aquella que la empresa toma o analiza de su entorno más cercano, la que se encuentra en el escenario inmediato de actuación para la organización y que incide directamente en la definición de sus políticas y estrategias, como por ejemplo clientes, proveedores, distribuidores, financiadores, reguladores (autoridades públicas) y competidores.", "doc": "U3-3", "page": 15}]}, "MM|CU": {"a": "MM", "b": "CU", "link": "Los modelos mentales de cada persona (U1) condicionan cómo interpreta y actúa dentro de la organización, y por eso la unidad de cultura los retoma para explicar el comportamiento del personal.", "quotes": [{"t": "Los modelos mentales son representaciones internas de una realidad externa. Son concepciones generales, que dirigen nuestros actos y que somos capaces de construir a partir de la experiencia.", "doc": "U1-3", "page": 15}, {"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Los modelos mentales son indispensables para comprender el modo de actuar de las personas que colaboran en una organización porque no solo determinan el modo de interpretar el mundo sino también de actuar.", "doc": "U2-1", "page": 17}, {"t": "Si analizamos esta situación desde una perspectiva de empresa, encontramos estrecha relación con el comportamiento de las personas en las organizaciones ya que cuando un director general solicita a sus gerentes o subordinados que desarrollen una nueva estrategia, un plan para llegar a la meta o bien, herramientas que soporten el crecimiento, todas las personas involucradas en esta tarea, deberán proporcionar una idea sobre cómo implementar acciones que contribuyan al éxito de la empresa, sin embargo cada persona responderá de acuerdo a su modelo mental.", "doc": "U2-1", "page": 17}]}, "ELS|CRE": {"a": "ELS", "b": "CRE", "link": "Para Elster las creencias son la base de las preferencias desde las que se decide, y la unidad de cultura las define como elemento básico de la cultura organizacional.", "quotes": [{"t": "La racionalidad elsteriana, es aquella que permite estudiar detenida y exhaustivamente la naturaleza sustancial de los deseos y las creencias involucradas en la generación de la escala de preferencias desde la que se toman las decisiones humanas.", "doc": "U1-2", "page": 9}, {"t": "Creencia es la percepción de las personas entre una acción y sus consecuencias. Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}, {"t": "La falta de información, o de acceso a la misma, por parte del agente decisor, puede llevarlo a tener creencias sesgadas o erróneas de los objetivos de la organización, generando con ello un conflicto con sus fines particulares.", "doc": "U1-2", "page": 8}, {"t": "Sin lugar a duda, las emociones, los deseos, las creencias e incluso el arraigo cultural ejercen una influencia notoria en las decisiones que se toman dentro de la organización.", "doc": "U1-2", "page": 9}]}, "TRC|TR": {"a": "TRC", "b": "TR", "link": "La tolerancia al riesgo individual del decisor (U1) tiene su correlato organizacional en la tolerancia del riesgo como rasgo que diferencia a las culturas (U2).", "quotes": [{"t": "Tolerancia del riesgo: El grado en el que los empleados son animados a ser proactivos, innovadores y a asumir riesgos.", "doc": "U2-1", "page": 7}, {"t": "Por otro lado, la tolerancia al riesgo es la capacidad de aceptar riesgo; es el nivel de riesgo que un individuo u organización puede o está dispuesto a soportar. Cada persona es diferente en cuanto a la tolerancia al riesgo y tener conciencia de ello generará un proceso más suave y eficiente en la toma de decisiones.", "doc": "U1-3", "page": 14}, {"t": "Ser conscientes de nuestra tolerancia nos facilitará elegir la alternativa con el nivel adecuado de riesgo para nosotros.", "doc": "U1-3", "page": 14}]}, "ERA|LID": {"a": "ERA", "b": "LID", "link": "La era del conocimiento se caracteriza porque la dirección pasa a basarse en el liderazgo y los estilos de dirección evolucionan, estilos que la unidad de cultura describe como delimitados por la cultura organizacional.", "quotes": [{"t": "Los cambios que se suceden desde el siglo pasado en las esferas económica, social, cultural y de mercado llevan a que todas las organizaciones manejen información, una notable transformación en la que la base es el conocimiento, se vive una nueva era, la \"Era del conocimiento\".", "doc": "U1-2", "page": 6}, {"t": "Dicha era se caracteriza por una serie de cambios constantes en lo que a los procesos gerenciales respecta: ● La dirección se basa en el liderazgo. ● Los estilos de dirección evolucionan. ● Los directivos se convierten en facilitadores. ● Se trabaja en entornos participativos y de colaboración que compromete a todos los miembros de la organización. ● La gestión es estratégica y presenta un enfoque sistémico. ● Las estructuras son cada vez más planas. ● Las estrategias tienen mayor orientación al cliente.", "doc": "U1-2", "page": 6}, {"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos. El líder se interrelaciona con la comunidad organizacional y con los colaboradores a cargo en función a los valores establecidos, conductas y expectativas que se espera de la persona que ocupa cada posición y viceversa.", "doc": "U2-1", "page": 7}]}, "ERA|ACH": {"a": "ERA", "b": "ACH", "link": "Entre los cambios de la era del conocimiento el texto enumera estructuras cada vez más planas, que la unidad III describe como achatamiento de la pirámide jerárquica.", "quotes": [{"t": "Los cambios que se suceden desde el siglo pasado en las esferas económica, social, cultural y de mercado llevan a que todas las organizaciones manejen información, una notable transformación en la que la base es el conocimiento, se vive una nueva era, la \"Era del conocimiento\".", "doc": "U1-2", "page": 6}, {"t": "Dicha era se caracteriza por una serie de cambios constantes en lo que a los procesos gerenciales respecta: ● La dirección se basa en el liderazgo. ● Los estilos de dirección evolucionan. ● Los directivos se convierten en facilitadores. ● Se trabaja en entornos participativos y de colaboración que compromete a todos los miembros de la organización. ● La gestión es estratégica y presenta un enfoque sistémico. ● Las estructuras son cada vez más planas. ● Las estrategias tienen mayor orientación al cliente.", "doc": "U1-2", "page": 6}, {"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos), achatamiento que será más o menos pronunciado según el tipo de empresa de que se trate.", "doc": "U3-3", "page": 8}]}, "CU|TD": {"a": "CU", "b": "TD", "link": "La cultura es un factor interno que el decisor debe conocer y que influye en sus decisiones, y a la vez los sistemas de apoyo a las decisiones son un mecanismo que crea y sostiene la cultura.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Tener información exacta y actualizada de los factores internos formales de la organización (cultura, manuales de procedimientos, políticas, estructura, recursos disponibles, etc.) y los informales (políticas implícitas, hábitos, experiencia, costumbres, etc.)", "doc": "U1-2", "page": 12}, {"t": "Sin lugar a duda, las emociones, los deseos, las creencias e incluso el arraigo cultural ejercen una influencia notoria en las decisiones que se toman dentro de la organización.", "doc": "U1-2", "page": 9}, {"t": "Sistemas y procedimientos organizacionales, como los tipos de información, control y los sistemas de apoyo a las decisiones en términos de categorías de información, ciclos de tiempo, la persona a quien se destina la información, el momento y la manera de efectuar la evaluación del desempeño y otros procesos valorativos transmiten mensajes implícitos de lo que los líderes suponen y aprecian.", "doc": "U2-1", "page": 17}]}, "ENT|TD": {"a": "ENT", "b": "TD", "link": "Los elementos externos del entorno afectan directamente el proceso de toma de decisiones y pasan a considerarse elementos de ese proceso.", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "El entorno tiene una estrecha correlación con todo lo que se realiza en una organización, ya que todos los elementos externos afectan los procesos de planeación, diseño organizacional, cambio organizacional, toma de decisiones, clima organizacional, entre otros, que exigen una continua adaptación al medio a los fines de aprovechar las circunstancias que éste presenta.", "doc": "U2-3", "page": 6}, {"t": "Durante mucho tiempo las teorías administrativas no le concedieron mayor importancia al ambiente externo, pero con el desarrollo del enfoque de sistemas y de contingencias, el entorno o el medio ambiente de la empresa si empieza a cobrar importancia, y entonces las variables sociales, culturales, tecnológicas, económicas, políticas, etcétera, empiezan a ser analizadas por los empresarios, y comienzan a ser consideradas como importantes elementos de proceso de toma decisiones.", "doc": "U2-3", "page": 9}]}, "ENF|TD": {"a": "ENF", "b": "TD", "link": "Los enfoques éticos describen cómo los gerentes ponderan (o ignoran) la faceta ética de sus decisiones de negocios, y por eso son un marco para la toma de decisiones.", "quotes": [{"t": "La ética administrativa tiene su enfoque utilitario en la ética de los negocios y las disciplinas administrativas, teniendo como principal compromiso ético que se aplique a la misma organización, principalmente a la rentabilidad, que es lo que la empresa debe hacer para sí misma.", "doc": "U2-2", "page": 14}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Administración amoral: Está integrada por aquellos gerentes que no tienen conciencia de que sus decisiones de negocios cotidianos pueden producir efectos nocivos en las otras personas relacionadas directamente con la empresa, además carecen de precepción o conciencia ética, por lo que actúan en la organización sin pensar que sus actos tienen una faceta ética, por lo que les califica de negligentes o insensibles a las implicaciones de sus actos, en general tienen buenas intenciones pero no se dan cuenta que sus decisiones y actos dañan aquellos con los que celebran transacciones.", "doc": "U2-2", "page": 15}, {"t": "En la ética normativa, donde tocamos el punto de lo que los gerentes deben hacer, siempre habrá que considerar a las leyes en el actuar de un gerente buscando no afectar la relación entre los individuos o la afectación al establecimiento de una buena sociedad. En muchas ocasiones la justicia y la ética toman acciones diferentes en una decisión.", "doc": "U2-2", "page": 16}]}, "IE|LID": {"a": "IE", "b": "LID", "link": "La inteligencia emocional es una competencia del líder para gestionar sus emociones y las del equipo, y el estilo de liderazgo es el modo en que ese líder se relaciona con sus colaboradores.", "quotes": [{"t": "Para evitar que esto suceda es primordial que en las posiciones que se requiera tomar decisiones se trabaje con la visión de desarrollar la \"inteligencia emocional\". Desarrollar esta competencia permitirá al líder reconocer, comprender y gestionar sus emociones y las del equipo a cargo.", "doc": "U1-3", "page": 16}, {"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos. El líder se interrelaciona con la comunidad organizacional y con los colaboradores a cargo en función a los valores establecidos, conductas y expectativas que se espera de la persona que ocupa cada posición y viceversa.", "doc": "U2-1", "page": 7}, {"t": "Potenciar el desarrollo de sus Líderes, contar con un equipo de líderes que tengan las competencias necesarias para gestionar equipos desde la virtualidad, potenciando el espíritu emprendedor para que trabajen con autonomía, resolución y enfoque a objetivo, sin abandonar el trabajo en equipo y colaborativo.", "doc": "U2-3", "page": 14}]}, "LID|EMP": {"a": "LID", "b": "EMP", "link": "El empowerment es una forma de ejercer el liderazgo (delegar y compartir responsabilidad), y el texto señala que las formas de cada equipo dependen del estilo de liderazgo del líder.", "quotes": [{"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos. El líder se interrelaciona con la comunidad organizacional y con los colaboradores a cargo en función a los valores establecidos, conductas y expectativas que se espera de la persona que ocupa cada posición y viceversa.", "doc": "U2-1", "page": 7}, {"t": "Trabajar con un enfoque en el empowerment supone y aporta a que los líderes tengan la capacidad de delegar de manera eficiente, a fin, de trabajar con un equipo enfocado en las responsabilidades que implica la posición que ocupan. Sumado a ello implica que los líderes al delegar comparten su responsabilidad con su equipo, conformando así equipos con mayor autonomía haciéndolos consciente del impacto de sus acciones.", "doc": "U1-4", "page": 4}, {"t": "Iniciativa individual: El grado de responsabilidad, libertad e independencia que tienen los individuos.", "doc": "U2-1", "page": 7}, {"t": "También es necesario tener presente que cada equipo de trabajo puede adoptar o mantener formas distintas a otras, va a estar afectado este punto por el estilo de liderazgo del líder.", "doc": "U2-1", "page": 6}]}, "INFO|IES": {"a": "INFO", "b": "IES", "link": "La información estratégica es el tipo de información que la unidad III asigna a la alta gerencia, cuyo objetivo es la planeación y que requiere más información del entorno externo.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son: ● Información operativa para los niveles gerenciales bajos. ● Información táctica para los niveles gerenciales medios. ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}, {"t": "Esto es, dado que los niveles gerenciales superiores se ocupan de la planeación y dado que la planeación requiere de mayor cantidad de información concerniente al entorno externo, la información relativa al entorno externo deberá ser cada vez más resumida y selectiva conforme la posición del receptor sea menor dentro de la jerarquía gerencial.", "doc": "U3-3", "page": 5}]}, "INFO|ITA": {"a": "INFO", "b": "ITA", "link": "La información táctica es el tipo de información que la unidad III asigna a los niveles gerenciales medios, según la posición del gerente en la jerarquía.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son: ● Información operativa para los niveles gerenciales bajos. ● Información táctica para los niveles gerenciales medios. ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "El tipo de información a ser suministrada se establecerá en base a la posición relativa del gerente en la jerarquía de la organización y en las actividades que describe la información (el ambiente interno de la organización o el ambiente externo en el cual opera). Un hecho generalmente aceptado es que la información interna debe ser cada vez más resumida conforme el nivel gerencial, para el cual es preparada, aumenta en la estructura jerárquica, y la alta gerencia recibirá reportes resúmenes.", "doc": "U3-3", "page": 5}]}, "INFO|IOP": {"a": "INFO", "b": "IOP", "link": "La información operativa es el tipo de información que la unidad III asigna a los niveles gerenciales bajos, orientados al control.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia. Estos tipos son: ● Información operativa para los niveles gerenciales bajos. ● Información táctica para los niveles gerenciales medios. ● Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control; por su parte y como ya hemos visto, la alta gerencia tiene por objetivo la planeación.", "doc": "U3-3", "page": 5}]}, "INFO|FLU": {"a": "INFO", "b": "FLU", "link": "El flujo de información es el modo en que la información circula por la estructura para que cada miembro disponga de la que necesita para decidir.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc. En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "Cada vez es más claro que para que una empresa funcione es esencial que cada persona disponga de la información que requiere para el ejercicio de su función, sea cual sea ésta. Más concretamente, todos los miembros de la empresa, y no sólo los directivos, realizan en mayor o menor medida, cuatro funciones informacionales básicas:", "doc": "U3-3", "page": 10}, {"t": "Por lo tanto, todos deben ser considerados consumidores, procesadores y generadores de información.", "doc": "U3-3", "page": 10}]}, "INFO|INFX": {"a": "INFO", "b": "INFX", "link": "La infoxicación muestra que el exceso de información sin calidad ni visibilidad entorpece la decisión, en línea con la regla 40/70 que advierte contra esperar información total.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "La explosión de la información constituye para muchos un problema y por eso surgió el término \"infoxicación\", precisamente para referirse a dicho fenómeno desde la perspectiva del usuario. Es difícil para un individuo común sentirse rodeado de información, no disponer de las herramientas necesarias que viabilicen su consulta y, sobre todo, decidir cuál es realmente útil y reúne los requisitos de calidad necesarios.", "doc": "U3-3", "page": 10}, {"t": "El tiempo para decidir y utilizar la información que responde a sus necesidades y exigencias se prolonga más de lo planificado. El problema entonces está en la calidad y en la visibilidad de la información y no en su cantidad.", "doc": "U3-3", "page": 10}, {"t": "Lo mismo se aplica a las decisiones de negocios. Cuando un líder insiste en estudiar una situación hasta contar con la suficiente información para estar absolutamente seguro de poder tomar la decisión correcta, está aumentando la probabilidad de tomar una mala decisión.", "doc": "U1-2", "page": 4}]}, "MED|INFO": {"a": "MED", "b": "INFO", "link": "La medición del control se apoya en sistemas de información y su efectividad depende directamente de la calidad de la información recibida.", "quotes": [{"t": "La medición de resultados consiste en la aplicación de unidades de medida para evaluar la ejecución y los resultados.", "doc": "U3-1", "page": 11}, {"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Para llevar a cabo esta función se utilizan primordialmente los sistemas de información y los indicadores. La efectividad del proceso de medición dependerá directamente de la información recibida, la cual debe ser:", "doc": "U3-1", "page": 12}, {"t": "Oportuna, es decir, que se aplique a tiempo.", "doc": "U3-1", "page": 12}]}, "CT|OBJ": {"a": "CT", "b": "OBJ", "link": "El control existe para asegurar que los objetivos y planes se cumplan, y en el modelo de decisión controlar implica verificar si la acción marcha en dirección al objetivo.", "quotes": [{"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Un objetivo es una meta o finalidad a cumplir para la que se disponen medios determinados. En general, la consecución de un determinado objetivo lleva implícita la superación de obstáculos y dificultades que pueden hacer naufragar el proyecto o, al menos, dilatar su concreción.", "doc": "U1-3", "page": 8}, {"t": "El control se enfoca en evaluar y corregir el desempeño de las actividades de los subordinados para asegurar que los objetivos y planes de la organización se están llevando a cabo.", "doc": "U3-1", "page": 6}, {"t": "Controlar el proceso cuando se lleva a cabo la acción. Cuando realizamos una acción entramos en el proceso de control de lo que hacemos, en el que vamos monitorizando si el resultado actual va en el camino que esperamos o no. Si no marcha en dirección al objetivo, generamos nuevos caminos o cambiamos los planes en un proceso de toma de decisiones parecido.", "doc": "U1-3", "page": 23}]}, "GD|OBJ": {"a": "GD", "b": "OBJ", "link": "La gestión del desempeño busca aumentar la probabilidad de que los objetivos se cumplan y controla los objetivos clave; los objetivos de la decisión deben poder medirse luego.", "quotes": [{"t": "La gestión del desempeño pretende el logro de los mejores resultados para la organización y el aprovechamiento de sus recursos, de manera que el resultado se logre de manera efectiva. La visión hacia el desempeño crea una visión compartida de lo que se debe lograr, de manera tal que se aumente la probabilidad de que los objetivos se cumplan.", "doc": "U3-2", "page": 4}, {"t": "Un objetivo es una meta o finalidad a cumplir para la que se disponen medios determinados. En general, la consecución de un determinado objetivo lleva implícita la superación de obstáculos y dificultades que pueden hacer naufragar el proyecto o, al menos, dilatar su concreción.", "doc": "U1-3", "page": 8}, {"t": "No olvidemos que luego tendremos que medir el grado en que cada uno de estos objetivos es alcanzado para cada alternativa.", "doc": "U1-3", "page": 10}, {"t": "Los sistemas de gestión del desempeño (SGD) se consideran como mecanismos, procesos, sistemas y estructuras que utilizan las organizaciones para controlar los objetivos clave y las metas planeadas por la administración, estos mecanismos ayudan al proceso de implementación de la estrategia y la gestión a través de la planificación, análisis, medición y control, impulsando de esta manera factores como la motivación, la gestión amplia del rendimiento, el aprendizaje organizacional y la gestión del cambio.", "doc": "U3-2", "page": 4}]}, "EST|FLU": {"a": "EST", "b": "FLU", "link": "El flujo de la información depende del tipo de estructura organizacional: cambiar la estructura implica cambiar
