el modelo de flujo (vertical u horizontal).", "quotes": [{"t": "Es así que entendemos que una estructura organizacional debe diseñarse para determinar quién realizará cada tarea y quién será el responsable por los resultados y los objetivos por los cuales se den origen a esa tarea.", "doc": "U1-4", "page": 4}, {"t": "La información es parte del proceso de control administrativo de toda organización y pertenece a la estructura de la misma. La propuesta de aprendizaje para esta Unidad es brindar los conceptos teóricos básicos que nos permitan orientar la función de la información en las organizaciones, relacionando su flujo con los tipos de estructuras organizacionales.", "doc": "U3-3", "page": 3}, {"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información", "doc": "U3-3", "page": 8}, {"t": "Todo esto lleva a considerar una modificación que incorpora tanto la disminución del número de niveles directivos como la ampliación de las atribuciones informacionales de una parte importante de los miembros de la empresa.", "doc": "U3-3", "page": 10}]}, "EMP|ACH": {"a": "EMP", "b": "ACH", "link": "El empowerment genera equipos con mayor autonomía, que es justamente lo que exige el achatamiento de la pirámide: decidir donde aparece el problema con menos mandos intermedios.", "quotes": [{"t": "Trabajar con un enfoque en el empowerment supone y aporta a que los líderes tengan la capacidad de delegar de manera eficiente, a fin, de trabajar con un equipo enfocado en las responsabilidades que implica la posición que ocupan. Sumado a ello implica que los líderes al delegar comparten su responsabilidad con su equipo, conformando así equipos con mayor autonomía haciéndolos consciente del impacto de sus acciones.", "doc": "U1-4", "page": 4}, {"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos), achatamiento que será más o menos pronunciado según el tipo de empresa de que se trate.", "doc": "U3-3", "page": 8}, {"t": "Pero en la actualidad este esquema de mando jerárquico resulta poco adecuado para manejar la complejidad de muchas empresas en la que es preciso que las decisiones se tomen donde se presenta el problema y no en algún nivel superior en la escala jerárquica.", "doc": "U3-3", "page": 8}]}, "ACH|TD": {"a": "ACH", "b": "TD", "link": "El achatamiento de la pirámide distribuye la capacidad de decisión entre todos los miembros, lo que conecta con la toma de decisiones grupal y participativa de la unidad I.", "quotes": [{"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos), achatamiento que será más o menos pronunciado según el tipo de empresa de que se trate.", "doc": "U3-3", "page": 8}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Más concretamente, todos los miembros de la empresa, y no sólo los directivos, realizan en mayor o menor medida, cuatro funciones informacionales básicas: 1. Planificación 2. Toma de decisiones 3. Resolución de problemas 4. Evaluación de resultados", "doc": "U3-3", "page": 10}, {"t": "Actualmente se le concede cada vez más una mayor importancia a la participación de todos los elementos que integran un grupo o equipo de trabajo en la toma de decisiones, no porque se haya prescindido totalmente de la toma de decisiones hecha exclusivamente por el líder del grupo (gerente, jefe o supervisor) sino porque hay ocasiones en que se debe aprovechar el conocimiento y la experiencia de un número mayor de personas, para tomar mejores decisiones.", "doc": "U1-3", "page": 29}]}, "COR|SI": {"a": "COR", "b": "SI", "link": "Antes de corregir hay que distinguir si la desviación es un síntoma o una causa, la misma distinción síntoma/causa que estructura el análisis situacional de la decisión.", "quotes": [{"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares. Antes de iniciar la acción correctiva es importante reconocer si la desviación es un síntoma o una causa.", "doc": "U3-1", "page": 12}, {"t": "Supone determinar cuáles son los síntomas relevantes de una determinada situación o escenario de trabajo dentro de la organización, que conducirán a la sensación de que son el resultado de la existencia de un problema o causa que los provoca.", "doc": "U1-1", "page": 5}, {"t": "Para definir bien un problema es necesario buscar la causa o el conjunto de causas que expliquen mejor los síntomas o, por lo menos, su mayor número.", "doc": "U1-1", "page": 7}]}, "COR|TD": {"a": "COR", "b": "TD", "link": "La corrección es en sí misma una decisión: las decisiones sobre qué corregir son la culminación del proceso de control.", "quotes": [{"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares. Antes de iniciar la acción correctiva es importante reconocer si la desviación es un síntoma o una causa.", "doc": "U3-1", "page": 12}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Las decisiones respecto a las correcciones que deben hacerse representan la culminación del proceso de control. La acción correctiva que ajusta las operaciones a los estándares preestablecidos es la esencia del control, y su base es la información que reciben los gerentes.", "doc": "U3-1", "page": 14}]}, "TD|CT": {"a": "TD", "b": "CT", "link": "El modelo de decisión incluye controlar la acción y, si se desvía del objetivo, volver a decidir; el control administrativo cumple esa misma función de detectar y corregir desviaciones.", "quotes": [{"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Controlar el proceso cuando se lleva a cabo la acción. Cuando realizamos una acción entramos en el proceso de control de lo que hacemos, en el que vamos monitorizando si el resultado actual va en el camino que esperamos o no. Si no marcha en dirección al objetivo, generamos nuevos caminos o cambiamos los planes en un proceso de toma de decisiones parecido.", "doc": "U1-3", "page": 23}, {"t": "A esto se debe agregar que los datos deben ser lo más precisos posible. Deberá también planear detalladamente todas sus acciones y a la vez controlar sus consecuencias.", "doc": "U1-2", "page": 5}]}, "GC|TD": {"a": "GC", "b": "TD", "link": "El conocimiento que la organización gestiona es el recurso con el que individuos y grupos toman decisiones, y la unidad I ya señalaba que los datos deben convertirse en conocimiento para decidir.", "quotes": [{"t": "La gestión del conocimiento se ocupa precisamente de la identificación, captura, recuperación, presentación y transmisión de los datos, informaciones y conocimientos de la organización.", "doc": "U3-3", "page": 11}, {"t": "Una decisión es una resolución o determinación que se toma respecto a algo. Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Las empresas líderes son actualmente aquellas que, dentro de sí, gestionan conocimiento y mejoran su capacidad de aprendizaje. El conocimiento en una organización es mucho más que simples datos e información, es el recurso de los individuos y grupos para tomar decisiones y por ello, uno de sus principales activos estratégicos.", "doc": "U3-3", "page": 12}, {"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}]}, "IAG|EG": {"a": "IAG", "b": "EG", "link": "La información ambiental general es la que la empresa toma del entorno general: factores remotos (sociedad, marco económico y normativo) que afectan por igual a todas las organizaciones.", "quotes": [{"t": "Implica la información del entorno en el que suelen establecerse dos niveles de análisis: uno, social o general (con información ambiental general) y otro, para tareas específicas (información ambiental específica).", "doc": "U3-3", "page": 14}, {"t": "La información ambiental general es aquella que su relación con la organización es más remota, con ella no se relaciona a diario, pero debe observársele con sistematicidad porque puede incidir en los cambios, políticas y estrategias de la empresa a mediano o largo plazo. Pueden ser nuevas normas de comportamiento de la sociedad, el nivel de alfabetización social, las nuevas disposiciones constitucionales, el marco económico general, entre otras.", "doc": "U3-3", "page": 15}, {"t": "Entorno general: El cual afecta a todas las empresas, como lo puede ser la situación política, las variaciones en la economía, el marco jurídico-normativo, entre otros.", "doc": "U2-3", "page": 5}, {"t": "El primero afecta por igual a todas las organizaciones de cualquier sistema social, el segundo es aquel que influye sobre ellas de un modo más directo.", "doc": "U3-3", "page": 14}]}, "IAG|EE": {"a": "IAG", "b": "EE", "link": "La información ambiental específica es la que se toma del entorno específico: clientes, proveedores, competidores y demás actores del escenario inmediato de la empresa.", "quotes": [{"t": "Implica la información del entorno en el que suelen establecerse dos niveles de análisis: uno, social o general (con información ambiental general) y otro, para tareas específicas (información ambiental específica).", "doc": "U3-3", "page": 14}, {"t": "La información ambiental específica es aquella que la empresa toma o analiza de su entorno más cercano, la que se encuentra en el escenario inmediato de actuación para la organización y que incide directamente en la definición de sus políticas y estrategias, como por ejemplo clientes, proveedores, distribuidores, financiadores, reguladores (autoridades públicas) y competidores.", "doc": "U3-3", "page": 15}, {"t": "Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}, {"t": "El primero afecta por igual a todas las organizaciones de cualquier sistema social, el segundo es aquel que influye sobre ellas de un modo más directo.", "doc": "U3-3", "page": 14}]}, "CU|CT": {"a": "CU", "b": "CT", "link": "El grado de control es una característica que diferencia a las culturas, y lo que los líderes miden y controlan es uno de los mecanismos que crean y sostienen la cultura.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Control: Número de reglas y cantidad de supervisión directa que se usa para controlar el comportamiento de los empleados.", "doc": "U2-1", "page": 7}, {"t": "Aquello a lo cual los líderes prestan atención, lo que miden y controlan.", "doc": "U2-1", "page": 16}, {"t": "En la actualidad con el gran auge del trabajo virtual es necesario que las organizaciones puedan implementar el control con una visión transformadora de sus procesos. No como una herramienta de castillo o de señar a quien se equivoca, sino, cómo la oportunidad para modificar nuestros procesos y posteriormente comunicarlos y capacitar de forma correcta a quienes los implementan.", "doc": "U3-1", "page": 7}]}, "INCV|GD": {"a": "INCV", "b": "GD", "link": "La gestión del desempeño incluye preguntarse qué recompensas se obtienen por el rendimiento, es decir, el sistema de incentivos que la cultura define según criterios de rendimiento o no.", "quotes": [{"t": "Sistema de incentivos: El grado en el que los incentivos (aumentos de salario, promociones, etc.) se basan en criterios de rendimiento del empleado frente a criterios tales como la antigüedad, el favoritismo, etc.", "doc": "U2-1", "page": 7}, {"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}, {"t": "¿Qué recompensas (tanto financieras como no financieras) obtienen los gerentes y otros empleados por el logro de los objetivos de rendimiento? o, a la inversa, ¿qué sanciones van a sufrir al no alcanzarlas)?", "doc": "U3-2", "page": 11}, {"t": "Sistema explícito de premios y reconocimiento, criterios de promoción.", "doc": "U2-1", "page": 16}]}, "CT|MC": {"a": "CT", "b": "MC", "link": "El control tiene por objeto mejorar continuamente las operaciones y el texto lo presenta explícitamente como herramienta para la mejora continua, concepto que la unidad II distingue de la innovación.", "quotes": [{"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación. Tanto la mejora continua como la innovación aportan una contribución, un impacto en el mercado o una mejora interna, pero lo que distingue a la innovación de la mejora es que la transformación de la idea innovadora requiere hacer algo distinto de lo que la empresa venía haciendo en el pasado.", "doc": "U2-2", "page": 4}, {"t": "En la actualidad con el gran auge del trabajo virtual es necesario que las organizaciones puedan implementar el control con una visión transformadora de sus procesos. No como una herramienta de castillo o de señar a quien se equivoca, sino, cómo la oportunidad para modificar nuestros procesos y posteriormente comunicarlos y capacitar de forma correcta a quienes los implementan.", "doc": "U3-1", "page": 7}, {"t": "Comprometer a los equipos con los procesos claves de la organización: para trabajar con foco en la mejora continua, lo primero y más necesario es que cada equipo de trabajo este comprometido con el proceso.", "doc": "U3-1", "page": 7}]}, "RET|MC": {"a": "RET", "b": "MC", "link": "La retroalimentación de los resultados es, según el texto, fundamental para lograr la mejora continua de los procesos.", "quotes": [{"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema. La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}, {"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación. Tanto la mejora continua como la innovación aportan una contribución, un impacto en el mercado o una mejora interna, pero lo que distingue a la innovación de la mejora es que la transformación de la idea innovadora requiere hacer algo distinto de lo que la empresa venía haciendo en el pasado.", "doc": "U2-2", "page": 4}, {"t": "Es de suma importancia generar instancia de feedback y seguimiento una vez que se incorporan procesos que están enfocados en eficientizar el negocio.", "doc": "U3-1", "page": 8}, {"t": "Para algunos lideres documentar, puede significar una muestra de debilidad. Aunque, si lo pensamos cómo un proceso de mejora continua y aprendizaje continuo, es todo lo contrario.", "doc": "U2-1", "page": 14}]}, "MC|AGI": {"a": "MC", "b": "AGI", "link": "Las metodologías ágiles, enfocadas en mejorar resultados, son una de las herramientas que el texto propone incorporar para trabajar con foco en la mejora continua.", "quotes": [{"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación.", "doc": "U2-2", "page": 4}, {"t": "Un ejemplo de ello son las metodologías agiles que componen una estrategia integral que impulsa a la organización a gestionar los proyectos con rapidez y flexibilidad.", "doc": "U2-2", "page": 8}, {"t": "Las metodologías ágiles están enfocadas en mejorar resultados", "doc": "U2-2", "page": 8}, {"t": "Comprometer a los equipos con los procesos claves de la organización: para trabajar con foco en la mejora continua, lo primero y más necesario es que cada equipo de trabajo este comprometido con el proceso.", "doc": "U3-1", "page": 7}, {"t": "Incorporar herramientas digitales y de metodologías agiles que proporcionen mejores prácticas permita que los procesos sean cada vez más eficientes.", "doc": "U3-1", "page": 8}]}, "AGI|RET": {"a": "AGI", "b": "RET", "link": "Las metodologías ágiles se apoyan en el feedback constante, y la unidad de control recomienda incorporarlas junto con instancias de feedback para mejorar los procesos.", "quotes": [{"t": "Un ejemplo de ello son las metodologías agiles que componen una estrategia integral que impulsa a la organización a gestionar los proyectos con rapidez y flexibilidad.", "doc": "U2-2", "page": 8}, {"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema. La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}, {"t": "Una herramienta fundamental de esta técnica es el feedback constante, que hará qué los proyectos sean capaces de adaptarse sobre la marcha y resolverse en poco tiempo las adversidades que se presente.", "doc": "U2-2", "page": 9}, {"t": "Incorporar herramientas digitales y de metodologías agiles que proporcionen mejores prácticas permita que los procesos sean cada vez más eficientes.", "doc": "U3-1", "page": 8}]}, "LID|MC": {"a": "LID", "b": "MC", "link": "El líder que documenta y promueve la mejora como proceso de mejora continua genera confianza en el equipo y una mirada sistémica de la organización.", "quotes": [{"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos.", "doc": "U2-1", "page": 7}, {"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación.", "doc": "U2-2", "page": 4}, {"t": "Para algunos lideres documentar, puede significar una muestra de debilidad. Aunque, si lo pensamos cómo un proceso de mejora continua y aprendizaje continuo, es todo lo contrario. Siempre contamos con la fuente para consultar y a su vez esta acción brindará confianza a quien lo realiza y funcionará como preventivo de posibles errores. Para esto, es necesario que el líder haya trasmitido previamente esta información, hacer transparente la necesidad de contar con el proceso documentado cómo herramienta para que todo el equipo haya comprendido la misma información, hará que el equipo confíe en el líder y en la acción documentada.", "doc": "U2-1", "page": 14}, {"t": "Contar con un líder que promueva la mejora y los procesos en sinergia, esto brinda al equipo una mirada sistémica de la organización y como “su” trabajo impacta en el resto de la organización y en el resultado de la misma.", "doc": "U3-1", "page": 7}]}, "COM|EJE": {"a": "COM", "b": "EJE", "link": "El modelo de comunicación mide cuánto se restringe la comunicación a la jerarquía formal, que es exactamente el esquema jerárquico de flujo vertical que describe la unidad III.", "quotes": [{"t": "Modelo de comunicación: El grado en el que las comunicaciones organizativas están restringidas a la jerarquía formal de autoridad.", "doc": "U2-1", "page": 7}, {"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc. En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "abajo) por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos:", "doc": "U3-3", "page": 8}, {"t": "los ejecutivos deben reconocer que en los espacios de innovación de la agenda no deben imperar las mismas reglas de juego que gobiernan la gestión cotidiana, como el control burocrático, la comunicación siguiendo la línea de mando establecida, el valor de las ideas que se corresponde necesariamente con el nivel jerárquico", "doc": "U2-2", "page": 5}]}, "ENT|PL": {"a": "ENT", "b": "PL", "link": "Los elementos del entorno afectan el proceso de planeación, y la planeación requiere gran cantidad de información sobre el entorno externo.", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Y en las empresas, una de las principales funciones de los directivos es la planificación, entendida como el proceso de toma de decisiones con el que es posible alcanzar los objetivos previamente planteados.", "doc": "U1-2", "page": 3}, {"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "El entorno tiene una estrecha correlación con todo lo que se realiza en una organización, ya que todos los elementos externos afectan los procesos de planeación, diseño organizacional, cambio organizacional, toma de decisiones, clima organizacional, entre otros, que exigen una continua adaptación al medio a los fines de aprovechar las circunstancias que éste presenta.", "doc": "U2-3", "page": 6}, {"t": "Esto es, dado que los niveles gerenciales superiores se ocupan de la planeación y dado que la planeación requiere de mayor cantidad de información concerniente al entorno externo, la información relativa al entorno externo deberá ser cada vez más resumida y selectiva conforme la posición del receptor sea menor dentro de la jerarquía gerencial.", "doc": "U3-3", "page": 5}]}, "OA|STK": {"a": "OA", "b": "STK", "link": "La organización que aprende debe aplicar los saberes que le ofrecen sus grupos de interés, los stakeholders que la unidad de entorno identifica como componentes de acción directa.", "quotes": [{"t": "Una organización que aspire a competir con éxito, debe ser una organización que aprenda; debe, también, revelar los procesos que le permitan incorporar a su actividad, la información pertinente y relevante que posee. Está obligada a aplicar, con creatividad e iniciativa, las experiencias y saberes que le ofrecen, en primer lugar, sus propios trabajadores, sus proveedores, los grupos de interés y los clientes es decir, la sociedad en su conjunto y más específicamente aquellos sectores en los que dicha organización opera.", "doc": "U3-3", "page": 11}, {"t": "involucrados con ella, los cuales no son únicamente los accionistas y dueños, sino sus empleados, los consumidores, los proveedores, sindicatos, etc., algunos de ellos internos a la organización y otros externos, pero igualmente interesados y afectados con el papel que la empresa puede desempeñar dentro del ambiente.", "doc": "U2-3", "page": 7}, {"t": "En el ambiente externo se pueden encontrar tanto componentes de acción directa como de acción indirecta, estando constituidos los primeros fundamentalmente por los distintos grupos de interés en la organización", "doc": "U2-3", "page": 10}]}, "VIR|CT": {"a": "VIR", "b": "CT", "link": "El auge del trabajo virtual obliga, según la unidad III, a implementar el control con una visión transformadora de los procesos y no como castigo.", "quotes": [{"t": "Sin dudas, cada crisis es una oportunidad. Y sí bien la introspectiva llegada del COVID – 19 significo una gran crisis para muchas organizaciones, también fue una oportunidad de demostrar que una nueva forma de trabajo podía instaurarse y generar los mismos o hasta mejores resultados.", "doc": "U2-2", "page": 9}, {"t": "Se incremento el trabajo virtual y esta fue una modalidad que en muchos casos \"vino para quedarse\".", "doc": "U2-1", "page": 13}, {"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "En la actualidad con el gran auge del trabajo virtual es necesario que las organizaciones puedan implementar el control con una visión transformadora de sus procesos. No como una herramienta de castillo o de señar a quien se equivoca, sino, cómo la oportunidad para modificar nuestros procesos y posteriormente comunicarlos y capacitar de forma correcta a quienes los implementan.", "doc": "U3-1", "page": 7}]}, "ALI|OBJ": {"a": "ALI", "b": "OBJ", "link": "Las alianzas comerciales se definen por su finalidad: alcanzar objetivos comunes y estratégicos de negocio a través de los objetivos colectivos de los socios.", "quotes": [{"t": "Una alianza comercial o de negocios es una relación formal entre dos o más organizaciones para alcanzar los objetivos comunes de negocio.", "doc": "U2-3", "page": 20}, {"t": "Objetivos: son las metas que el agente decisorio pretende alcanzar con sus acciones.", "doc": "U1-2", "page": 11}, {"t": "Una sociedad comercial puede ayudar a una compañía a alcanzar sus objetivos estratégicos de negocio mediante los objetivos colectivos de los miembros. Aunque las metas, objetivos, estrategias, estándares éticos y de negocio pueden entrar en conflicto, generando amenazas posibles en la alianza, las oportunidades de crecimiento de ventas pueden generar acceso a nuevos clientes y aumentar las capacidades de producción.", "doc": "U2-3", "page": 20}]}, "ESTR|OBJ": {"a": "ESTR", "b": "OBJ", "link": "La estrategia es el curso de acción elegido para alcanzar los objetivos, y en el control de gestión estrategia y objetivos son el punto de partida común.", "quotes": [{"t": "Estrategias: es el curso de acción que el agente decisorio escoge para alcanzar mejor sus metas y/o objetivos. Toda estrategia depende de los recursos de que se disponga.", "doc": "U1-2", "page": 11}, {"t": "Objetivos: son las metas que el agente decisorio pretende alcanzar con sus acciones.", "doc": "U1-2", "page": 11}, {"t": "Las cuestiones anteriores muestran las relaciones inherentes entre sistemas de control de gestión y desempeño organizacional, el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}, {"t": "Para identificar las variables críticas para el rendimiento correcto, es necesario analizar la estrategia prevista de la empresa y los objetivos específicos asociados con esa estrategia.", "doc": "U3-2", "page": 9}]}, "AGD|ESTR": {"a": "AGD", "b": "ESTR", "link": "La estrategia es el curso de acción que el agente decisorio escoge; en la unidad III los directivos, como decisores, seleccionan las medidas para implantar esa estrategia.", "quotes": [{"t": "Agente decisorio: es aquella persona que selecciona la opción entre varias alternativas o ideas de acción.", "doc": "U1-2", "page": 11}, {"t": "Estrategias: es el curso de acción que el agente decisorio escoge para alcanzar mejor sus metas y/o objetivos. Toda estrategia depende de los recursos de que se disponga.", "doc": "U1-2", "page": 11}, {"t": "Las cuestiones anteriores muestran las relaciones inherentes entre sistemas de control de gestión y desempeño organizacional, el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}, {"t": "La meta de los sistemas de medición de desempeño, es implantar la estrategia, por lo tan const nodeEls={};
for(const k in G.nodes){const g=G.nodes[k],n=N[k];const u=n.unit;
  const grp=el('g',{class:'node'+(n.hub?' hub':'')+(n.tag?' tag':''),style:`--c:var(--u${u});--soft:var(--u${u}-soft);--tc:var(--u${u}-text)`,tabindex:0,role:'button','aria-label':n.label},gN);
  el('rect',{x:g.x-g.w/2,y:g.y-g.h/2,width:g.w,height:g.h,rx:n.hub?g.h/2:11},grp);
  const lh=n.hub?28:21,tot=g.lines.length*lh+(n.tag?16:0);let ty=g.y-tot/2+lh*.74;
  g.lines.forEach(l=>{const t=el('text',{x:g.x,y:ty,'text-anchor':'middle'},grp);t.textContent=l;ty+=lh;});
  if(n.tag){const t=el('text',{class:'tg',x:g.x,y:ty-3,'text-anchor':'middle'},grp);t.textContent=n.tag;}
  grp.addEventListener('click',ev=>{ev.stopPropagation();openNode(k);});
  grp.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openNode(k);}});
  grp.addEventListener('mouseenter',()=>focus(k));grp.addEventListener('mouseleave',()=>focus(null));
  nodeEls[k]=grp;}

function focus(k){const on=!!k;for(const id in nodeEls){nodeEls[id].classList.toggle('dim',on&&id!==k&&!adj[k].some(e=>E[e].a===id||E[e].b===id));nodeEls[id].classList.toggle('hl',on&&id===k);}
  for(const key in edgeEls){const rel=on&&adj[k].includes(key);edgeEls[key].classList.toggle('dim',on&&!rel);edgeEls[key].querySelector('.edge').classList.toggle('hl',rel);}}

// ---- pan / zoom
let s=1,tx=0,ty=0,drag=null,moved=false;
const apply=()=>view.setAttribute('transform',`translate(${tx},${ty}) scale(${s})`);
function fit(){const r=stage.getBoundingClientRect();s=Math.min(r.width/(G.W+40),r.height/(G.H+40));tx=(r.width-G.W*s)/2;ty=(r.height-G.H*s)/2;apply();}
function zoomAt(f,cx,cy){const ns=Math.min(4,Math.max(.12,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply();}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
const ptrs=new Map();let pinch=null;
stage.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;ptrs.set(e.pointerId,e);if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};moved=false;stage.classList.add('drag');}else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s};}});
window.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,e);
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const r=stage.getBoundingClientRect();const cx=(a.clientX+b.clientX)/2-r.left,cy=(a.clientY+b.clientY)/2-r.top;const f=(pinch.s*d/pinch.d)/s;zoomAt(f,cx,cy);moved=true;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;apply();}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){drag=null;stage.classList.remove('drag');}};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
stage.addEventListener('click',()=>{if(!moved)closeCard();});
document.getElementById('zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1/1.25,r.width/2,r.height/2);};
document.getElementById('zfit').onclick=fit;
window.addEventListener('resize',fit);
function center(k){const g=G.nodes[k],r=stage.getBoundingClientRect();const card=document.getElementById('card');const cw=(!card.hidden&&r.width>760)?480:0;const ns=Math.max(s,.9);s=ns;tx=(r.width-cw)/2-g.x*s;ty=r.height/2-g.y*s;apply();}

// ---- filter chips
const chips=document.getElementById('chips');const vis={1:true,2:true,3:true};
[1,2,3].forEach(u=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',`var(--u${u})`);b.setAttribute('aria-pressed','true');b.innerHTML=`<i></i>Unidad ${UN[u]}`;
  b.onclick=()=>{vis[u]=!vis[u];b.setAttribute('aria-pressed',String(vis[u]));for(const k in nodeEls)nodeEls[k].style.opacity=vis[N[k].unit]?'':'.12';for(const key in edgeEls){const e=E[key];edgeEls[key].style.opacity=(vis[N[e.a].unit]&&vis[N[e.b].unit])?'':'.06';}};chips.appendChild(b);});

// ---- search
const q=document.getElementById('q'),res=document.getElementById('res');
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
q.addEventListener('input',()=>{const v=fold(q.value.trim());res.innerHTML='';if(v.length<2){res.hidden=true;return;}
  const hits=Object.keys(N).filter(k=>fold(N[k].label).includes(v)).slice(0,12);
  hits.forEach(k=>{const b=document.createElement('button');b.style.setProperty('--c',`var(--u${N[k].unit})`);b.innerHTML=`<span class="u">U${UN[N[k].unit]}</span><span>${esc(N[k].label)}</span>`;b.onclick=()=>{res.hidden=true;q.value='';openNode(k);center(k);};res.appendChild(b);});
  res.hidden=hits.length===0;});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=res.querySelector('button');if(b)b.click();}if(e.key==='Escape'){res.hidden=true;q.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true;});

// ---- cards
const card=document.getElementById('card');
card.addEventListener('click',e=>e.stopPropagation());card.addEventListener('pointerdown',e=>e.stopPropagation());card.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
const xIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';
const srcLink=(doc,p)=>`<a class="src" href="${pdf(doc,p)}" target="_blank" rel="noopener" title="${esc(T[doc])}">${ico}${doc} · pág. ${p}</a>`;
const quoteBlock=qs=>qs.map(x=>`<div class="q"><p>${esc(x.t)}</p>${srcLink(x.doc,x.page)}</div>`).join('');
function show(html,u){card.style.setProperty('--c',`var(--u${u})`);card.innerHTML=html;card.hidden=false;card.querySelector('.bd').scrollTop=0;card.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();closeCard();});}
function closeCard(){card.hidden=true;focus(null);if(location.hash)history.replaceState(null,'',' ');}
function openNode(k){const n=N[k];const u=n.unit;
  const refs=n.refs.map(r=>`<div class="r"><div class="rt"><b>${r.doc}</b><span>${esc(T[r.doc])}</span></div><div class="rp">${r.pages.map(p=>`<a class="src" href="${pdf(r.doc,p)}" target="_blank" rel="noopener">${ico}pág. ${p}</a>`).join('')}</div></div>`).join('');
  const rels=adj[k].map(key=>{const e=E[key];const o=e.a===k?e.b:e.a;const cross=N[o].unit!==u;return `<button class="${cross?'cross':''}" style="--c:var(--u${N[o].unit});--soft:var(--u${N[o].unit}-soft);--tc:var(--u${N[o].unit}-text)" data-e="${key}"><i></i><span>${esc(N[o].label)}</span></button>`;}).join('');
  show(`<div class="hd"><div class="t"><span class="pill"><i></i>Unidad ${UN[u]}${n.tag?' · '+esc(n.tag):''}</span><h2 id="ct">${esc(n.label)}</h2></div><button class="close" aria-label="Cerrar">${xIco}</button></div>
  <div class="bd">
    <div class="sec"><h3>Qué dice el PDF</h3>${quoteBlock(n.quotes)}</div>
    <div class="sec"><h3>Dónde aparece</h3><div class="refs">${refs}</div></div>
    <div class="sec"><h3>Relaciones (${adj[k].length}) · tocá una para ver por qué</h3><div class="rel">${rels}</div></div>
  </div>`,u);
  card.querySelectorAll('.rel button').forEach(b=>b.onclick=()=>openEdge(b.dataset.e));
  focus(k);history.replaceState(null,'','#'+k);}
function openEdge(key){const e=E[key],A=N[e.a],B=N[e.b];const u=A.unit;
  show(`<div class="hd"><div class="t"><span class="pill"><i></i>Relación${A.unit!==B.unit?' entre unidades '+UN[A.unit]+' y '+UN[B.unit]:' · Unidad '+UN[u]}</span>
  <h2 id="ct"><button data-n="${e.a}" style="--c:var(--u${A.unit})">${esc(A.label)}</button><span class="vs">↔</span><button data-n="${e.b}" style="--c:var(--u${B.unit})">${esc(B.label)}</button></h2></div><button class="close" aria-label="Cerrar">${xIco}</button></div>
  <div class="bd">
    <div class="sec"><h3>Por qué se relacionan</h3><div class="link">${esc(e.link)}<small>Redacción propia a partir de las citas de abajo. Todo lo demás es texto literal de los PDFs.</small></div></div>
    <div class="sec"><h3>Qué dicen los PDFs</h3>${quoteBlock(e.quotes)}</div>
  </div>`,u);
  card.querySelectorAll('h2 button').forEach(b=>b.onclick=()=>openNode(b.dataset.n));
  for(const id in nodeEls){nodeEls[id].classList.toggle('dim',id!==e.a&&id!==e.b);nodeEls[id].classList.toggle('hl',id===e.a||id===e.b);}
  for(const k2 in edgeEls){edgeEls[k2].classList.toggle('dim',k2!==key);edgeEls[k2].querySelector('.edge').classList.toggle('hl',k2===key);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();});
fit();
const h=location.hash.replace('#','');if(h&&N[h]){openNode(h);center(h);}
})();
</script>
</body></html>
