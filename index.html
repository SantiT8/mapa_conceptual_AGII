body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}

.edge{fill:none;stroke-linecap:round;pointer-events:none;transition:opacity .15s}

ciones. Para definir bien un problema es necesario buscar la causa o el conjunto de causas que expliquen mejor los síntomas o, por lo menos, su mayor número.", "doc": "U1-1", "page": 7}], "refs": [{"doc": "U1-1", "pages": [5, 6]}, {"doc": "U1-3", "pages": [20]}]}, "GA": {"label": "Generación de soluciones", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Las soluciones se generan pensando. Pensar supone la utilización de todos los recursos mentales con la finalidad de resolver un problema manifiesto o aplazado.", "doc": "U1-1", "page": 7}], "refs": [{"doc": "U1-1", "pages": [7]}]}, "VS": {"label": "Valoración de soluciones", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Las soluciones se pueden evaluar normalmente con cargo a los siguientes criterios:", "doc": "U1-1", "page": 8}, {"t": "La calidad es el porcentaje de problema que arregla una solución.", "doc": "U1-1", "page": 8}, {"t": "Se debería elegir la solución que mejor puntuara.", "doc": "U1-1", "page": 8}], "refs": [{"doc": "U1-1", "pages": [5]}]}, "PRO": {"label": "Método PROACTITUD", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}], "refs": [{"doc": "U1-3", "pages": [3, 4]}]}, "ALT": {"label": "Alternativas", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Dentro de la teoría de la decisión, una alternativa es una de al menos dos cosas o acciones que pueden ser elegidas o tomadas en alguna circunstancia.", "doc": "U1-3", "page": 10}], "refs": [{"doc": "U1-1", "pages": [4, 5, 12]}, {"doc": "U1-2", "pages": [5, 8, 11]}, {"doc": "U1-3", "pages": [5, 9, 10, 12, 13, 17, 21, 24, 25, 27, 29]}, {"doc": "U1-4", "pages": [3, 5, 6, 8, 11]}]}, "CON": {"label": "Consecuencias", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "En principio una consecuencia es un hecho o acontecimiento que se deriva o resulta de otro.", "doc": "U1-3", "page": 12}, {"t": "Consecuencias. Son las reacciones evaluativas subjetivas, medidas en términos de bueno o malo, ganancias o pérdidas, asociadas con cada resultado.", "doc": "U1-1", "page": 4}], "refs": [{"doc": "U1-1", "pages": [3, 4, 5, 11, 12]}, {"doc": "U1-2", "pages": [3, 5]}, {"doc": "U1-3", "pages": [9, 12, 22, 23, 27, 29]}, {"doc": "U1-4", "pages": [3, 5, 8]}, {"doc": "U2-1", "pages": [5]}, {"doc": "U2-4", "pages": [13]}, {"doc": "U3-2", "pages": [5, 11]}]}, "TRA": {"label": "Transacciones", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Del latín transactĭo, transacción es un término definido por el diccionario de la Real Academia Española (RAE) como la acción y efecto de transigir, acordar voluntariamente con otra parte algún punto litigioso para compartir la diferencia de la disputa, consentir a fin de terminar con una diferencia.", "doc": "U1-3", "page": 12}, {"t": "Debemos hacer transacciones cuando tenemos que sacrificar o compensar algunos aspectos de diferentes alternativas que se presentan como contradictorios.", "doc": "U1-3", "page": 13}], "refs": [{"doc": "U1-3", "pages": [12, 13]}, {"doc": "U2-2", "pages": [15]}]}, "TR": {"label": "Tolerancia al riesgo", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "la tolerancia al riesgo es la capacidad de aceptar riesgo; es el nivel de riesgo que un individuo u organización puede o está dispuesto a soportar.", "doc": "U1-3", "page": 14}, {"t": "Cada persona es diferente en cuanto a la tolerancia al riesgo y tener conciencia de ello generará un proceso más suave y eficiente en la toma de decisiones.", "doc": "U1-3", "page": 14}], "refs": [{"doc": "U1-3", "pages": [14]}]}, "URD": {"label": "Urdimbres psicológicas", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Utilizamos el término urdimbre como sinónimo de tejido, nos referimos entonces a la construcción de la trama de nuestra psiquis. En esta construcción están presentes la influencia de lo experimentado, nuestra emociones y sentimientos.", "doc": "U1-3", "page": 15}, {"t": "Es un elemento que debemos tener en cuenta en la toma de decisiones, ya que nuestras características psicológicas influyen en todo el proceso. Podemos sintetizar a esta estructura en el concepto de modelos mentales.", "doc": "U1-3", "page": 15}], "refs": [{"doc": "U1-3", "pages": [15]}]}, "DVI": {"label": "Decisiones vinculadas", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Tenemos que pensar que lo que decidamos hoy podría influir en las decisiones que debamos tomar en el futuro, y que nuestras metas para el mañana influyen en las decisiones que debemos tomar hoy.", "doc": "U1-3", "page": 16}, {"t": "El criterio a seguir es colocar las actividades en orden de prioridades, para explotar los conocimientos y experiencia que vamos adquiriendo en el camino, esto hará que reduzcamos incertidumbres y podamos tomar decisiones acertadas.", "doc": "U1-3", "page": 16}], "refs": [{"doc": "U1-3", "pages": [16]}]}, "MM": {"label": "Modelos mentales", "unit": 1, "hub": false, "tag": "U1 · U2", "quotes": [{"t": "Los modelos mentales son representaciones internas de una realidad externa. Son concepciones generales, que dirigen nuestros actos y que somos capaces de construir a partir de la experiencia.", "doc": "U1-3", "page": 15}, {"t": "Los modelos mentales son indispensables para comprender el modo de actuar de las personas que colaboran en una organización porque no solo determinan el modo de interpretar el mundo sino también de actuar.", "doc": "U2-1", "page": 17}], "refs": [{"doc": "U1-3", "pages": [15, 16]}, {"doc": "U2-1", "pages": [17]}]}, "INC": {"label": "Incertidumbre", "unit": 1, "hub": false, "tag": "U1 · U3", "quotes": [{"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "Incertidumbre. Se refiere a los juicios de quien toma la decisión de la propensión de cada suceso de ocurrir.", "doc": "U1-1", "page": 4}, {"t": "En el ambiente empresarial es cada día más común la incertidumbre de sus directivos para tomar decisiones adecuadas y que sean proporcionales en eficiencia y eficacia.", "doc": "U3-3", "page": 10}], "refs": [{"doc": "U1-1", "pages": [4, 5]}, {"doc": "U1-2", "pages": [6]}, {"doc": "U1-3", "pages": [13, 14, 16, 20, 22, 23, 25]}, {"doc": "U1-4", "pages": [7, 12]}, {"doc": "U3-3", "pages": [10]}]}, "RIE": {"label": "Situación de riesgo", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "La información con la que se cuenta para solucionar el problema es incompleta, es decir, se conoce el problema, se conocen las posibles soluciones, pero no se conoce con certeza los resultados que pueden arrojar.", "doc": "U1-3", "page": 27}, {"t": "Cuando se toma una decisión en condiciones de riesgo significa que se conoce la probabilidad que existe de que suceda cada uno de los estados de la naturaleza.", "doc": "U1-4", "page": 12}], "refs": [{"doc": "U1-3", "pages": [27]}]}, "CER": {"label": "Situación de certeza", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Una situación de certeza es aquella en la que un sujeto tiene información completa sobre una situación determinada, sobre cómo evolucionará y conoce el resultado de su decisión.", "doc": "U1-3", "page": 25}, {"t": "La toma de decisiones en un marco de certeza no implica dificultad alguna, más allá de las relacionadas con la gestión empresarial.", "doc": "U1-3", "page": 25}], "refs": [{"doc": "U1-3", "pages": [25]}]}, "CAOS": {"label": "Teoría del Caos", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Hablar de caos no es sinónimo de desorden o comportamientos aleatorios. Son sistemas complejos, sin estructuras, no lineales, que tienen, entre otras propiedades, un comportamiento ordenado, objetivo y razonable, que se escuda detrás de una imagen llena de oposiciones, contradicciones y un aparente desorden.", "doc": "U1-1", "page": 11}, {"t": "En el desorden puede haber también un orden controlado. Depende de las variables que usemos o tomemos en consideración al momento de decidir.", "doc": "U1-1", "page": 11}], "refs": [{"doc": "U1-1", "pages": [3, 11]}]}, "CO": {"label": "Costo de oportunidad", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Lo que sí afirmamos sin temor a equivocarnos es que el costo de oportunidad más alto es siempre el de no tomar decisión alguna.", "doc": "U1-1", "page": 12}, {"t": "Sustituyendo los valores anteriores o resultados por los perjuicios resultantes de no haber elegido la mejor estrategia, es decir, el costo de oportunidad.", "doc": "U1-4", "page": 12}], "refs": [{"doc": "U1-1", "pages": [12]}, {"doc": "U1-4", "pages": [12]}]}, "INFO": {"label": "Información", "unit": 1, "hub": false, "tag": "U1 · U3", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "La información es de vital importancia para los directivos de una empresa con el fin de lograr los objetivos a corto, mediano y largo plazo.", "doc": "U3-3", "page": 4}], "refs": [{"doc": "U1-1", "pages": [13]}, {"doc": "U1-2", "pages": [3, 4, 5, 6, 7, 8, 12]}, {"doc": "U1-3", "pages": [13, 16, 17, 25, 27, 29, 30]}, {"doc": "U1-4", "pages": [7, 8, 9, 11]}, {"doc": "U2-1", "pages": [10, 14, 17]}, {"doc": "U2-2", "pages": [7, 9]}, {"doc": "U2-3", "pages": [13, 14]}, {"doc": "U3-1", "pages": [4, 7, 12, 14]}, {"doc": "U3-2", "pages": [5, 8, 11]}, {"doc": "U3-3", "pages": [3, 4, 5, 6, 8, 10, 11, 12, 13, 14, 15, 17]}]}, "R47": {"label": "Regla 40/70", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Powell propone que cuando la información se encuentra en el rango de 40% a 70% es cuando debemos tomar la decisión.", "doc": "U1-2", "page": 5}, {"t": "La importancia de la regla 40/70 es que le sugiere permanentemente al ejecutivo que un óptimo proceso de tomar decisiones no es la búsqueda de una verdad absoluta y final, sino por el contrario, un proceso dinámico que contiene ciertos grados de sentido común e intuición.", "doc": "U1-2", "page": 5}], "refs": [{"doc": "U1-2", "pages": [5]}]}, "RAC": {"label": "Racionalidad", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "La mayoría de los que tienen esta responsabilidad intentan tomar sus decisiones en los marcos de la racionalidad aunque no siempre esto es posible, debido a que se enfrentan a un mundo real, muy complejo, donde las limitaciones de información, tiempo y la incertidumbre reinante limitan considerablemente la racionalidad.", "doc": "U1-2", "page": 6}, {"t": "el decisor se comporta racionalmente sólo en función de aquellos aspectos de la situación que logra percibir y conocer", "doc": "U1-2", "page": 6}], "refs": [{"doc": "U1-2", "pages": [3, 5, 6, 8, 9]}, {"doc": "U2-4", "pages": [14]}, {"doc": "U3-2", "pages": [5]}]}, "ELS": {"label": "Racionalidad elsteriana", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "La racionalidad elsteriana, es aquella que permite estudiar detenida y exhaustivamente la naturaleza sustancial de los deseos y las creencias involucradas en la generación de la escala de preferencias desde la que se toman las decisiones humanas.", "doc": "U1-2", "page": 9}, {"t": "Para Elster, el actuar racionalmente tiene que ver no únicamente con la consistencia de las razones de la acción, sino con que dichas razones sean, a su vez, racionales.", "doc": "U1-2", "page": 9}], "refs": [{"doc": "U1-2", "pages": [9]}]}, "IE": {"label": "Inteligencia emocional", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Desarrollar esta competencia permitirá al líder reconocer, comprender y gestionar sus emociones y las del equipo a cargo. Es crucial al momento de tomar decisiones, ya que, permite evaluar de manera más objetiva y tomar la decisión con menor riesgo posible.", "doc": "U1-3", "page": 16}], "refs": [{"doc": "U1-3", "pages": [16]}]}, "AGD": {"label": "Agente decisorio", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Agente decisorio: es aquella persona que selecciona la opción entre varias alternativas o ideas de acción.", "doc": "U1-2", "page": 11}, {"t": "Las decisiones normalmente contienen seis elementos básicos que debemos tener en cuenta. Esta es la estructura formal a la hora de decidir:", "doc": "U1-2", "page": 11}], "refs": [{"doc": "U1-2", "pages": [11]}]}, "OBJ": {"label": "Objetivos", "unit": 1, "hub": false, "tag": "U1 · U2 · U3", "quotes": [{"t": "Objetivos: son las metas que el agente decisorio pretende alcanzar con sus acciones.", "doc": "U1-2", "page": 11}, {"t": "Un objetivo es una meta o finalidad a cumplir para la que se disponen medios determinados.", "doc": "U1-3", "page": 8}, {"t": "En el proceso de toma de decisiones, la decisión final debe llevarnos al objetivo. Y si una decisión es un medio para llegar a un fin, entonces debemos pensar correctamente los objetivos para darles la dirección adecuada a nuestras decisiones.", "doc": "U1-3", "page": 8}], "refs": [{"doc": "U1-1", "pages": [3]}, {"doc": "U1-2", "pages": [3, 7, 8, 11]}, {"doc": "U1-3", "pages": [3, 8, 9, 10, 12, 14, 20, 22]}, {"doc": "U1-4", "pages": [3, 4, 11]}, {"doc": "U2-1", "pages": [3, 4, 7, 10]}, {"doc": "U2-2", "pages": [3, 7, 15]}, {"doc": "U2-3", "pages": [3, 11, 20]}, {"doc": "U2-4", "pages": [3, 14]}, {"doc": "U3-1", "pages": [3, 6]}, {"doc": "U3-2", "pages": [3, 4, 5, 8, 9, 10, 11, 12]}, {"doc": "U3-3", "pages": [3, 4, 14]}]}, "JUE": {"label": "Teoría de juegos", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Muchas veces la empresa se enfrenta a un oponente que conoce sus estrategias y que escogerá aquella que más le perjudique. Estas decisiones se estudian en la teoría de juegos. Esta teoría considera que en la toma de decisiones intervienen pocos individuos, con información diferente y, generalmente incompleta, sobre los resultados de las decisiones.", "doc": "U1-3", "page": 27}, {"t": "Conflicto puro: las ganancias de un “jugador” son pérdidas para el otro (juego bipersonal de suma cero).", "doc": "U1-3", "page": 27}], "refs": [{"doc": "U1-3", "pages": [27]}]}, "ARB": {"label": "Árbol de decisión", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "El árbol de decisión es una de las herramientas más útiles y utilizadas para la toma de decisiones adecuadas teniendo varias alternativas posibles de acción.", "doc": "U1-4", "page": 5}, {"t": "Está formado por múltiples nodos cuadrados, que representan los puntos de decisión, y de los cuales surgen ramas que representan las distintas alternativas.", "doc": "U1-4", "page": 5}], "refs": [{"doc": "U1-4", "pages": [3, 5, 6, 7, 8]}]}, "MAT": {"label": "Matriz de resultados", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Una matriz de resultados de decisión es un gráfico que permite a un equipo o un individuo identificar y analizar la tasa de la fuerza de las relaciones entre conjuntos de información.", "doc": "U1-4", "page": 11}, {"t": "Resultados o desenlaces: son los resultados esperados en cada una de las estrategias, dado un estado concreto de la naturaleza.", "doc": "U1-4", "page": 11}], "refs": [{"doc": "U1-4", "pages": [3, 11]}]}, "EN": {"label": "Estados de la naturaleza", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Estados de la naturaleza: son variables no controladas, representan los sucesos en los que no se puede influir y que condicionan la decisión que se tome.", "doc": "U1-4", "page": 11}, {"t": "Al tomar una decisión, el resultado de ésta vendrá determinado por un suceso incierto (estados de la naturaleza).", "doc": "U1-4", "page": 5}], "refs": [{"doc": "U1-4", "pages": [5, 6, 7, 11, 12]}]}, "CRI": {"label": "Criterios de elección", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Para decidir existen una serie de criterios de elección:", "doc": "U1-3", "page": 26}, {"t": "Criterios existentes para tomar una decisión en situación de incertidumbre:", "doc": "U1-4", "page": 12}, {"t": "En cambio, cuando se toma una decisión en condiciones de incertidumbre se desconoce la probabilidad de que suceda cada uno de los posibles estados de la naturaleza. Por este motivo, en este caso la decisión depende de la persona que deba tomarla y de su actitud ante el riesgo.", "doc": "U1-4", "page": 12}], "refs": [{"doc": "U1-3", "pages": [26]}]}, "GRU": {"label": "Decisiones grupales", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "hay ocasiones en que se debe aprovechar el conocimiento y la experiencia de un número mayor de personas, para tomar mejores decisiones.", "doc": "U1-3", "page": 29}, {"t": "Además cuando la gente participa en la toma de la decisión, se siente más comprometida a lograr los resultados deseados, convirtiéndose en un poderoso motivador para los trabajadores el que se les tome en cuenta en el momento de decidir.", "doc": "U1-3", "page": 30}], "refs": [{"doc": "U1-3", "pages": [30]}]}, "PRG": {"label": "Decisiones programadas", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Son aquellas que se toman frecuentemente, es decir son repetitivas y se convierte en una rutina tomarlas; como el tipo de problemas que resuelve y se presentan con cierta regularidad ya que se tiene un método bien establecido de solución y por lo tanto ya se conocen los pasos para abordar este tipo de problemas, por esta razón, también se las llama decisiones estructuradas.", "doc": "U1-3", "page": 31}], "refs": [{"doc": "U1-3", "pages": [31]}]}, "NPR": {"label": "Decisiones no programadas", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "También denominadas no estructuradas, son decisiones que se toman ante problemas o situaciones que se presentan con poca frecuencia, o aquellas que necesitan de un modelo o proceso específico de solución, por ejemplo: “lanzamiento de un nuevo producto al mercado”, en este tipo de decisiones es necesario seguir un modelo de toma de decisión para generar una solución específica para este problema en concreto.", "doc": "U1-3", "page": 31}], "refs": [{"doc": "U1-3", "pages": [31]}]}, "EST": {"label": "Estructura organizacional", "unit": 1, "hub": false, "tag": "U1 · U3", "quotes": [{"t": "una estructura organizacional debe diseñarse para determinar quién realizará cada tarea y quién será el responsable por los resultados y los objetivos por los cuales se den origen a esa tarea.", "doc": "U1-4", "page": 4}, {"t": "Estructura. Jerarquía de responsabilidades que hace que unos asuman funciones de dirección y el resto se subordine.", "doc": "U2-1", "page": 12}], "refs": [{"doc": "U1-4", "pages": [4]}]}, "EMP": {"label": "Empowerment", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Trabajar con un enfoque en el empowerment supone y aporta a que los líderes tengan la capacidad de delegar de manera eficiente, a fin, de trabajar con un equipo enfocado en las responsabilidades que implica la posición que ocupan.", "doc": "U1-4", "page": 4}, {"t": "Sumado a ello implica que los líderes al delegar comparten su responsabilidad con su equipo, conformando así equipos con mayor autonomía haciéndolos consciente del impacto de sus acciones.", "doc": "U1-4", "page": 4}], "refs": [{"doc": "U1-4", "pages": [4]}]}, "ERA": {"label": "Era del conocimiento", "unit": 1, "hub": false, "tag": "", "quotes": [{"t": "Los cambios que se suceden desde el siglo pasado en las esferas económica, social, cultural y de mercado llevan a que todas las organizaciones manejen información, una notable transformación en la que la base es el conocimiento, se vive una nueva era, la \"Era del conocimiento\".", "doc": "U1-2", "page": 6}], "refs": [{"doc": "U1-2", "pages": [6]}]}, "CU": {"label": "Cultura organizacional", "unit": 2, "hub": true, "tag": "", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "La cultura organizacional va a guiar la acción de los colaboradores dentro de la organización y representa la organización para el afuera.", "doc": "U2-1", "page": 4}], "refs": [{"doc": "U2-1", "pages": [3, 4, 5, 9, 13, 15, 16, 19]}, {"doc": "U2-2", "pages": [3]}, {"doc": "U2-3", "pages": [3, 9]}]}, "FUN": {"label": "Fundadores", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Fundadores, la primera persona/as de las que surgió la idea de crear la empresa, es decir, ponen los cimientos de la cultura de cómo debe ser su", "doc": "U2-1", "page": 9}, {"t": "organización y con sus propios y personales paradigmas culturales proporcionando los principios básicos y objetivos de la organización, su mentalidad y experiencia, etc.", "doc": "U2-1", "page": 10}], "refs": [{"doc": "U2-1", "pages": [9]}]}, "VAL": {"label": "Valores", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Valores, son las convicciones de la organización que se sustenta en una base moral, constituye los pilares de la cultura corporativa, son los supuestos que están tras el conjunto de normas y reglas de conducta de la empresa.", "doc": "U2-1", "page": 10}, {"t": "Los valores son afirmaciones acerca de lo que está bien o mal de una organización.", "doc": "U2-1", "page": 5}], "refs": [{"doc": "U1-3", "pages": [20, 21]}, {"doc": "U1-4", "pages": [12]}, {"doc": "U2-1", "pages": [3, 4, 5, 7, 9, 10]}, {"doc": "U2-2", "pages": [6, 7, 8, 11]}, {"doc": "U2-3", "pages": [11, 14]}, {"doc": "U2-4", "pages": [6, 7, 9, 10, 15]}, {"doc": "U3-3", "pages": [11, 12]}]}, "CRE": {"label": "Creencias", "unit": 2, "hub": false, "tag": "U1 · U2", "quotes": [{"t": "Creencias, constituyen un elemento ideológico que no puede ser contrastados con la realidad, careciendo de base empírica, aunque tengan valor de realidad para el cliente, por ejemplo: planteamientos básicos e indiscutibles que componen la gran mayoría de sus miembros.", "doc": "U2-1", "page": 10}, {"t": "Creencia es la percepción de las personas entre una acción y sus consecuencias.", "doc": "U2-1", "page": 5}], "refs": [{"doc": "U1-2", "pages": [8, 9]}, {"doc": "U1-3", "pages": [19]}, {"doc": "U2-1", "pages": [3, 4, 5, 9, 10, 13]}, {"doc": "U2-2", "pages": [6, 11]}]}, "NOR": {"label": "Normas", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Normas: se pueden considerar como la aplicación práctica de los valores y definen lo que debe ser.", "doc": "U2-1", "page": 10}, {"t": "Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}], "refs": [{"doc": "U2-1", "pages": [4, 5, 10, 12, 16]}, {"doc": "U2-2", "pages": [13, 15]}, {"doc": "U2-3", "pages": [5, 11]}, {"doc": "U2-4", "pages": [9, 10, 12]}, {"doc": "U3-3", "pages": [14, 15]}]}, "CFOR": {"label": "Cultura formal", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros.", "doc": "U2-1", "page": 9}, {"t": "En general es posible identificar, al menos, dos subsistemas culturales en la organización:", "doc": "U2-1", "page": 9}], "refs": [{"doc": "U2-1", "pages": [9]}]}, "CINF": {"label": "Cultura informal", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "En general es posible identificar, al menos, dos subsistemas culturales en la organización:", "doc": "U2-1", "page": 9}], "refs": [{"doc": "U2-1", "pages": [9]}]}, "TIP": {"label": "Tipologías culturales", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Podemos encontrar las siguientes tipologías: • Cultura del poder: se dirige y controla por personas clave desde un centro de poder ejecutivo. • Cultura de los roles: se sustenta en una clara y detallada descripción de las responsabilidades de cada puesto de acción. • Cultura de tareas: se apoya en proyectos que realiza la organización; orientada a la obtención de resultados específicos en tiempos concretos. • Cultura de personas: basada en los integrantes de la organización.", "doc": "U2-1", "page": 12}], "refs": [{"doc": "U2-1", "pages": [3, 12]}]}, "FD": {"label": "Culturas fuertes y débiles", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Fuertes o débiles, según la intensidad con que sus Contenidos son compartidos, conocidos e impulsan la conducta cotidiana de los participantes. Cuanto más fuerte sean los rasgos culturales, no sólo determinarán los modos de conducta de sus participantes internos, sino que también impondrán rituales y procedimientos a los integrantes de otras organizaciones contextualmente relacionadas.", "doc": "U2-1", "page": 15}], "refs": [{"doc": "U2-1", "pages": [3, 15]}]}, "LID": {"label": "Estilos de liderazgo", "unit": 2, "hub": false, "tag": "U1 · U2 · U3", "quotes": [{"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos.", "doc": "U2-1", "page": 7}, {"t": "El comportamiento de los ejecutivos en la forma de ejercer el liderazgo es un factor propulsor clave de la capacidad de innovar.", "doc": "U2-2", "page": 7}], "refs": [{"doc": "U2-1", "pages": [7]}]}, "TRC": {"label": "Tolerancia del riesgo", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Tolerancia del riesgo: El grado en el que los empleados son animados a ser proactivos, innovadores y a asumir riesgos.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}], "refs": [{"doc": "U2-1", "pages": [7]}]}, "INCV": {"label": "Sistema de incentivos", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Sistema de incentivos: El grado en el que los incentivos (aumentos de salario, promociones, etc.) se basan en criterios de rendimiento del empleado frente a criterios tales como la antigüedad, el favoritismo, etc.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}], "refs": [{"doc": "U2-1", "pages": [7]}]}, "COM": {"label": "Modelo de comunicación", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Modelo de comunicación: El grado en el que las comunicaciones organizativas están restringidas a la jerarquía formal de autoridad.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}], "refs": [{"doc": "U2-1", "pages": [7]}]}, "INN": {"label": "Cultura de innovación", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Innovar representa transformar nuevas ideas en resultados.", "doc": "U2-2", "page": 4}, {"t": "De esta conjunción surge otra forma de cultura denominada cultura de innovación, de vital importancia para el desarrollo empresarial.", "doc": "U2-2", "page": 3}, {"t": "La vía más segura para levantar una cultura innovadora es poner en marcha prácticas de dirección (involucrando de forma progresiva a todos los niveles y con diversos medios) que favorezcan el comportamiento innovador, emprendedor y creativo que se persigue.", "doc": "U2-2", "page": 7}], "refs": [{"doc": "U2-2", "pages": [3, 4]}]}, "MC": {"label": "Mejora continua", "unit": 2, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación.", "doc": "U2-2", "page": 4}, {"t": "La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}], "refs": [{"doc": "U2-1", "pages": [14]}, {"doc": "U2-2", "pages": [4]}, {"doc": "U3-1", "pages": [7, 8, 12]}]}, "AGI": {"label": "Metodologías ágiles", "unit": 2, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "Un ejemplo de ello son las metodologías agiles que componen una estrategia integral que impulsa a la organización a gestionar los proyectos con rapidez y flexibilidad.", "doc": "U2-2", "page": 8}, {"t": "Una herramienta fundamental de esta técnica es el feedback constante, que hará qué los proyectos sean capaces de adaptarse sobre la marcha y resolverse en poco tiempo las adversidades que se presente.", "doc": "U2-2", "page": 9}], "refs": [{"doc": "U2-2", "pages": [8]}]}, "VIR": {"label": "Virtualidad", "unit": 2, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "Se incremento el trabajo virtual y esta fue una modalidad que en muchos casos “vino para quedarse”.", "doc": "U2-1", "page": 13}, {"t": "Debido a este avance de la digitalización y la virtualidad se ha generado un gran avance en la formación de equipos multiculturales.", "doc": "U2-1", "page": 13}, {"t": "La transformación digital y la instauración de la virtual representaron grandes desafíos para las organizaciones.", "doc": "U2-2", "page": 8}], "refs": [{"doc": "U2-1", "pages": [13]}, {"doc": "U2-2", "pages": [3, 8, 9]}, {"doc": "U2-3", "pages": [14]}]}, "ETI": {"label": "Ética", "unit": 2, "hub": true, "tag": "", "quotes": [{"t": "La ética, es una de las tantas ramas de la filosofía que estudia las cosas por sus causas, de lo universal y necesario, que se dedica al estudio de los actos humanos, aquellos que se realizan tanto por la voluntad y libertad absoluta, de la persona.", "doc": "U2-2", "page": 13}, {"t": "la moral tiene que ver con el nivel práctico o de la acción y la ética con el nivel teórico o de la reflexión.", "doc": "U2-2", "page": 14}], "refs": [{"doc": "U2-2", "pages": [3, 13, 14, 15, 16]}, {"doc": "U2-4", "pages": [3, 4, 9, 10, 11, 12, 13, 14, 15]}]}, "MOR": {"label": "Moral", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La moral es el conjunto de reglas o normas por las que se rige la conducta de un ser humano en concordancia con la sociedad y consigo mismo.", "doc": "U2-2", "page": 13}, {"t": "La palabra moral tiene su origen en el término latino mores, cuyo significado es costumbre, por lo tanto, la moral no implica por sí el concepto de malo o de bueno.", "doc": "U2-2", "page": 14}], "refs": [{"doc": "U2-1", "pages": [10]}, {"doc": "U2-2", "pages": [3, 13, 14, 15, 16]}, {"doc": "U2-4", "pages": [9, 10, 11, 12, 14]}]}, "ENF": {"label": "Enfoques éticos", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "A continuación se exponen varios temas relacionados con la ética y la moral, y algunos enfoques éticos a tener en cuenta para su aplicación dentro de las empresas.", "doc": "U2-2", "page": 3}, {"t": "La coexistencia en las organizaciones de los tres tipos de ética es importante, ya que de esta forma se asegura una opción de reflexión para los gerentes que se esfuerzan de evitar los tipos inmorales y amorales.", "doc": "U2-2", "page": 16}], "refs": [{"doc": "U2-2", "pages": [3, 14]}]}, "ENO": {"label": "Ética normativa", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La deontología forma parte de lo que se conoce como ética normativa (la filosofía que indica qué debería considerarse como bueno y qué es lo que debería calificarse como malo).", "doc": "U2-4", "page": 9}, {"t": "Ética normativa: Distinguimos las teorías Deontológicas y Teleológicas; incluyendo un tercer grupo: la Ética de la virtud.", "doc": "U2-4", "page": 13}], "refs": [{"doc": "U2-2", "pages": [16]}, {"doc": "U2-4", "pages": [9, 12, 13]}]}, "UTI": {"label": "Utilitarismo", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Bentham considera que la base de la deontología es el utilitarismo, lo que significa que los actos de las personas se consideran buenos o malos en función de la felicidad global que puedan generar. Según este marco teórico, el fin de una acción debe ser conseguir la máxima felicidad para el mayor número de personas.", "doc": "U2-4", "page": 11}, {"t": "Las Teorías Teleológicas se basan en las consecuencias, y su corriente principal es el utilitarismo.", "doc": "U2-4", "page": 13}], "refs": [{"doc": "U2-4", "pages": [11, 12, 13]}]}, "DEO": {"label": "Deontología profesional", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "Deontología es un concepto que se utiliza para nombrar a una clase de tratado o disciplina que se centra en el análisis de los deberes y de los valores regidos por la moral.", "doc": "U2-4", "page": 9}], "refs": [{"doc": "U2-4", "pages": [3, 9, 10, 12, 15, 17]}]}, "COD": {"label": "Códigos deontológicos", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Por este motivo, suele ser el propio colectivo profesional quién determina dichas normas y, a su vez, se encarga de recogerlas por escrito en los códigos deontológicos.", "doc": "U2-4", "page": 9}, {"t": "Esto sugiere una de las intenciones de la redacción de los códigos deontológicos: explicitar la dimensión estrictamente moral de una profesión, aquellos comportamientos exigibles a unos profesionales, aunque no estén delimitados jurídicamente, o quizá, por ello mismo.", "doc": "U2-4", "page": 11}], "refs": [{"doc": "U2-4", "pages": [9, 10, 11, 17]}]}, "CPRO": {"label": "Conciencia profesional", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La conciencia profesional es una dimensión esencial de la conciencia ética, a la que añade la responsabilidad que cada persona tiene. Se manifiesta en un comportamiento socialmente responsable acerca de los deberes específicos de una profesión después de haber interiorizado, asumido y personalizado un código de valores referentes a dicha profesión, para después analizar, aplicar y resolver problemas específicos de la profesión con la mejor competencia y rectitud posibles y socialmente exigibles.", "doc": "U2-4", "page": 15}], "refs": [{"doc": "U2-4", "pages": [15]}]}, "ENT": {"label": "Entorno organizacional", "unit": 2, "hub": true, "tag": "U2 · U3", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "En consecuencia, la empresa es totalmente dependiente de su entorno e interdependiente con él, por lo que su éxito o fracaso depende en gran medida de cómo se relaciona con éste.", "doc": "U2-3", "page": 5}], "refs": [{"doc": "U2-3", "pages": [3, 4]}]}, "EG": {"label": "Entorno general", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Entorno general: El cual afecta a todas las empresas, como lo puede ser la situación política, las variaciones en la economía, el marco jurídico-normativo, entre otros.", "doc": "U2-3", "page": 5}, {"t": "En este orden de ideas, es importante destacar que existen dos tipos de entornos que afecta de diversas formas a la empresa:", "doc": "U2-3", "page": 5}], "refs": [{"doc": "U2-3", "pages": [5]}]}, "EE": {"label": "Entorno específico", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}, {"t": "En este orden de ideas, es importante destacar que existen dos tipos de entornos que afecta de diversas formas a la empresa:", "doc": "U2-3", "page": 5}], "refs": [{"doc": "U2-3", "pages": [5]}]}, "STK": {"label": "Grupos de interés", "unit": 2, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "el efecto que la empresa puede tener sobre la calidad de vida de una serie de grupos de interés (stakeholders)", "doc": "U2-3", "page": 6}, {"t": "involucrados con ella, los cuales no son únicamente los accionistas y dueños, sino sus empleados, los consumidores, los proveedores, sindicatos, etc., algunos de ellos internos a la organización y otros externos, pero igualmente interesados y afectados con el papel que la empresa puede desempeñar dentro del ambiente.", "doc": "U2-3", "page": 7}], "refs": [{"doc": "U2-3", "pages": [6, 10]}, {"doc": "U3-3", "pages": [11]}]}, "POR": {"label": "Ventaja competitiva", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Michael Porter, quien ha efectuado importantes aportes en el campo de la competitividad y de la estrategia, recalca aún más, en La Ventaja Competitiva de las Naciones, la importancia del entorno para la empresa, ya que los cuatro elementos de su matriz se refieren a elementos del entorno:", "doc": "U2-3", "page": 7}, {"t": "Rivalidad en el mercado local: se refieren a empresas competidores en la misma actividad en la región o en el país, aspecto del ambiente que para Porter es importante para lograr la competitividad.", "doc": "U2-3", "page": 8}], "refs": [{"doc": "U2-3", "pages": [7]}]}, "GLO": {"label": "Globalización", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Por globalización entendemos la integración de los mercados internacionales de productos y de factores.", "doc": "U2-3", "page": 16}, {"t": "El entorno global es un conjunto de fuerzas y condiciones del mundo que están más allá de los límites de una organización y afectan la forma en que opera y moldean su conducta. Esas fuerzas cambian con el tiempo y por ello pueden representar oportunidades y amenazas para los gerentes.", "doc": "U2-3", "page": 17}], "refs": [{"doc": "U2-3", "pages": [3, 5, 16]}]}, "PET": {"label": "Postura etnocéntrica", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Una postura etnocéntrica es la idea de que los mejores métodos y prácticas de trabajo son los del país donde está la matriz de la compañía. Los gerentes que se adhieren a esta postura piensan que los extranjeros no poseen las destrezas, competencia, conocimientos o experiencia que sus compatriotas. No confiarían a los empleados extranjeros decisiones o tecnologías fundamentales.", "doc": "U2-3", "page": 18}], "refs": [{"doc": "U2-3", "pages": [18]}]}, "PPO": {"label": "Postura policéntrica", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La postura policéntrica es la idea de que los gerentes del país anfitrión (el país extranjero en el que la organización hace negocios) conocen los mejores métodos y prácticas para dirigir sus empresas. Los gerentes de postura policéntrica consideran que las operaciones foráneas son diferentes y difíciles de entender. Así, es probable que no intervengan en las instalaciones en el extranjero y dejen que los empleados locales determinen la mejor manera de hacer las cosas.", "doc": "U2-3", "page": 18}], "refs": [{"doc": "U2-3", "pages": [18]}]}, "PGE": {"label": "Postura geocéntrica", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La última actitud ante el mundo que pueden adoptar los gerentes es la postura geocéntrica, que es una idea cosmopolita de que hay que aprovechar los mejores métodos y empleados de todo el mundo.", "doc": "U2-3", "page": 18}, {"t": "Con la postura geocéntrica, los principales temas y decisiones se consideran en términos globales y se buscan los mejores métodos, cualquiera que sea su origen. La buena administración global requiere afinar la sensibilidad a las diferencias de costumbres y prácticas nacionales.", "doc": "U2-3", "page": 18}], "refs": [{"doc": "U2-3", "pages": [18]}]}, "ALI": {"label": "Alianzas comerciales", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "Una alianza comercial o de negocios es una relación formal entre dos o más organizaciones para alcanzar los objetivos comunes de negocio. Las alianzas de empresa conjunta, de franquicia, licencias cruzadas, marketing cruzado y comanufactura son algunas de las estructuras formales usadas para manejar las alianzas de negocios.", "doc": "U2-3", "page": 20}, {"t": "Cada tipo de alianza ofrece tanto ventajas como desventajas, pero generalmente permite que la compañía alcance su potencial de crecimiento de forma más rápida que si lo hace por sí sola.", "doc": "U2-3", "page": 20}], "refs": [{"doc": "U2-3", "pages": [3, 20, 21]}]}, "RSE": {"label": "Responsabilidad Social Empresaria", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La RSE es el “hacer negocios basados en principios éticos y apegados a la ley”. La empresa tiene un rol ante la sociedad, ante el entorno en el cual opera.", "doc": "U2-4", "page": 4}, {"t": "La responsabilidad social empresarial es la contribución activa y voluntaria al mejoramiento social, económico y ambiental por parte de las empresas, generalmente con el objetivo de mejorar su situación competitiva, valorativa y su valor añadido.", "doc": "U2-4", "page": 3}], "refs": [{"doc": "U2-4", "pages": [3, 4, 5, 6, 17]}]}, "DS": {"label": "Desarrollo sostenible", "unit": 2, "hub": false, "tag": "", "quotes": [{"t": "La RSE es el rol que le toca jugar a las empresas a favor del desarrollo sostenible, es decir, a favor del equilibrio entre el crecimiento económico, el bienestar social y el aprovechamiento de los recursos naturales y el medio ambiente.", "doc": "U2-4", "page": 5}, {"t": "Este equilibrio es vital para la operación de los negocios. Las empresas deben pasar a formar parte activa de la solución de los retos que tenemos como sociedad, por su propio interés de tener un entorno más estable y próspero.", "doc": "U2-4", "page": 5}], "refs": [{"doc": "U2-4", "pages": [5]}]}, "CT": {"label": "Control", "unit": 3, "hub": true, "tag": "U1 · U2 · U3", "quotes": [{"t": "El control es la fase del proceso administrativo a través de la cual se establecen estándares para evaluar los resultados obtenidos, con el objeto de corregir desviaciones, prevenirlas y mejorar continuamente las operaciones.", "doc": "U3-1", "page": 4}, {"t": "El control se enfoca en evaluar y corregir el desempeño de las actividades de los subordinados para asegurar que los objetivos y planes de la organización se están llevando a cabo.", "doc": "U3-1", "page": 6}], "refs": [{"doc": "U1-1", "pages": [11]}, {"doc": "U1-2", "pages": [5, 11]}, {"doc": "U1-3", "pages": [19, 23]}, {"doc": "U1-4", "pages": [11]}, {"doc": "U2-1", "pages": [5, 7, 10, 12, 16, 17]}, {"doc": "U2-2", "pages": [5]}, {"doc": "U2-3", "pages": [6]}, {"doc": "U2-4", "pages": [10]}, {"doc": "U3-1", "pages": [3, 4, 5, 6, 7, 10, 11, 13, 14, 16]}, {"doc": "U3-2", "pages": [3, 4, 5, 8, 9, 10, 11, 12, 14]}, {"doc": "U3-3", "pages": [3, 4, 5, 6, 8]}]}, "PA": {"label": "Proceso administrativo", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Si el control se conceptualiza como la última etapa del proceso administrativo, esto no significa que en la práctica suceda de la misma manera, las etapas del proceso administrativo están relacionadas a tal grado que, generalmente, el control se realiza en forma simultánea a otras etapas.", "doc": "U3-1", "page": 4}, {"t": "las primeras definiciones se concentraron fundamentalmente en la planeación, la organización, la dirección y el control", "doc": "U3-3", "page": 4}], "refs": [{"doc": "U3-1", "pages": [3, 4, 7, 16]}]}, "PL": {"label": "Planeación", "unit": 3, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "La información obtenida a través del control es básica para poder reiniciar el proceso de planeación.", "doc": "U3-1", "page": 4}, {"t": "previamente la organización tuvo que haber trabajo en definir su planeación estratégica. Esta define los objetivos y las metas que espera alcanzar a largo plazo y ayuda a tener una visión realista del futuro del negocio.", "doc": "U3-2", "page": 4}], "refs": [{"doc": "U2-3", "pages": [6, 12]}, {"doc": "U3-1", "pages": [4, 5, 7, 12]}, {"doc": "U3-2", "pages": [4, 5]}, {"doc": "U3-3", "pages": [4, 5, 6]}]}, "STD": {"label": "Estándares", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Un estándar es la unidad de medida que sirve como modelo, guía o patrón, para efectuar el control.", "doc": "U3-1", "page": 11}, {"t": "Los estándares deben abarcar las funciones básicas y áreas clave de resultados y también son conocidos como indicadores.", "doc": "U3-1", "page": 11}], "refs": [{"doc": "U2-3", "pages": [20]}, {"doc": "U2-4", "pages": [4]}, {"doc": "U3-1", "pages": [4, 7, 10, 11, 12, 13, 14]}]}, "MED": {"label": "Medición", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La medición de resultados consiste en la aplicación de unidades de medida para evaluar la ejecución y los resultados.", "doc": "U3-1", "page": 11}, {"t": "La medición implica la determinación, detección de fallas, desviaciones o no conformidades en relación con los estándares.", "doc": "U3-1", "page": 11}], "refs": [{"doc": "U3-1", "pages": [3, 10, 11, 12]}, {"doc": "U3-2", "pages": [4, 5, 8, 9, 10]}]}, "COR": {"label": "Corrección", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La corrección es la aplicación de medidas para eliminar las desviaciones o no conformidades en relación con los estándares. Antes de iniciar la acción correctiva es importante reconocer si la desviación es un síntoma o una causa.", "doc": "U3-1", "page": 12}], "refs": [{"doc": "U3-1", "pages": [10, 12, 13, 14]}]}, "RET": {"label": "Retroalimentación", "unit": 3, "hub": false, "tag": "U2 · U3", "quotes": [{"t": "La retroinformación consiste en la retroalimentación de los resultados obtenidos para efectuar mejoras en el proceso. De la calidad de la información depende el grado y rapidez con que se retroalimente el sistema. La retroinformación es fundamental para lograr la mejora continua, y es el sustento de la planeación.", "doc": "U3-1", "page": 12}], "refs": [{"doc": "U2-3", "pages": [6]}, {"doc": "U3-1", "pages": [7, 10, 12]}, {"doc": "U3-2", "pages": [9, 11]}]}, "DES": {"label": "Desviaciones", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Toda actividad experimenta algún tipo de variación, error o desvío. Es importante definir los límites dentro de los cuales esa variación se considera normal o deseable. No todas las variaciones requieren corrección, sino solo aquellas que sobrepasen los límites de los criterios de especificación.", "doc": "U3-1", "page": 12}], "refs": [{"doc": "U3-1", "pages": [4, 5, 6, 7, 11, 12]}]}, "EXC": {"label": "Principio de excepción", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "El control separa lo normal de lo excepcional, opera que la corrección se concentre en las excepciones o los desvíos. Este aspecto recuerda mucho el principio de excepción propuesto por Taylor. Para concentrarse en las excepciones el control debe disponer de técnicas que señalen con rapidez donde se origina el problema.", "doc": "U3-1", "page": 13}], "refs": [{"doc": "U3-1", "pages": [13]}]}, "PRE": {"label": "Prevención", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Uno de los principios de la calidad total estipula que la prevención es la mejor forma de control, porque si se planean las actividades y se capacita al personal para trabajar con eficiencia, seguramente se minimizarán los errores y se evitará el control correctivo.", "doc": "U3-1", "page": 5}], "refs": [{"doc": "U3-1", "pages": [5, 7]}]}, "GD": {"label": "Gestión del desempeño", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La gestión del desempeño es un enfoque estratégico para la gestión, que proporciona a gerentes, empleados y partes interesadas a diferentes niveles, los instrumentos necesarios para planificar con regularidad, supervisar continuamente, medir y revisar el desempeño de una organización periódicamente.", "doc": "U3-2", "page": 4}], "refs": [{"doc": "U3-2", "pages": [4, 11]}]}, "DOR": {"label": "Desempeño organizacional", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "el desempeño se relaciona a su vez con el cumplimiento de los objetivos y de la estrategia, ya que la calificación que se le dé al desempeño depende de si se alcanzan de manera adecuada los objetivos", "doc": "U3-2", "page": 10}, {"t": "El desempeño organizacional, por tanto, no sólo está relacionado con el rendimiento financiero, sino que está relacionado también con todos aquellos factores que lo pueden afectar al interior de la organización.", "doc": "U3-2", "page": 10}], "refs": [{"doc": "U3-2", "pages": [3, 4, 5, 8, 10, 11, 12, 14]}]}, "SCG": {"label": "Control de gestión", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "El control de gestión se relaciona con la intencionalidad de mejoramiento y de desempeño positivo que tienen los directivos de la organización", "doc": "U3-2", "page": 10}, {"t": "Los sistemas de control de gestión abarcan medidas de desempeño tanto financieras como no financieras.", "doc": "U3-2", "page": 8}, {"t": "los SCG colaboran en el logro de los objetivos con un rendimiento determinado, ya que aseguran y retroalimentan los factores que impulsan el desempeño.", "doc": "U3-2", "page": 10}], "refs": [{"doc": "U3-2", "pages": [3, 8, 10, 12, 14]}]}, "KPI": {"label": "Indicadores", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "una medida es el instrumento utilizado para cuantificar la eficiencia y la efectividad de la acción, por lo tanto, una medida de rendimiento es a la vez cuantificable y verificable. Para medir son utilizados indicadores que se componen de tres elementos que los hacen más que una medida de desempeño", "doc": "U3-2", "page": 5}, {"t": "Los estándares deben abarcar las funciones básicas y áreas clave de resultados y también son conocidos como indicadores.", "doc": "U3-1", "page": 11}], "refs": [{"doc": "U1-1", "pages": [7]}, {"doc": "U2-2", "pages": [18]}, {"doc": "U3-1", "pages": [11, 12, 14]}, {"doc": "U3-2", "pages": [5, 8]}]}, "ESTR": {"label": "Estrategia", "unit": 3, "hub": false, "tag": "U1 · U3", "quotes": [{"t": "el punto de partida y punto común de cualquier relación es la estrategia, así como las prescripciones administrativas plasmadas en objetivos, planes y programas.", "doc": "U3-2", "page": 12}, {"t": "Para identificar las variables críticas para el rendimiento correcto, es necesario analizar la estrategia prevista de la empresa y los objetivos específicos asociados con esa estrategia.", "doc": "U3-2", "page": 9}], "refs": [{"doc": "U1-2", "pages": [6, 11]}, {"doc": "U1-3", "pages": [25, 26, 27]}, {"doc": "U1-4", "pages": [4, 6, 11, 12]}, {"doc": "U2-1", "pages": [10, 17]}, {"doc": "U2-2", "pages": [6, 8, 10, 15]}, {"doc": "U2-3", "pages": [7, 20, 21]}, {"doc": "U2-4", "pages": [3]}, {"doc": "U3-2", "pages": [3, 4, 6, 9, 10, 11, 12]}, {"doc": "U3-3", "pages": [14, 15]}]}, "TC": {"label": "Tablero de comando", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "El tablero de comando que veremos más adelante es un ejemplo de sistema medición del desempeño, la propuesta de este enfoque es asignar metas a las unidades de negocio y después medirlas de acuerdo a cuatro perspectivas", "doc": "U3-2", "page": 9}], "refs": [{"doc": "U3-2", "pages": [9]}]}, "BEN": {"label": "Benchmarking", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La ventaja de la comparación externa es la identificación de prácticas óptimas (competidores y/o empresas de otros sectores), que son tomadas como ejemplos para mejorar las prácticas propias (benchmarking).", "doc": "U3-2", "page": 8}], "refs": [{"doc": "U3-2", "pages": [8]}]}, "IES": {"label": "Información estratégica", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Información estratégica para los niveles gerenciales altos.", "doc": "U3-3", "page": 5}, {"t": "dado que los niveles gerenciales superiores se ocupan de la planeación y dado que la planeación requiere de mayor cantidad de información concerniente al entorno externo, la información relativa al entorno externo deberá ser cada vez más resumida y selectiva conforme la posición del receptor sea menor dentro de la jerarquía gerencial.", "doc": "U3-3", "page": 5}], "refs": [{"doc": "U3-3", "pages": [5]}]}, "ITA": {"label": "Información táctica", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Información táctica para los niveles gerenciales medios.", "doc": "U3-3", "page": 5}, {"t": "El tipo de información a ser suministrada se establecerá en base a la posición relativa del gerente en la jerarquía de la organización y en las actividades que describe la información (el ambiente interno de la organización o el ambiente externo en el cual opera).", "doc": "U3-3", "page": 5}], "refs": [{"doc": "U3-3", "pages": [5]}]}, "IOP": {"label": "Información operativa", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Información operativa para los niveles gerenciales bajos.", "doc": "U3-3", "page": 5}, {"t": "La razón de esto es que los datos internos tienen por objetivo el control y que los escalafones inferiores y medios de la gerencia en su mayoría también tienen por objetivo el control", "doc": "U3-3", "page": 5}], "refs": [{"doc": "U3-3", "pages": [5]}]}, "NIV": {"label": "Niveles gerenciales", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Debido a que la salida de un Sistema de Información está dirigida a la gestión, es necesario identificar el tipo de información requerida por los distintos niveles de la gerencia.", "doc": "U3-3", "page": 5}, {"t": "los tiempos dedicados a la planeación y el control por los niveles gerenciales inferiores, medios y superiores se complementan mutuamente en un sistema de información gerencial.", "doc": "U3-3", "page": 6}], "refs": [{"doc": "U3-3", "pages": [5, 6]}]}, "FLU": {"label": "Flujo de información", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}, {"t": "Dentro de una organización, se genera constantemente un importante flujo de información y conocimiento, que se manifiesta como un recurso intangible; ellos son especialmente valiosos para la empresa, porque son difíciles de imitar.", "doc": "U3-3", "page": 15}], "refs": [{"doc": "U3-3", "pages": [8, 15]}]}, "EJE": {"label": "Esquema jerárquico", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "El esquema jerárquico se basa en las ideas de jerarquía y obediencia, y utiliza nociones como control, mando, orden, instrucción, autoridad, etc. En este esquema, la información fluye de abajo a arriba (bottom-up) y las órdenes emanan de arriba a abajo (top-down).", "doc": "U3-3", "page": 8}], "refs": [{"doc": "U3-3", "pages": [8]}]}, "FV": {"label": "Flujo vertical", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Este cambio de modelos en la estructura de las empresas conllevaría la sustitución del actual modelo de flujo vertical de información (información de abajo-arriba, de arriba-\nabajo) por un modelo horizontal (información entre iguales)", "doc": "U3-3", "page": 8}], "refs": [{"doc": "U3-3", "pages": [8]}]}, "FH": {"label": "Modelo horizontal", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "por un modelo horizontal (información entre iguales) como se muestra en los siguientes gráficos", "doc": "U3-3", "page": 8}, {"t": "todos los miembros de la empresa, y no sólo los directivos, realizan en mayor o menor medida, cuatro funciones informacionales básicas", "doc": "U3-3", "page": 10}, {"t": "todos deben ser considerados consumidores, procesadores y generadores de información.", "doc": "U3-3", "page": 10}], "refs": [{"doc": "U3-3", "pages": [8]}]}, "ACH": {"label": "Achatamiento de la pirámide", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La complejidad creciente de las empresas requiere de una cierta distribución de la capacidad de decisión entre todos los miembros de la empresa (autonomía en la toma de decisiones), es decir requiere de un achatamiento de la pirámide jerárquica (menos mandos intermedios, más conexión entre la dirección estratégica y los niveles operativos)", "doc": "U3-3", "page": 8}], "refs": [{"doc": "U3-3", "pages": [8]}]}, "INFX": {"label": "Infoxicación", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La explosión de la información constituye para muchos un problema y por eso surgió el término \"infoxicación\", precisamente para referirse a dicho fenómeno desde la perspectiva del usuario.", "doc": "U3-3", "page": 10}, {"t": "El problema entonces está en la calidad y en la visibilidad de la información y no en su cantidad.", "doc": "U3-3", "page": 10}], "refs": [{"doc": "U3-3", "pages": [10]}]}, "GC": {"label": "Gestión del conocimiento", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La gestión del conocimiento se ocupa precisamente de la identificación, captura, recuperación, presentación y transmisión de los datos, informaciones y conocimientos de la organización.", "doc": "U3-3", "page": 11}, {"t": "Administrar el conocimiento en una empresa significa detectar, organizar y difundir el conocimiento existente en la organización y colocarlo a disposición de sus usuarios.", "doc": "U3-3", "page": 13}], "refs": [{"doc": "U3-3", "pages": [11, 17]}]}, "TAC": {"label": "Conocimiento tácito", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "El conocimiento puede ser explícito - cuando está plasmado en documentos, procedimientos, bases de datos de información, etc. o tácito - cuando forma parte de la experiencia de los individuos que trabajan en la empresa.", "doc": "U3-3", "page": 13}], "refs": [{"doc": "U3-3", "pages": [13]}]}, "OA": {"label": "Organización que aprenda", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "Una organización que aspire a competir con éxito, debe ser una organización que aprenda; debe, también, revelar los procesos que le permitan incorporar a su actividad, la información pertinente y relevante que posee.", "doc": "U3-3", "page": 11}], "refs": [{"doc": "U3-3", "pages": [11]}]}, "IAG": {"label": "Información ambiental", "unit": 3, "hub": false, "tag": "", "quotes": [{"t": "La información ambiental general es aquella que su relación con la organización es más remota, con ella no se relaciona a diario, pero debe observársele con sistematicidad porque puede incidir en los cambios, políticas y estrategias de la empresa a mediano o largo plazo.", "doc": "U3-3", "page": 15}, {"t": "La información ambiental específica es aquella que la empresa toma o analiza de su entorno más cercano", "doc": "U3-3", "page": 15}], "refs": [{"doc": "U3-3", "pages": [14, 15]}]}}, "edges": {"TD|AS": {"a": "TD", "b": "AS", "link": "El texto ubica el análisis situacional como la primera fase del proceso de toma de decisiones: antes de elegir hay que determinar la situación y sus elementos relevantes.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Las fases principales en un proceso de toma de decisiones son:", "doc": "U1-1", "page": 5}, {"t": "Supone determinar cuáles son los síntomas relevantes de una determinada situación o escenario de trabajo dentro de la organización, que conducirán a la sensación de que son el resultado de la existencia de un problema o causa que los provoca.", "doc": "U1-1", "page": 5}, {"t": "Según estas definiciones el proceso de toma de decisiones sería encontrar una conducta adecuada para una situación en la que hay una serie de sucesos inciertos. La elección de la situación ya es un elemento que puede entrar en el proceso. Hay que elegir los elementos que son relevantes y obviar los que no lo son y analizar las relaciones entre ellos.", "doc": "U1-1", "page": 5}]}, "AS|SI": {"a": "AS", "b": "SI", "link": "El análisis situacional consiste justamente en detectar los síntomas relevantes de la situación, que sugieren la existencia de un problema.", "quotes": [{"t": "Supone determinar cuáles son los síntomas relevantes de una determinada situación o escenario de trabajo dentro de la organización, que conducirán a la sensación de que son el resultado de la existencia de un problema o causa que los provoca.", "doc": "U1-1", "page": 5}, {"t": "Los síntomas aparecen en cualquier sitio, pero en general, si se poseen buenas dotes de observación se podrían buscar en:", "doc": "U1-1", "page": 6}, {"t": "Todas estas variables y otras de otro tipo, pueden dar lugar a pensar que tenemos algún tipo de problema ya que los síntomas que aparecen no tienen una correlación positiva con los preconizados por el plan estratégico de la organización.", "doc": "U1-1", "page": 6}]}, "SI|DP": {"a": "SI", "b": "DP", "link": "Definir bien el problema exige buscar la causa o conjunto de causas que mejor expliquen los síntomas detectados.", "quotes": [{"t": "Todas estas variables y otras de otro tipo, pueden dar lugar a pensar que tenemos algún tipo de problema ya que los síntomas que aparecen no tienen una correlación positiva con los preconizados por el plan estratégico de la organización.", "doc": "U1-1", "page": 6}, {"t": "Podemos definir un problema como la barrera que nos separa de una situación o escenario deseado.", "doc": "U1-1", "page": 6}, {"t": "Según definamos un problema se nos ocurrirán mejores o peores soluciones. Para definir bien un problema es necesario buscar la causa o el conjunto de causas que expliquen mejor los síntomas o, por lo menos, su mayor número.", "doc": "U1-1", "page": 7}, {"t": "¿Cómo está pasando? Supone la descripción de los mecanismos intervinientes y de todas aquellas variables afectadas por la causa o problema. Esto nos confirma los síntomas y nos orienta sobre las causas.", "doc": "U1-1", "page": 7}]}, "DP|GA": {"a": "DP", "b": "GA", "link": "Según cómo se defina el problema surgirán mejores o peores soluciones; la definición condiciona la fase de generación.", "quotes": [{"t": "Podemos definir un problema como la barrera que nos separa de una situación o escenario deseado.", "doc": "U1-1", "page": 6}, {"t": "Esta es una buena aproximación a la definición ya que se goza en ella de que las vías de solución aparezcan casi instantáneamente. Según definamos un problema se nos ocurrirán mejores o peores soluciones.", "doc": "U1-1", "page": 6}, {"t": "Las soluciones se generan pensando. Pensar supone la utilización de todos los recursos mentales con la finalidad de resolver un problema manifiesto o aplazado.", "doc": "U1-1", "page": 7}, {"t": "En el problema, que es el primer aspecto de este método, debemos tener en cuenta que el posterior desarrollo del proceso dependerá de la forma de plantearlo y delimitarlo.", "doc": "U1-3", "page": 5}]}, "GA|VS": {"a": "GA", "b": "VS", "link": "Las soluciones primero se generan sin censura y recién en la fase siguiente se valoran con criterios de costo, calidad, temporalidad y reacciones secundarias.", "quotes": [{"t": "Las soluciones se generan pensando. Pensar supone la utilización de todos los recursos mentales con la finalidad de resolver un problema manifiesto o aplazado.", "doc": "U1-1", "page": 7}, {"t": "Las fases principales en un proceso de toma de decisiones son:", "doc": "U1-1", "page": 5}, {"t": "Las soluciones se pueden evaluar normalmente con cargo a los siguientes criterios:", "doc": "U1-1", "page": 8}, {"t": "Se debería elegir la solución que mejor puntuara.", "doc": "U1-1", "page": 8}, {"t": "destaca la de actuar con una ausencia total de crítica para generar alternativas que serán evaluadas en otra fase.", "doc": "U1-3", "page": 21}]}, "GA|ALT": {"a": "GA", "b": "ALT", "link": "La fase de generación de soluciones consiste en producir, con creatividad, el mayor número posible de alternativas viables entre las cuales elegir.", "quotes": [{"t": "Las soluciones se generan pensando. Pensar supone la utilización de todos los recursos mentales con la finalidad de resolver un problema manifiesto o aplazado.", "doc": "U1-1", "page": 7}, {"t": "Dentro de la teoría de la decisión, una alternativa es una de al menos dos cosas o acciones que pueden ser elegidas o tomadas en alguna circunstancia.", "doc": "U1-3", "page": 10}, {"t": "En la toma de decisiones se trata de generar el mayor número de alternativas viables, de modo de tener un amplio margen de elección. Por lo tanto, debemos ser creativos en la búsqueda, de manera que podamos tener en cuenta todas las alternativas posibles.", "doc": "U1-3", "page": 10}, {"t": "Generar conductas alternativas posibles dentro del modelo de la realidad que se ha creado. Es una fase que depende de la creatividad del individuo. Se trata de imaginar las alternativas posibles.", "doc": "U1-3", "page": 21}]}, "TD|PRO": {"a": "TD", "b": "PRO", "link": "PROACTITUD es el método que el texto propone para recorrer, etapa por etapa, el proceso de toma de decisiones.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Pero disponer de ese método y poder adaptarlo a cada situación particular puede servir de ayuda para dar con la decisión adecuada.", "doc": "U1-3", "page": 3}]}, "PRO|OBJ": {"a": "PRO", "b": "OBJ", "link": "Objetivos es una etapa de PROACTITUD: la decisión final debe llevar al objetivo, por eso hay que pensarlos bien para orientar la decisión.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Un objetivo es una meta o finalidad a cumplir para la que se disponen medios determinados.", "doc": "U1-3", "page": 8}, {"t": "En el proceso de toma de decisiones, la decisión final debe llevarnos al objetivo. Y si una decisión es un medio para llegar a un fin, entonces debemos pensar correctamente los objetivos para darles la dirección adecuada a nuestras decisiones.", "doc": "U1-3", "page": 8}, {"t": "Así, si los objetivos que rigen la decisión, enunciados o no, son inadecuados, no hay alternativa, por más excelente que sea, que pueda ayudarnos después.", "doc": "U1-3", "page": 9}]}, "PRO|ALT": {"a": "PRO", "b": "ALT", "link": "Alternativas es una etapa de PROACTITUD en la que se busca generar el mayor número posible de opciones viables para ampliar el margen de elección.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Dentro de la teoría de la decisión, una alternativa es una de al menos dos cosas o acciones que pueden ser elegidas o tomadas en alguna circunstancia.", "doc": "U1-3", "page": 10}, {"t": "En la toma de decisiones se trata de generar el mayor número de alternativas viables, de modo de tener un amplio margen de elección. Por lo tanto, debemos ser creativos en la búsqueda, de manera que podamos tener en cuenta todas las alternativas posibles.", "doc": "U1-3", "page": 10}, {"t": "Es muy importante la elección de la alternativa que vamos a utilizar como decisión final, ya que esta decisión quedará delimitada por la creatividad y viabilidad de la alternativa considerada.", "doc": "U1-3", "page": 11}]}, "PRO|CON": {"a": "PRO", "b": "CON", "link": "Consecuencias es una etapa de PROACTITUD: antes de elegir hay que establecer los hechos derivados de cada alternativa y su impacto.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "En principio una consecuencia es un hecho o acontecimiento que se deriva o resulta de otro.", "doc": "U1-3", "page": 12}, {"t": "Cada alternativa tiene sus consecuencias, por eso, antes de elegir una alternativa entre todas las consideradas, debemos establecer claramente cuáles son esos hechos derivados, y cuál es el impacto que pueden llegar a tener en nuestra decisión y sus resultados.", "doc": "U1-3", "page": 12}]}, "PRO|TRA": {"a": "PRO", "b": "TRA", "link": "Transacciones es una etapa de PROACTITUD: como no hay alternativas perfectas, hay que fijar prioridades y buscar un punto medio entre objetivos contradictorios.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Del latín transactĭo, transacción es un término definido por el diccionario de la Real Academia Española (RAE) como la acción y efecto de transigir, acordar voluntariamente con otra parte algún punto litigioso para compartir la diferencia de la disputa, consentir a fin de terminar con una diferencia.", "doc": "U1-3", "page": 12}, {"t": "Debemos considerar que en las decisiones no hay alternativas perfectas, ya que cada alternativa cumple con un conjunto diferente de objetivos y conlleva una serie de consecuencias, en parte positivas y en parte negativas. Se trata de encontrar un punto medio cuando los objetivos son contradictorios, para lo cual hay que fijar prioridades, y también de encontrar un punto medio en las consecuencias que se derivan de cada alternativa.", "doc": "U1-3", "page": 12}, {"t": "Debemos hacer transacciones cuando tenemos que sacrificar o compensar algunos aspectos de diferentes alternativas que se presentan como contradictorios.", "doc": "U1-3", "page": 13}]}, "PRO|INC": {"a": "PRO", "b": "INC", "link": "Incertidumbres es una etapa de PROACTITUD: la duda dificulta la decisión y obliga a evaluar resultados e impactos preguntándose qué puede pasar.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "La incertidumbre hace más difícil la decisión, por eso tenemos que evaluar los distintos resultados y su impacto, para obtener un mayor grado de certeza. Para esto podemos preguntarnos: “¿qué puede suceder en el futuro?”.", "doc": "U1-3", "page": 14}]}, "PRO|TR": {"a": "PRO", "b": "TR", "link": "Tolerancia al riesgo es una etapa de PROACTITUD: conocer el nivel de riesgo que uno acepta facilita elegir la alternativa adecuada.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "la tolerancia al riesgo es la capacidad de aceptar riesgo; es el nivel de riesgo que un individuo u organización puede o está dispuesto a soportar.", "doc": "U1-3", "page": 14}, {"t": "Cada persona es diferente en cuanto a la tolerancia al riesgo y tener conciencia de ello generará un proceso más suave y eficiente en la toma de decisiones.", "doc": "U1-3", "page": 14}, {"t": "Ser conscientes de nuestra tolerancia nos facilitará elegir la alternativa con el nivel adecuado de riesgo para nosotros.", "doc": "U1-3", "page": 14}]}, "PRO|URD": {"a": "PRO", "b": "URD", "link": "Urdimbres psicológicas es una etapa de PROACTITUD porque las características psicológicas del decisor influyen en todo el proceso.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Utilizamos el término urdimbre como sinónimo de tejido, nos referimos entonces a la construcción de la trama de nuestra psiquis. En esta construcción están presentes la influencia de lo experimentado, nuestra emociones y sentimientos.", "doc": "U1-3", "page": 15}, {"t": "Es un elemento que debemos tener en cuenta en la toma de decisiones, ya que nuestras características psicológicas influyen en todo el proceso. Podemos sintetizar a esta estructura en el concepto de modelos mentales.", "doc": "U1-3", "page": 15}]}, "PRO|DVI": {"a": "PRO", "b": "DVI", "link": "Decisiones vinculadas es la última etapa de PROACTITUD: lo que se decide hoy condiciona las decisiones futuras y viceversa.", "quotes": [{"t": "PROACTITUD es un método sencillo que nos permite recorrer un proceso de toma de decisiones, marcando claramente cada etapa:", "doc": "U1-3", "page": 4}, {"t": "Tenemos que pensar que lo que decidamos hoy podría influir en las decisiones que debamos tomar en el futuro, y que nuestras metas para el mañana influyen en las decisiones que debemos tomar hoy.", "doc": "U1-3", "page": 16}, {"t": "El criterio a seguir es colocar las actividades en orden de prioridades, para explotar los conocimientos y experiencia que vamos adquiriendo en el camino, esto hará que reduzcamos incertidumbres y podamos tomar decisiones acertadas.", "doc": "U1-3", "page": 16}]}, "URD|MM": {"a": "URD", "b": "MM", "link": "El texto sintetiza la urdimbre psicológica del decisor en el concepto de modelos mentales, que determinan lo que vemos y modelan nuestros actos.", "quotes": [{"t": "Utilizamos el término urdimbre como sinónimo de tejido, nos referimos entonces a la construcción de la trama de nuestra psiquis. En esta construcción están presentes la influencia de lo experimentado, nuestra emociones y sentimientos.", "doc": "U1-3", "page": 15}, {"t": "Es un elemento que debemos tener en cuenta en la toma de decisiones, ya que nuestras características psicológicas influyen en todo el proceso. Podemos sintetizar a esta estructura en el concepto de modelos mentales.", "doc": "U1-3", "page": 15}, {"t": "Los modelos mentales son representaciones internas de una realidad externa. Son concepciones generales, que dirigen nuestros actos y que somos capaces de construir a partir de la experiencia.", "doc": "U1-3", "page": 15}, {"t": "Como un cristal que distorsionara sutilmente nuestra visión, los modelos mentales determinan lo que vemos y explican por qué dos personas pueden observar el mismo acontecimiento y describirlo de maneras distintas: prestan atención a distintos detalles. Los modelos mentales también modelan nuestros actos.", "doc": "U1-3", "page": 15}]}, "ALT|CON": {"a": "ALT", "b": "CON", "link": "Cada alternativa tiene sus consecuencias; por eso antes de elegir hay que establecer los hechos derivados de cada una y su impacto.", "quotes": [{"t": "Dentro de la teoría de la decisión, una alternativa es una de al menos dos cosas o acciones que pueden ser elegidas o tomadas en alguna circunstancia.", "doc": "U1-3", "page": 10}, {"t": "En principio una consecuencia es un hecho o acontecimiento que se deriva o resulta de otro.", "doc": "U1-3", "page": 12}, {"t": "Cada alternativa tiene sus consecuencias, por eso, antes de elegir una alternativa entre todas las consideradas, debemos establecer claramente cuáles son esos hechos derivados, y cuál es el impacto que pueden llegar a tener en nuestra decisión y sus resultados.", "doc": "U1-3", "page": 12}, {"t": "Decisiones. Son combinaciones de situaciones y conductas que pueden ser descritas en términos de tres componentes esenciales: acciones alternativas, consecuencias y sucesos inciertos.", "doc": "U1-1", "page": 4}]}, "TRA|OBJ": {"a": "TRA", "b": "OBJ", "link": "Las transacciones aparecen porque cada alternativa cumple objetivos distintos: cuando los objetivos son contradictorios hay que fijar prioridades y buscar un punto medio.", "quotes": [{"t": "Del latín transactĭo, transacción es un término definido por el diccionario de la Real Academia Española (RAE) como la acción y efecto de transigir, acordar voluntariamente con otra parte algún punto litigioso para compartir la diferencia de la disputa, consentir a fin de terminar con una diferencia.", "doc": "U1-3", "page": 12}, {"t": "Un objetivo es una meta o finalidad a cumplir para la que se disponen medios determinados.", "doc": "U1-3", "page": 8}, {"t": "Debemos considerar que en las decisiones no hay alternativas perfectas, ya que cada alternativa cumple con un conjunto diferente de objetivos y conlleva una serie de consecuencias, en parte positivas y en parte negativas. Se trata de encontrar un punto medio cuando los objetivos son contradictorios, para lo cual hay que fijar prioridades, y también de encontrar un punto medio en las consecuencias que se derivan de cada alternativa.", "doc": "U1-3", "page": 12}, {"t": "Debemos hacer transacciones cuando tenemos que sacrificar o compensar algunos aspectos de diferentes alternativas que se presentan como contradictorios.", "doc": "U1-3", "page": 13}]}, "DVI|INC": {"a": "DVI", "b": "INC", "link": "Ordenar las decisiones vinculadas por prioridad permite aprovechar la experiencia que se adquiere en el camino y así reducir incertidumbres.", "quotes": [{"t": "Tenemos que pensar que lo que decidamos hoy podría influir en las decisiones que debamos tomar en el futuro, y que nuestras metas para el mañana influyen en las decisiones que debemos tomar hoy.", "doc": "U1-3", "page": 16}, {"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "El criterio a seguir es colocar las actividades en orden de prioridades, para explotar los conocimientos y experiencia que vamos adquiriendo en el camino, esto hará que reduzcamos incertidumbres y podamos tomar decisiones acertadas.", "doc": "U1-3", "page": 16}]}, "TR|INC": {"a": "TR", "b": "INC", "link": "El riesgo se define como el efecto de la incertidumbre sobre los objetivos de la decisión, y la tolerancia al riesgo es cuánto de ese efecto se está dispuesto a soportar.", "quotes": [{"t": "la tolerancia al riesgo es la capacidad de aceptar riesgo; es el nivel de riesgo que un individuo u organización puede o está dispuesto a soportar.", "doc": "U1-3", "page": 14}, {"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "Por un lado, el riesgo puede definirse como el efecto de la incertidumbre en los objetivos de la
