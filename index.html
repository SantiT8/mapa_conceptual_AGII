 decisión; efecto que puede ser negativo, positivo o una desviación de los objetivos.", "doc": "U1-3", "page": 14}, {"t": "Cada persona es diferente en cuanto a la tolerancia al riesgo y tener conciencia de ello generará un proceso más suave y eficiente en la toma de decisiones.", "doc": "U1-3", "page": 14}]}, "TD|INC": {"a": "TD", "b": "INC", "link": "Tomar decisiones es encontrar una conducta adecuada ante sucesos inciertos; la incertidumbre es uno de los contextos y componentes esenciales de la decisión.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "Incertidumbre. Se refiere a los juicios de quien toma la decisión de la propensión de cada suceso de ocurrir.", "doc": "U1-1", "page": 4}, {"t": "Según estas definiciones el proceso de toma de decisiones sería encontrar una conducta adecuada para una situación en la que hay una serie de sucesos inciertos. La elección de la situación ya es un elemento que puede entrar en el proceso. Hay que elegir los elementos que son relevantes y obviar los que no lo son y analizar las relaciones entre ellos.", "doc": "U1-1", "page": 5}, {"t": "Una situación de incertidumbre es aquella en la que un sujeto toma la decisión sin conocer del todo la situación y existen varios resultados para cada estrategia.", "doc": "U1-3", "page": 25}]}, "TD|RIE": {"a": "TD", "b": "RIE", "link": "La situación de riesgo es un contexto de la toma de decisiones en el que se conocen el problema y las soluciones, pero los resultados solo con cierta probabilidad.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "La toma de decisiones se puede dar en diferentes contextos como la situación de certeza, de incertidumbre, decisiones no competitivas, decisiones competitivas y situaciones de riesgo.", "doc": "U1-3", "page": 25}, {"t": "La información con la que se cuenta para solucionar el problema es incompleta, es decir, se conoce el problema, se conocen las posibles soluciones, pero no se conoce con certeza los resultados que pueden arrojar.", "doc": "U1-3", "page": 27}, {"t": "En este tipo de decisiones, las posibles alternativas de solución tienen cierta probabilidad conocida de generar un resultado. En estos casos se pueden usar modelos matemáticos o también el decisor puede hacer uso de la probabilidad objetiva o subjetiva para estimar el posible resultado.", "doc": "U1-3", "page": 27}]}, "TD|CER": {"a": "TD", "b": "CER", "link": "La situación de certeza es el contexto de decisión donde el sujeto tiene información completa y conoce el resultado, por lo que decidir no implica dificultad.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "La toma de decisiones se puede dar en diferentes contextos como la situación de certeza, de incertidumbre, decisiones no competitivas, decisiones competitivas y situaciones de riesgo.", "doc": "U1-3", "page": 25}, {"t": "Una situación de certeza es aquella en la que un sujeto tiene información completa sobre una situación determinada, sobre cómo evolucionará y conoce el resultado de su decisión.", "doc": "U1-3", "page": 25}, {"t": "La toma de decisiones en un marco de certeza no implica dificultad alguna, más allá de las relacionadas con la gestión empresarial.", "doc": "U1-3", "page": 25}]}, "TD|JUE": {"a": "TD", "b": "JUE", "link": "Las decisiones competitivas, en las que un oponente conoce y contrarresta las estrategias del decisor, se estudian en la teoría de juegos.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "La toma de decisiones se puede dar en diferentes contextos como la situación de certeza, de incertidumbre, decisiones no competitivas, decisiones competitivas y situaciones de riesgo.", "doc": "U1-3", "page": 25}, {"t": "Muchas veces la empresa se enfrenta a un oponente que conoce sus estrategias y que escogerá aquella que más le perjudique. Estas decisiones se estudian en la teoría de juegos. Esta teoría considera que en la toma de decisiones intervienen pocos individuos, con información diferente y, generalmente incompleta, sobre los resultados de las decisiones.", "doc": "U1-3", "page": 27}, {"t": "Conflicto puro: las ganancias de un “jugador” son pérdidas para el otro (juego bipersonal de suma cero).", "doc": "U1-3", "page": 27}]}, "INC|CRI": {"a": "INC", "b": "CRI", "link": "Cuando se decide en incertidumbre no se conocen las probabilidades, por lo que la elección se guía por criterios (maximin, maximax, Hurwicz, Savage) que reflejan la actitud ante el riesgo.", "quotes": [{"t": "La incertidumbre se refiere a la duda o perplejidad que se tiene sobre un asunto o cuestión.", "doc": "U1-3", "page": 13}, {"t": "Una situación de incertidumbre es aquella en la que un sujeto toma la decisión sin conocer del todo la situación y existen varios resultados para cada estrategia.", "doc": "U1-3", "page": 25}, {"t": "En las decisiones no competitivas nadie se opone a la estrategia del sujeto que decide. Ej: vendedores de periódicos (se quiere conocer la cantidad a adquirir de acuerdo con las ventas). Para decidir existen una serie de criterios de elección:", "doc": "U1-3", "page": 26}, {"t": "Criterios existentes para tomar una decisión en situación de incertidumbre:", "doc": "U1-4", "page": 12}, {"t": "En cambio, cuando se toma una decisión en condiciones de incertidumbre se desconoce la probabilidad de que suceda cada uno de los posibles estados de la naturaleza. Por este motivo, en este caso la decisión depende de la persona que deba tomarla y de su actitud ante el riesgo.", "doc": "U1-4", "page": 12}]}, "MAT|CRI": {"a": "MAT", "b": "CRI", "link": "Sobre la matriz de resultados se aplican los criterios de elección en incertidumbre, que comparan los desenlaces de cada estrategia según el estado de la naturaleza.", "quotes": [{"t": "Una matriz de resultados de decisión es un gráfico que permite a un equipo o un individuo identificar y analizar la tasa de la fuerza de las relaciones entre conjuntos de información.", "doc": "U1-4", "page": 11}, {"t": "La matriz está formada por los siguientes elementos:", "doc": "U1-4", "page": 11}, {"t": "Criterios existentes para tomar una decisión en situación de incertidumbre:", "doc": "U1-4", "page": 12}, {"t": "Criterio optimista: Se denomina también maxi-max, es el que elegiría una persona que pensase que fuese cual fuese la estrategia que eligiera, siempre se le presentaría el estado de la naturaleza más favorable, por ello elegiría la estrategia que presentase el mejor resultado", "doc": "U1-4", "page": 12}, {"t": "Criterio de Savage: Lo utilizarían las personas que tienen miedo a equivocarse, por ello se crea una nueva matriz de desenlaces en términos de costo de oportunidad. Sustituyendo los valores anteriores o resultados por los perjuicios resultantes de no haber elegido la mejor estrategia, es decir, el costo de oportunidad. De este modo este criterio muestra lo que se deja de ganar por escoger una estrategia equivocada.", "doc": "U1-4", "page": 12}]}, "MAT|EN": {"a": "MAT", "b": "EN", "link": "Los estados de la naturaleza son uno de los elementos de la matriz de resultados: las variables no controladas que condicionan el desenlace de cada estrategia.", "quotes": [{"t": "Una matriz de resultados de decisión es un gráfico que permite a un equipo o un individuo identificar y analizar la tasa de la fuerza de las relaciones entre conjuntos de información.", "doc": "U1-4", "page": 11}, {"t": "Estrategias: formadas por variables controladas que son las alternativas u opciones que se pueden elegir.", "doc": "U1-4", "page": 11}, {"t": "Estados de la naturaleza: son variables no controladas, representan los sucesos en los que no se puede influir y que condicionan la decisión que se tome.", "doc": "U1-4", "page": 11}, {"t": "Resultados o desenlaces: son los resultados esperados en cada una de las estrategias, dado un estado concreto de la naturaleza.", "doc": "U1-4", "page": 11}]}, "ARB|EN": {"a": "ARB", "b": "EN", "link": "En el árbol de decisión el resultado de cada decisión depende de un suceso incierto (estado de la naturaleza), representado por los nudos aleatorios.", "quotes": [{"t": "El árbol de decisión es una de las herramientas más útiles y utilizadas para la toma de decisiones adecuadas teniendo varias alternativas posibles de acción.", "doc": "U1-4", "page": 5}, {"t": "Estados de la naturaleza: son variables no controladas, representan los sucesos en los que no se puede influir y que condicionan la decisión que se tome.", "doc": "U1-4", "page": 11}, {"t": "Al tomar una decisión, el resultado de ésta vendrá determinado por un suceso incierto (estados de la naturaleza).", "doc": "U1-4", "page": 5}, {"t": "Una vez producido ese estado de naturaleza, es posible elegir de nuevo entre distintas alternativas que dependen a su vez de nuevos estados de naturaleza.", "doc": "U1-4", "page": 5}, {"t": "Nudos aleatorios o de probabilidad: Ocurrencia de los posibles estados de la naturaleza", "doc": "U1-4", "page": 6}]}, "ARB|ALT": {"a": "ARB", "b": "ALT", "link": "El árbol sirve para elegir entre varias alternativas: de cada nodo de decisión salen ramas que representan las distintas alternativas.", "quotes": [{"t": "El árbol de decisión es una de las herramientas más útiles y utilizadas para la toma de decisiones adecuadas teniendo varias alternativas posibles de acción.", "doc": "U1-4", "page": 5}, {"t": "Está formado por múltiples nodos cuadrados, que representan los puntos de decisión, y de los cuales surgen ramas que representan las distintas alternativas.", "doc": "U1-4", "page": 5}, {"t": "Dentro de la teoría de la decisión, una alternativa es una de al menos dos cosas o acciones que pueden ser elegidas o tomadas en alguna circunstancia.", "doc": "U1-3", "page": 10}, {"t": "Partimos del primer nudo siempre, que es la decisión inicial que debe de tomar el decisor, y a partir de ahí van saliendo las diferentes alternativas planteadas.", "doc": "U1-4", "page": 6}]}, "ARB|CON": {"a": "ARB", "b": "CON", "link": "El árbol de decisión plantea el problema para analizar las consecuencias de adoptar una u otra decisión, cuantificando costos y probabilidades.", "quotes": [{"t": "El árbol de decisión es una de las herramientas más útiles y utilizadas para la toma de decisiones adecuadas teniendo varias alternativas posibles de acción.", "doc": "U1-4", "page": 5}, {"t": "En principio una consecuencia es un hecho o acontecimiento que se deriva o resulta de otro.", "doc": "U1-3", "page": 12}, {"t": "El árbol de decisión es un gráfico que nos sirven como herramienta para la toma de decisiones en la empresa. Platean el problema para que todas las opciones sean analizadas, y hace posible analizar las consecuencias de adoptar una u otra decisión. También nos permite cuantificar su coste y las probabilidades de ocurrencia de cada decisión.", "doc": "U1-4", "page": 5}, {"t": "Analiza las consecuencias de llevar a cabo una alternativa.", "doc": "U1-4", "page": 8}]}, "RIE|MAT": {"a": "RIE", "b": "MAT", "link": "En situación de riesgo se conocen las probabilidades de los estados de la naturaleza, y la matriz permite calcular el valor monetario esperado de cada alternativa.", "quotes": [{"t": "La información con la que se cuenta para solucionar el problema es incompleta, es decir, se conoce el problema, se conocen las posibles soluciones, pero no se conoce con certeza los resultados que pueden arrojar.", "doc": "U1-3", "page": 27}, {"t": "Una matriz de resultados de decisión es un gráfico que permite a un equipo o un individuo identificar y analizar la tasa de la fuerza de las relaciones entre conjuntos de información.", "doc": "U1-4", "page": 11}, {"t": "Probabilidades: son las posibilidades de que se produzca cada estado de la naturaleza.", "doc": "U1-4", "page": 11}, {"t": "Cuando se toma una decisión en condiciones de riesgo significa que se conoce la probabilidad que existe de que suceda cada uno de los estados de la naturaleza. Por ello, para decidir la alternativa más beneficiosa se calcula el valor monetario esperado de cada una para, finalmente, elegir el máximo valor.", "doc": "U1-4", "page": 12}]}, "CRI|CO": {"a": "CRI", "b": "CO", "link": "Los criterios minimax y de Savage eligen en función del costo de oportunidad, es decir, de lo que se deja de ganar por no escoger la mejor estrategia.", "quotes": [{"t": "Para decidir existen una serie de criterios de elección:", "doc": "U1-3", "page": 26}, {"t": "El criterio minimax plantea elegir en función de lo que se dejará de ganar. Por lo tanto, en primer lugar debe calcularse el máximo coste de oportunidad de cualquier opción y, en segundo lugar, elegir el menor de ellos.", "doc": "U1-3", "page": 26}, {"t": "Lo que sí afirmamos sin temor a equivocarnos es que el costo de oportunidad más alto es siempre el de no tomar decisión alguna.", "doc": "U1-1", "page": 12}, {"t": "Criterio de Savage: Lo utilizarían las personas que tienen miedo a equivocarse, por ello se crea una nueva matriz de desenlaces en términos de costo de oportunidad. Sustituyendo los valores anteriores o resultados por los perjuicios resultantes de no haber elegido la mejor estrategia, es decir, el costo de oportunidad. De este modo este criterio muestra lo que se deja de ganar por escoger una estrategia equivocada.", "doc": "U1-4", "page": 12}]}, "TD|CAOS": {"a": "TD", "b": "CAOS", "link": "Aplicada a la decisión, la Teoría del Caos muestra que un pequeño cambio en una decisión inicial puede generar consecuencias muy distintas tras varios ciclos de decisiones.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Hablar de caos no es sinónimo de desorden o comportamientos aleatorios. Son sistemas complejos, sin estructuras, no lineales, que tienen, entre otras propiedades, un comportamiento ordenado, objetivo y razonable, que se escuda detrás de una imagen llena de oposiciones, contradicciones y un aparente desorden.", "doc": "U1-1", "page": 11}, {"t": "Si aplicamos este concepto o teoría avanzada a organizaciones, empresas, organismos estatales o simplemente a las personas, un mínimo y pequeño cambio en una sencilla y simple decisión original o inicial puede generar resultados y consecuencias totalmente diferentes o disímiles al cabo de varios ciclos de decisiones en el tiempo.", "doc": "U1-1", "page": 11}, {"t": "En el desorden puede haber también un orden controlado. Depende de las variables que usemos o tomemos en consideración al momento de decidir.", "doc": "U1-1", "page": 11}]}, "CAOS|CO": {"a": "CAOS", "b": "CO", "link": "El texto asocia el costo de decisión con el comportamiento caótico: pequeños costos iniciales pueden derivar en grandes costos finales tras varios ciclos de decisiones.", "quotes": [{"t": "Hablar de caos no es sinónimo de desorden o comportamientos aleatorios. Son sistemas complejos, sin estructuras, no lineales, que tienen, entre otras propiedades, un comportamiento ordenado, objetivo y razonable, que se escuda detrás de una imagen llena de oposiciones, contradicciones y un aparente desorden.", "doc": "U1-1", "page": 11}, {"t": "Lo que sí afirmamos sin temor a equivocarnos es que el costo de oportunidad más alto es siempre el de no tomar decisión alguna.", "doc": "U1-1", "page": 12}, {"t": "Esto es básicamente de lo que trata la teoría del efecto mariposa. Si asociamos o trabajamos paralelamente el efecto del concepto de costo de decisión con el de situación o comportamiento caótico, arribamos a un análisis o conclusión interesante y complicada.", "doc": "U1-1", "page": 12}, {"t": "El costo (llámese situación a resolver, alternativa negativa, etc.) de una decisión se convierte automáticamente en el inicio y lanzamiento de apertura de las siguientes y correlativas –y así sucesivamente– decisiones posteriores.", "doc": "U1-1", "page": 12}]}, "TD|INFO": {"a": "TD", "b": "INFO", "link": "Decidir implica analizar con anticipación e información; cuanta más información de calidad se tenga, más racional y acertada será la decisión.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Decidir implica hacer un análisis con anticipación e información, para realizar un diagnóstico cierto a priori, detallando y analizando costos futuros, ocultos y no previstos, con el fin de reducirlos a la máxima expresión y minimizarlos, o por lo menos saber qué puede suceder. Federico de Prusia decía: “No podré evitar ser derrotado, pero sí ser sorprendido”. Esto dependerá de la información con la que cuentes para decidir.", "doc": "U1-1", "page": 13}, {"t": "Por otro lado, mientras se disponga de más información de calidad necesaria, que aporte elementos de juicio sobre el problema a resolver, se incrementa la probabilidad de que la decisión sea más racional y saludable para el logro del objetivo deseado.", "doc": "U1-2", "page": 7}]}, "INFO|R47": {"a": "INFO", "b": "R47", "link": "La regla 40/70 de Powell responde cuánta información se necesita: decidir con entre 40% y 70% de la información, balanceando información contra tiempo.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "La forma o regla que Colin Powell propone, y que llamó la regla P40/70, puede ayudarnos a buscar una respuesta satisfactoria a esta pregunta para pasar a la acción y tomar la decisión correcta para ese momento.", "doc": "U1-2", "page": 4}, {"t": "Powell propone que cuando la información se encuentra en el rango de 40% a 70% es cuando debemos tomar la decisión.", "doc": "U1-2", "page": 5}, {"t": "Está claro que en todo caso se debe valorar costo y oportunidad. Información vs. tiempo.", "doc": "U1-2", "page": 5}]}, "INFO|RAC": {"a": "INFO", "b": "RAC", "link": "La racionalidad de la decisión está limitada por la información disponible; con más información de calidad aumenta la probabilidad de una decisión racional.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "La mayoría de los que tienen esta responsabilidad intentan tomar sus decisiones en los marcos de la racionalidad aunque no siempre esto es posible, debido a que se enfrentan a un mundo real, muy complejo, donde las limitaciones de información, tiempo y la incertidumbre reinante limitan considerablemente la racionalidad.", "doc": "U1-2", "page": 6}, {"t": "En el proceso de toma de decisiones no siempre se dispone en el momento preciso de toda la información requerida y mientras más compleja sea la decisión, más difícil resultará conocer todas las alternativas.", "doc": "U1-2", "page": 5}, {"t": "Por otro lado, mientras se disponga de más información de calidad necesaria, que aporte elementos de juicio sobre el problema a resolver, se incrementa la probabilidad de que la decisión sea más racional y saludable para el logro del objetivo deseado.", "doc": "U1-2", "page": 7}]}, "RAC|ELS": {"a": "RAC", "b": "ELS", "link": "La racionalidad elsteriana profundiza la idea de racionalidad: no basta la consistencia de las razones, también deseos y creencias deben ser racionales.", "quotes": [{"t": "La mayoría de los que tienen esta responsabilidad intentan tomar sus decisiones en los marcos de la racionalidad aunque no siempre esto es posible, debido a que se enfrentan a un mundo real, muy complejo, donde las limitaciones de información, tiempo y la incertidumbre reinante limitan considerablemente la racionalidad.", "doc": "U1-2", "page": 6}, {"t": "Jon Elster es filósofo, teórico social y político noruego, considera que la acción racional debe implicar tres operaciones de optimización: hallar la mejor acción para las creencias y los deseos dados, fundamentar la creencia de la mejor manera, y acumular la cantidad necesaria de pruebas que respalden los deseos dados y las creencias previas.", "doc": "U1-2", "page": 8}, {"t": "La racionalidad elsteriana, es aquella que permite estudiar detenida y exhaustivamente la naturaleza sustancial de los deseos y las creencias involucradas en la generación de la escala de preferencias desde la que se toman las decisiones humanas.", "doc": "U1-2", "page": 9}, {"t": "Para Elster, el actuar racionalmente tiene que ver no únicamente con la consistencia de las razones de la acción, sino con que dichas razones sean, a su vez, racionales.", "doc": "U1-2", "page": 9}]}, "INFO|ERA": {"a": "INFO", "b": "ERA", "link": "La Era del conocimiento lleva a que todas las organizaciones manejen información y mejoren continuamente la que llega a la dirección para decidir.", "quotes": [{"t": "La tenencia de datos no es el elemento esencial en una toma de decisión acertada. Al convertir dichos datos en información evaluada y está en conocimiento para la acción, se proporciona el apoyo necesario para la toma de una decisión argumentada, que oriente a la empresa hacia el cumplimiento de sus metas y objetivos.", "doc": "U1-2", "page": 7}, {"t": "Los cambios que se suceden desde el siglo pasado en las esferas económica, social, cultural y de mercado llevan a que todas las organizaciones manejen información, una notable transformación en la que la base es el conocimiento, se vive una nueva era, la \"Era del conocimiento\".", "doc": "U1-2", "page": 6}, {"t": "Estos continuos cambios en el entorno y en el interior de las organizaciones promueven, cada vez más, la necesidad de mejorar el proceso de toma de decisiones y ello repercute en un mejoramiento continuo de la información que llega a la más alta dirección.", "doc": "U1-2", "page": 6}]}, "IE|TD": {"a": "IE", "b": "TD", "link": "Las emociones distorsionan la percepción de la información al decidir; la inteligencia emocional permite evaluar más objetivamente y decidir con menor riesgo.", "quotes": [{"t": "Desarrollar esta competencia permitirá al líder reconocer, comprender y gestionar sus emociones y las del equipo a cargo. Es crucial al momento de tomar decisiones, ya que, permite evaluar de manera más objetiva y tomar la decisión con menor riesgo posible.", "doc": "U1-3", "page": 16}, {"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Las emociones influyen en muchas formas en la toma de decisiones.", "doc": "U1-3", "page": 16}, {"t": "Para evitar que esto suceda es primordial que en las posiciones que se requiera tomar decisiones se trabaje con la visión de desarrollar la “inteligencia emocional”.", "doc": "U1-3", "page": 16}]}, "TD|GRU": {"a": "TD", "b": "GRU", "link": "La toma de decisiones grupal aprovecha el conocimiento y la experiencia de más personas y aumenta el compromiso con los resultados.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "hay ocasiones en que se debe aprovechar el conocimiento y la experiencia de un número mayor de personas, para tomar mejores decisiones.", "doc": "U1-3", "page": 29}, {"t": "Entre las ventajas que se tienen en la toma de decisiones grupales se destacan las siguientes:", "doc": "U1-3", "page": 30}, {"t": "Además cuando la gente participa en la toma de la decisión, se siente más comprometida a lograr los resultados deseados, convirtiéndose en un poderoso motivador para los trabajadores el que se les tome en cuenta en el momento de decidir.", "doc": "U1-3", "page": 30}]}, "TD|PRG": {"a": "TD", "b": "PRG", "link": "Las decisiones programadas son un tipo de decisión repetitiva con método de solución ya establecido, que no requiere diseñar una solución nueva.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "También existen dos tipos de decisiones tales como:", "doc": "U1-3", "page": 31}, {"t": "Son aquellas que se toman frecuentemente, es decir son repetitivas y se convierte en una rutina tomarlas; como el tipo de problemas que resuelve y se presentan con cierta regularidad ya que se tiene un método bien establecido de solución y por lo tanto ya se conocen los pasos para abordar este tipo de problemas, por esta razón, también se las llama decisiones estructuradas.", "doc": "U1-3", "page": 31}, {"t": "la persona que toma este tipo de decisión no tiene la necesidad de diseñar ninguna solución, sino que simplemente se rige por la que se ha seguido anteriormente.", "doc": "U1-3", "page": 31}]}, "TD|NPR": {"a": "TD", "b": "NPR", "link": "Las decisiones no programadas son el tipo de decisión ante problemas poco frecuentes, que exigen seguir un modelo de decisión para una solución específica.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "También existen dos tipos de decisiones tales como:", "doc": "U1-3", "page": 31}, {"t": "También denominadas no estructuradas, son decisiones que se toman ante problemas o situaciones que se presentan con poca frecuencia, o aquellas que necesitan de un modelo o proceso específico de solución, por ejemplo: “lanzamiento de un nuevo producto al mercado”, en este tipo de decisiones es necesario seguir un modelo de toma de decisión para generar una solución específica para este problema en concreto.", "doc": "U1-3", "page": 31}]}, "EST|TD": {"a": "EST", "b": "TD", "link": "La estructura define quién es responsable de cada tarea, y esa responsabilidad implica tomar y comunicar decisiones; si la estructura no acompaña el crecimiento, quienes deciden deben analizarlo.", "quotes": [{"t": "una estructura organizacional debe diseñarse para determinar quién realizará cada tarea y quién será el responsable por los resultados y los objetivos por los cuales se den origen a esa tarea.", "doc": "U1-4", "page": 4}, {"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Esta responsabilidad implica establecer las estrategias para eliminar o sobrepasar los obstáculos que se presenten, tomar decisiones, comunicar las decisiones y guiar a quienes realicen cada tarea hacía los objetivos que se establezcan para el crecimiento o existencia del negocio.", "doc": "U1-4", "page": 4}, {"t": "Por otro lado, es necesario contemplara que en muchas ocasiones las organizaciones crecen sin que la estructura acompañe el crecimiento. Cuando esto sucede es necesario que quienes lideran la toma de decisiones analicen como acompañar el negocio de una forma eficiente.", "doc": "U1-4", "page": 4}]}, "EST|EMP": {"a": "EST", "b": "EMP", "link": "Dentro de la estructura, el empowerment implica delegar eficientemente y compartir la responsabilidad con equipos más autónomos.", "quotes": [{"t": "una estructura organizacional debe diseñarse para determinar quién realizará cada tarea y quién será el responsable por los resultados y los objetivos por los cuales se den origen a esa tarea.", "doc": "U1-4", "page": 4}, {"t": "La estructura de la organización debe responder a la división de tares y la coordinación de dichas tareas para que el funcionamiento sea eficiente y orgánico, muchas veces complejizar los escenarios no es una buena decisión.", "doc": "U1-4", "page": 4}, {"t": "Trabajar con un enfoque en el empowerment supone y aporta a que los líderes tengan la capacidad de delegar de manera eficiente, a fin, de trabajar con un equipo enfocado en las responsabilidades que implica la posición que ocupan.", "doc": "U1-4", "page": 4}, {"t": "Sumado a ello implica que los líderes al delegar comparten su responsabilidad con su equipo, conformando así equipos con mayor autonomía haciéndolos consciente del impacto de sus acciones.", "doc": "U1-4", "page": 4}]}, "TD|AGD": {"a": "TD", "b": "AGD", "link": "El agente decisorio es el primero de los seis elementos básicos de la decisión: la persona que selecciona la opción entre las alternativas.", "quotes": [{"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Las decisiones normalmente contienen seis elementos básicos que debemos tener en cuenta. Esta es la estructura formal a la hora de decidir:", "doc": "U1-2", "page": 11}, {"t": "Agente decisorio: es aquella persona que selecciona la opción entre varias alternativas o ideas de acción.", "doc": "U1-2", "page": 11}, {"t": "Estrategias: es el curso de acción que el agente decisorio escoge para alcanzar mejor sus metas y/o objetivos. Toda estrategia depende de los recursos de que se disponga.", "doc": "U1-2", "page": 11}]}, "AGD|OBJ": {"a": "AGD", "b": "OBJ", "link": "Los objetivos son las metas que el agente decisorio pretende alcanzar con sus acciones y para las que escoge una estrategia.", "quotes": [{"t": "Agente decisorio: es aquella persona que selecciona la opción entre varias alternativas o ideas de acción.", "doc": "U1-2", "page": 11}, {"t": "Objetivos: son las metas que el agente decisorio pretende alcanzar con sus acciones.", "doc": "U1-2", "page": 11}, {"t": "Estrategias: es el curso de acción que el agente decisorio escoge para alcanzar mejor sus metas y/o objetivos. Toda estrategia depende de los recursos de que se disponga.", "doc": "U1-2", "page": 11}]}, "AGD|ELS": {"a": "AGD", "b": "ELS", "link": "Para Elster, el agente decide racionalmente cuando su elección es la mejor según sus deseos y creencias; sin información puede tener creencias sesgadas sobre los objetivos de la organización.", "quotes": [{"t": "Agente decisorio: es aquella persona que selecciona la opción entre varias alternativas o ideas de acción.", "doc": "U1-2", "page": 11}, {"t": "La racionalidad elsteriana, es aquella que permite estudiar detenida y exhaustivamente la naturaleza sustancial de los deseos y las creencias involucradas en la generación de la escala de preferencias desde la que se toman las decisiones humanas.", "doc": "U1-2", "page": 9}, {"t": "El modelo se funda en la idea de que para que un agente pueda tomar decisiones racionales, este debe demostrar que la elección, tomada entre las preferencias generadas a partir de las creencias, evidencia que su decisión es la mejor alternativa de actuación para alcanzar los fines deseados, logrando así que la acción sea óptima a la luz de la totalidad de sus razones (deseos, creencias y preferencias).", "doc": "U1-2", "page": 8}, {"t": "La falta de información, o de acceso a la misma, por parte del agente decisor, puede llevarlo a tener creencias sesgadas o erróneas de los objetivos de la organización, generando con ello un conflicto con sus fines particulares. Si el gerente no comprende la razón de ser de la empresa, difícilmente podrá estructurar escalas de preferencias de calidad, lo que puede llevarlo a decidir por alternativas de acción que se apeguen a sus deseos particulares sin apropiar racionalmente los de la organización.", "doc": "U1-2", "page": 8}]}, "CO|TD": {"a": "CO", "b": "TD", "link": "Toda decisión tiene costos inciertos, pero el texto afirma que el costo de oportunidad más alto es siempre no tomar ninguna decisión.", "quotes": [{"t": "Lo que sí afirmamos sin temor a equivocarnos es que el costo de oportunidad más alto es siempre el de no tomar decisión alguna.", "doc": "U1-1", "page": 12}, {"t": "Se conoce como toma de decisiones al proceso que consiste en realizar una elección entre diversas alternativas.", "doc": "U1-1", "page": 4}, {"t": "Es importante considerar que todas las decisiones tienen componentes altamente inciertos de costo vs. beneficio. La duda persiste en el tiempo acerca de si la decisión quetomamos fue la mejor o aquella con mayor grado de acierto. Lo que sí afirmamos sin temor a equivocarnos es que el costo de oportunidad más alto es siempre el de no tomar decisión alguna. El error es pensar que tomar decisiones genera rápidos beneficios y dispara en el tiempo costo cero.", "doc": "U1-1", "page": 12}, {"t": "La mejor decisión que podemos tomar es la correcta, la segunda mejor es la incorrecta, y la peor de todas es ninguna.", "doc": "U1-1", "page": 8}]}, "FUN|CU": {"a": "FUN", "b": "CU", "link": "Los fundadores son el primer factor interno de la cultura: ponen sus cimientos con sus propios paradigmas, principios y objetivos, y la cultura nace con la organización delimitada por sus creencias y valores.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Fundadores, la primera persona/as de las que surgió la idea de crear la empresa, es decir, ponen los cimientos de la cultura de cómo debe ser su", "doc": "U2-1", "page": 9}, {"t": "organización y con sus propios y personales paradigmas culturales proporcionando los principios básicos y objetivos de la organización, su mentalidad y experiencia, etc.", "doc": "U2-1", "page": 10}, {"t": "La cultura organizacional, nace cuando nace cada organización delimitada por el conjunto de creencias, valores, expectativas de quienes la conforman, que básicamente son quienes van a guiar la organización en un principio. Al incorporar nuevas personas que compartan estas características, se van incorporando también nuevas expectativas, creencias, experiencias que nutrirán esta cultura.", "doc": "U2-1", "page": 4}]}, "CU|VAL": {"a": "CU", "b": "VAL", "link": "Los valores son un elemento básico de la cultura organizacional y constituyen los pilares de la cultura corporativa, siempre que sean sostenidos por la mayoría de los miembros.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Valores, son las convicciones de la organización que se sustenta en una base moral, constituye los pilares de la cultura corporativa, son los supuestos que están tras el conjunto de normas y reglas de conducta de la empresa.", "doc": "U2-1", "page": 10}, {"t": "Se pueden considerar como elementos básicos de la definición de cultura organizacional, los siguientes:", "doc": "U2-1", "page": 5}, {"t": "Conjunto de valores y creencias esenciales: Los valores son afirmaciones acerca de lo que está bien o mal de una organización. Creencia es la percepción de las personas entre una acción y sus consecuencias. Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}, {"t": "La cultura compartida: No es suficiente con que existan valores y creencias a título individual, deben ser valores y creencias sostenidas por una mayoría de los miembros de la organización.", "doc": "U2-1", "page": 5}]}, "CU|CRE": {"a": "CU", "b": "CRE", "link": "Las creencias, junto a los valores, integran el conjunto esencial que define la cultura organizacional y son un factor interno de la misma.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Creencias, constituyen un elemento ideológico que no puede ser contrastados con la realidad, careciendo de base empírica, aunque tengan valor de realidad para el cliente, por ejemplo: planteamientos básicos e indiscutibles que componen la gran mayoría de sus miembros.", "doc": "U2-1", "page": 10}, {"t": "Se pueden considerar como elementos básicos de la definición de cultura organizacional, los siguientes:", "doc": "U2-1", "page": 5}, {"t": "Conjunto de valores y creencias esenciales: Los valores son afirmaciones acerca de lo que está bien o mal de una organización. Creencia es la percepción de las personas entre una acción y sus consecuencias. Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}, {"t": "La cultura compartida: No es suficiente con que existan valores y creencias a título individual, deben ser valores y creencias sostenidas por una mayoría de los miembros de la organización.", "doc": "U2-1", "page": 5}]}, "VAL|NOR": {"a": "VAL", "b": "NOR", "link": "Las normas son la aplicación práctica de los valores: los valores se concretan por medio de normas que especifican el comportamiento esperado.", "quotes": [{"t": "Valores, son las convicciones de la organización que se sustenta en una base moral, constituye los pilares de la cultura corporativa, son los supuestos que están tras el conjunto de normas y reglas de conducta de la empresa.", "doc": "U2-1", "page": 10}, {"t": "Normas: se pueden considerar como la aplicación práctica de los valores y definen lo que debe ser.", "doc": "U2-1", "page": 10}, {"t": "Conjunto de valores y creencias esenciales: Los valores son afirmaciones acerca de lo que está bien o mal de una organización. Creencia es la percepción de las personas entre una acción y sus consecuencias. Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}]}, "CRE|NOR": {"a": "CRE", "b": "NOR", "link": "Las creencias, al igual que los valores, se concretan por medio de normas cuyo papel es especificar el comportamiento esperado.", "quotes": [{"t": "Creencias, constituyen un elemento ideológico que no puede ser contrastados con la realidad, careciendo de base empírica, aunque tengan valor de realidad para el cliente, por ejemplo: planteamientos básicos e indiscutibles que componen la gran mayoría de sus miembros.", "doc": "U2-1", "page": 10}, {"t": "Normas: se pueden considerar como la aplicación práctica de los valores y definen lo que debe ser.", "doc": "U2-1", "page": 10}, {"t": "Conjunto de valores y creencias esenciales: Los valores son afirmaciones acerca de lo que está bien o mal de una organización. Creencia es la percepción de las personas entre una acción y sus consecuencias. Valores y creencias se concretan por medio de normas, cuyo papel es especificar el comportamiento esperado.", "doc": "U2-1", "page": 5}]}, "CU|CFOR": {"a": "CU", "b": "CFOR", "link": "La cultura formal es uno de los dos subsistemas que componen la cultura organizacional: la expresión idealizada de lo que debería ser.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros.", "doc": "U2-1", "page": 9}, {"t": "En general es posible identificar, al menos, dos subsistemas culturales en la organización: 1. La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros. 2. La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "Estás dos culturas a veces chocan entre sí con la cultura general de la organización, por lo que agregamos varios aspectos que son necesarios tener en cuenta:", "doc": "U2-1", "page": 9}]}, "CU|CINF": {"a": "CU", "b": "CINF", "link": "La cultura informal es el otro subsistema de la cultura organizacional: contiene los comportamientos tal como son en realidad.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "En general es posible identificar, al menos, dos subsistemas culturales en la organización: 1. La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros. 2. La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "Estás dos culturas a veces chocan entre sí con la cultura general de la organización, por lo que agregamos varios aspectos que son necesarios tener en cuenta:", "doc": "U2-1", "page": 9}]}, "CFOR|CINF": {"a": "CFOR", "b": "CINF", "link": "Cultura formal (lo que debería ser) y cultura informal (lo que es en realidad) son los dos subsistemas culturales, que a veces chocan entre sí y con la cultura general.", "quotes": [{"t": "La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros.", "doc": "U2-1", "page": 9}, {"t": "La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "En general es posible identificar, al menos, dos subsistemas culturales en la organización: 1. La Cultura Formal: Consiste en expresiones idealizadas de lo que debería ser, los valores, creencias y comportamientos de los miembros. 2. La Cultura Informal: Contiene dichos comportamientos tal y como son en realidad.", "doc": "U2-1", "page": 9}, {"t": "Estás dos culturas a veces chocan entre sí con la cultura general de la organización, por lo que agregamos varios aspectos que son necesarios tener en cuenta:", "doc": "U2-1", "page": 9}]}, "CU|TIP": {"a": "CU", "b": "TIP", "link": "El texto clasifica la cultura organizacional en tipologías (poder, roles, tareas y personas) según desde dónde se dirige y en qué se apoya.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Conocer las tipologías culturales.", "doc": "U2-1", "page": 3}, {"t": "¿CUÁLES SON LAS TIPOLOGÍAS CULTURALES? Podemos encontrar las siguientes tipologías: • Cultura del poder: se dirige y controla por personas clave desde un centro de poder ejecutivo. • Cultura de los roles: se sustenta en una clara y detallada descripción de las responsabilidades de cada puesto de acción. • Cultura de tareas: se apoya en proyectos que realiza la organización; orientada a la obtención de resultados específicos en tiempos concretos. • Cultura de personas: basada en los integrantes de la organización.", "doc": "U2-1", "page": 12}]}, "CU|FD": {"a": "CU", "b": "FD", "link": "La principal categoría de sistemas culturales es la de fuertes y débiles, según la intensidad con que los contenidos de la cultura son compartidos e impulsan la conducta cotidiana.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Es posible distinguir otras categorías de sistemas culturales de acuerdo con la forma en que se manifiestan en las estructuras de análisis, la principal categoría es la de fuertes y débiles, junto a las siguientes:", "doc": "U2-1", "page": 15}, {"t": "Fuertes o débiles, según la intensidad con que sus Contenidos son compartidos, conocidos e impulsan la conducta cotidiana de los participantes. Cuanto más fuerte sean los rasgos culturales, no sólo determinarán los modos de conducta de sus participantes internos, sino que también impondrán rituales y procedimientos a los integrantes de otras organizaciones contextualmente relacionadas.", "doc": "U2-1", "page": 15}]}, "CU|LID": {"a": "CU", "b": "LID", "link": "El estilo de liderazgo es una característica que diferencia a las culturas y a la vez está delimitado por la cultura de la organización.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos. El líder se interrelaciona con la comunidad organizacional y con los colaboradores a cargo en función a los valores establecidos, conductas y expectativas que se espera de la persona que ocupa cada posición y viceversa.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}, {"t": "En principio, la mayoría consta con elementos que básicos y luego dependiendo cada estructura, cada estilo de liderazgo y cada mercado, pueden ir incorporando otros aspectos que sean determinantes en la cultura de esa organización.", "doc": "U2-1", "page": 4}]}, "CU|TRC": {"a": "CU", "b": "TRC", "link": "La tolerancia del riesgo es una de las características clave que diferencian unas culturas organizacionales de otras.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Tolerancia del riesgo: El grado en el que los empleados son animados a ser proactivos, innovadores y a asumir riesgos.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}]}, "CU|INCV": {"a": "CU", "b": "INCV", "link": "El sistema de incentivos diferencia a las culturas y, como sistema de premios y criterios de promoción, es un mecanismo para crear y sostener la cultura.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Sistema de incentivos: El grado en el que los incentivos (aumentos de salario, promociones, etc.) se basan en criterios de rendimiento del empleado frente a criterios tales como la antigüedad, el favoritismo, etc.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}, {"t": "Sistema explícito de premios y reconocimiento, criterios de promoción.", "doc": "U2-1", "page": 16}]}, "CU|COM": {"a": "CU", "b": "COM", "link": "El modelo de comunicación, es decir cuánto se restringe la comunicación a la jerarquía formal, es una característica que diferencia a las culturas.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Modelo de comunicación: El grado en el que las comunicaciones organizativas están restringidas a la jerarquía formal de autoridad.", "doc": "U2-1", "page": 7}, {"t": "Existen algunas características clave que diferencian unas culturas de otras, entre la cuales podemos destacar las siguientes:", "doc": "U2-1", "page": 7}]}, "CU|INN": {"a": "CU", "b": "INN", "link": "La cultura de innovación surge de articular la innovación con la cultura empresarial, y la dirección puede promoverla cambiando la forma de dirigir.", "quotes": [{"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Innovar representa transformar nuevas ideas en resultados.", "doc": "U2-2", "page": 4}, {"t": "En la unidad anterior hicimos una introducción al concepto de cultura organizacional y sus diferentes tipos, ahora avanzamos hacia el concepto de innovación y cómo se articula con la cultura empresarial. De esta conjunción surge otra forma de cultura denominada cultura de innovación, de vital importancia para el desarrollo empresarial.", "doc": "U2-2", "page": 3}, {"t": "Los valores y creencias que forman la cultura de la empresa son en gran parte resultado de una acumulación en el tiempo de experiencias fruto de una determinada forma de funcionar de la dirección. Ello sugiere que existe una vía mucho más fácil de lograr el cambio. La dirección puede promover una cultura favorable a la innovación cambiando la forma de dirigir y desarrollar a sus colaboradores.", "doc": "U2-2", "page": 6}]}, "LID|INN": {"a": "LID", "b": "INN", "link": "La forma de ejercer el liderazgo es el factor propulsor clave de la capacidad de innovar: la creatividad surge sólo con un cambio de estilo de dirección.", "quotes": [{"t": "Estilos de liderazgo: es necesario comprender que el estilo de liderazgo esta delimitado por la cultura de la organización, sumado a las metas y objetivos establecidos.", "doc": "U2-1", "page": 7}, {"t": "Innovar representa transformar nuevas ideas en resultados.", "doc": "U2-2", "page": 4}, {"t": "El comportamiento de los ejecutivos en la forma de ejercer el liderazgo es un factor propulsor clave de la capacidad de innovar.", "doc": "U2-2", "page": 7}, {"t": "La creatividad surgirá solo en la medida en que haya un cambio de estilo de dirección; los ejecutivos deben reconocer que en los espacios de innovación de la agenda no deben imperar las mismas reglas de juego que gobiernan la gestión cotidiana, como el control burocrático, la comunicación siguiendo la línea de mando establecida, el valor de las ideas que se corresponde necesariamente con el nivel jerárquico y otras tantas reglas que han contribuido en el pasado a la regularidad y el crecimiento sin sorpresas de las operaciones.", "doc": "U2-2", "page": 5}, {"t": "La cultura de empresas altamente innovadoras sugiere que el principal motor del cambio de mentalidades va asociado a la forma de dirigir y una pieza clave es la actuación de los principales responsables de la empresa.", "doc": "U2-2", "page": 11}]}, "INN|MC": {"a": "INN", "b": "MC", "link": "Mejora continua e innovación aportan ambas una contribución, pero la innovación exige hacer algo distinto del pasado mientras la mejora no altera el día a día.", "quotes": [{"t": "Innovar representa transformar nuevas ideas en resultados.", "doc": "U2-2", "page": 4}, {"t": "Cuando la aplicación de una nueva idea se puede llevar a cabo sin alterar el día a día, esta corresponde más al ámbito de la mejora continua que de la innovación. Tanto la mejora continua como la innovación aportan una contribución, un impacto en el mercado o una mejora interna, pero lo que distingue a la innovación de la mejora es que la transformación de la idea innovadora requiere hacer algo distinto de lo que la empresa venía haciendo en el pasado.", "doc": "U2-2", "page": 4}, {"t": "Innovar hoy facilita innovar mañana.", "doc": "U2-2", "page": 4}]}, "AGI|INN": {"a": "AGI", "b": "INN", "link": "Las metodologías ágiles son presentadas como herramienta para innovar: una forma innovadora de trabajar que fragmenta los proyectos y se adapta sobre la marcha.", "quotes": [{"t": "Un ejemplo de ello son las metodologías agiles que componen una estrategia integral que impulsa a la organización a gestionar los proyectos con rapidez y flexibilidad.", "doc": "U2-2", "page": 8}, {"t": "Innovar representa transformar nuevas ideas en resultados.", "doc": "U2-2", "page": 4}, {"t": "METODOLOGÍAS ÁGILES: HERRAMIENTA PARA INNOVAR", "doc": "U2-2", "page": 8}, {"t": "Son una herramienta innovadora para trabajar y organizarse que se centran en “fragmentar”", "doc": "U2-2", "page": 8}, {"t": "los proyectos en partes, no se planifica ni se diseña el proyecto por adelantado, sino que a medida que se desarrolla se va definiendo el proyecto. Nacen para privilegiar la interacción en los procesos y facilitar la colaboración con el cliente ante la necesidad de cambios durante el armado del proyecto. Una herramienta fundamental de esta técnica es el feedback constante, que hará qué los proyectos sean capaces de adaptarse sobre la marcha y resolverse en poco tiempo las adversidades que se presente.", "doc": "U2-2", "page": 9}]}, "VIR|CU": {"a": "VIR", "b": "CU", "link": "La virtualidad genera equipos multiculturales y obliga a las culturas organizacionales a ser versátiles y flexibles, conectando a las personas con los valores desde la distancia.", "quotes": [{"t": "Se incremento el trabajo virtual y esta fue una modalidad que en muchos casos “vino para quedarse”.", "doc": "U2-1", "page": 13}, {"t": "Definimos a la cultura organizacional como el conjunto de normas, valores y formas de pensar que caracterizan el comportamiento del personal en todos los niveles de la empresa y a la vez es una presentación de cara al exterior de la imagen de la empresa.", "doc": "U2-1", "page": 4}, {"t": "Debido a este avance de la digitalización y la virtualidad se ha generado un gran avance en la formación de equipos multiculturales. Esto provoca que las culturas organización obligatoriamente tengan la capacidad de ser versátiles y flexibles para poder ser atractivas para otros perfiles que cumplen con las competencias necesarias para ocupar las diferentes roles.", "doc": "U2-1", "page": 13}, {"t": "Equipo de Recursos Humanos, las organizaciones deben contar con un equipo de gestión del talento que le permita gestionar a las personas desde la virtualidad, conectarlos con los valores y la cultura de la organización, afianzando los lazos entre los colaboradores, sus pares y sus líderes sin que la presencialidad o la distancia sean un inconveniente.", "doc": "U2-3", "page": 14}]}, "DEO|ETI": {"a": "DEO", "b": "ETI", "link": "La deontología profesional es una rama de la ética que establece los deberes de quienes ejercen una profesión; la ética profesional la toma como objeto de estudio.", "quotes": [{"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "La ética, es una de las tantas ramas de la filosofía que estudia las cosas por sus causas, de lo universal y necesario, que se dedica al estudio de los actos humanos, aquellos que se realizan tanto por la voluntad y libertad absoluta, de la persona.", "doc": "U2-2", "page": 13}, {"t": "Finalmente trataremos la deontología profesional, conocida también bajo el nombre de \"teoría del deber\", como una rama de la ética cuyo propósito es establecer los deberes, obligaciones y éticas que tienen que asumir quienes ejercen una determinada profesión.", "doc": "U2-4", "page": 3}, {"t": "Es importante no confundir deontología profesional con ética profesional. Cabe distinguir que la ética profesional es la disciplina que estudia los contenidos normativos de un colectivo profesional, es decir, su objeto de estudio es la deontología profesional, mientras que, tal como se apuntaba al comienzo del artículo, la deontología profesional es el conjunto de normas vinculantes para un colectivo profesional.", "doc": "U2-4", "page": 10}]}, "ETI|MOR": {"a": "ETI", "b": "MOR", "link": "Ética y moral comparten etimología pero hoy son niveles distintos: la moral es el nivel práctico de la acción y la ética el nivel teórico de la reflexión.", "quotes": [{"t": "La ética, es una de las tantas ramas de la filosofía que estudia las cosas por sus causas, de lo universal y necesario, que se dedica al estudio de los actos humanos, aquellos que se realizan tanto por la voluntad y libertad absoluta, de la persona.", "doc": "U2-2", "page": 13}, {"t": "La moral es el conjunto de reglas o normas por las que se rige la conducta de un ser humano en concordancia con la sociedad y consigo mismo.", "doc": "U2-2", "page": 13}, {"t": "Etimológicamente \"ética\" y \"moral\" tienen el mismo significado, sin embargo en la actualidad han pasado a significar conceptos distintos y hacen referencia a ámbitos o niveles diferentes: la moral tiene que ver con el nivel práctico o de la acción y la ética con el nivel teórico o de la reflexión.", "doc": "U2-2", "page": 14}, {"t": "Como conclusión, moral y ética se plantean cuestiones distintas. La moral tiene que ver con el nivel práctico de la acción y trata de responder a la pregunta ¿qué debo hacer?; la ética con el nivel teórico de la reflexión y trata de responder a preguntas del tipo ¿qué es la moral? ¿Cómo se fundamenta? ¿Cómo se aplica la reflexión a la vida cotidiana?", "doc": "U2-2", "page": 14}]}, "ETI|ENF": {"a": "ETI", "b": "ENF", "link": "El texto presenta distintos enfoques éticos (utilitario, individualista, de derechos morales, de justicia) para aplicar la ética dentro de las empresas.", "quotes": [{"t": "La ética, es una de las tantas ramas de la filosofía que estudia las cosas por sus causas, de lo universal y necesario, que se dedica al estudio de los actos humanos, aquellos que se realizan tanto por la voluntad y libertad absoluta, de la persona.", "doc": "U2-2", "page": 13}, {"t": "A continuación se exponen varios temas relacionados con la ética y la moral, y algunos enfoques éticos a tener en cuenta para su aplicación dentro de las empresas.", "doc": "U2-2", "page": 3}, {"t": "Conocer los diferentes enfoques éticos.", "doc": "U2-2", "page": 3}, {"t": "Enfoque utilitario La ética administrativa tiene su enfoque utilitario en la ética de los negocios y las disciplinas administrativas, teniendo como principal compromiso ético que se aplique a la misma organización, principalmente a la rentabilidad, que es lo que la empresa debe hacer para sí misma.", "doc": "U2-2", "page": 14}, {"t": "La coexistencia en las organizaciones de los tres tipos de ética es importante, ya que de esta forma se asegura una opción de reflexión para los gerentes que se esfuerzan de evitar los tipos inmorales y amorales.", "doc": "U2-2", "page": 16}]}, "ENF|UTI": {"a": "ENF", "b": "UTI", "link": "El enfoque utilitario es el primero de los enfoques éticos: compromete a la organización con su propia rentabilidad, en línea con el utilitarismo que juzga los actos por la felicidad que generan.", "quotes": [{"t": "A continuación se exponen varios temas relacionados con la ética y la moral, y algunos enfoques éticos a tener en cuenta para su aplicación dentro de las empresas.", "doc": "U2-2", "page": 3}, {"t": "Enfoque utilitario La ética administrativa tiene su enfoque utilitario en la ética de los negocios y las disciplinas administrativas, teniendo como principal compromiso ético que se aplique a la misma organización, principalmente a la rentabilidad, que es lo que la empresa debe hacer para sí misma.", "doc": "U2-2", "page": 14}, {"t": "Bentham considera que la base de la deontología es el utilitarismo, lo que significa que los actos de las personas se consideran buenos o malos en función de la felicidad global que puedan generar. Según este marco teórico, el fin de una acción debe ser conseguir la máxima felicidad para el mayor número de personas.", "doc": "U2-4", "page": 11}]}, "UTI|DEO": {"a": "UTI", "b": "DEO", "link": "Bentham, que acuñó el término deontología, considera que su base es el utilitarismo: los actos se juzgan por la felicidad global que generan.", "quotes": [{"t": "Bentham considera que la base de la deontología es el utilitarismo, lo que significa que los actos de las personas se consideran buenos o malos en función de la felicidad global que puedan generar. Según este marco teórico, el fin de una acción debe ser conseguir la máxima felicidad para el mayor número de personas. De este modo, toda acción que conduzca a ese fin, será aceptada como moralmente correcta.", "doc": "U2-4", "page": 11}, {"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "En \"Deontología o ciencia de la moral\" busca el racionalismo, con un mecanicismo casi matemático con el que valorar los comportamientos por su utilidad.", "doc": "U2-4", "page": 11}]}, "DEO|COD": {"a": "DEO", "b": "COD", "link": "El colectivo profesional recoge por escrito en los códigos deontológicos las normas que determinan los deberes mínimamente exigibles de la deontología profesional.", "quotes": [{"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "Por este motivo, suele ser el propio colectivo profesional quién determina dichas normas y, a su vez, se encarga de recogerlas por escrito en los códigos deontológicos.", "doc": "U2-4", "page": 9}, {"t": "Prácticamente todas las profesiones han desarrollado sus propios códigos y, en este sentido, puede hablarse de una deontología profesional periodística, de una deontología profesional médica, deontología profesional de los abogados, etc.", "doc": "U2-4", "page": 9}, {"t": "Esto sugiere una de las intenciones de la redacción de los códigos deontológicos: explicitar la dimensión estrictamente moral de una profesión, aquellos comportamientos exigibles a unos profesionales, aunque no estén delimitados jurídicamente, o quizá, por ello mismo.", "doc": "U2-4", "page": 11}]}, "DEO|CPRO": {"a": "DEO", "b": "CPRO", "link": "La conciencia profesional es un concepto clave de la deontología profesional: la interiorización personal del código de valores de la profesión.", "quotes": [{"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "La conciencia profesional es una dimensión esencial de la conciencia ética, a la que añade la responsabilidad que cada persona tiene. Se manifiesta en un comportamiento socialmente responsable acerca de los deberes específicos de una profesión después de haber interiorizado, asumido y personalizado un código de valores referentes a dicha profesión, para después analizar, aplicar y resolver problemas específicos de la profesión con la mejor competencia y rectitud posibles y socialmente exigibles.", "doc": "U2-4", "page": 15}, {"t": "Además de estas dos hay una clase de conciencia más, constituida como un concepto muy importante relacionado con la deontología profesional: la conciencia profesional.", "doc": "U2-4", "page": 15}, {"t": "Nivel de los deberes específicos, aprendidos, asumidos y personalizados por socialización ética. Cada persona tiene que haberse socializado en el código deontológico de su profesión.", "doc": "U2-4", "page": 15}]}, "DEO|ENO": {"a": "DEO", "b": "ENO", "link": "La deontología forma parte de la ética normativa, y dentro de ella las teorías deontológicas inspiradas en Kant tienen como concepto principal el deber previamente establecido.", "quotes": [{"t": "El término deontología profesional hace referencia al conjunto de principios y reglas éticas que regulan y guían una actividad profesional. Estas normas determinan los deberes mínimamente exigibles a los profesionales en el desempeño de su actividad.", "doc": "U2-4", "page": 9}, {"t": "La deontología forma parte de lo que se conoce como ética normativa (la filosofía que indica qué debería considerarse como bueno y qué es lo que debería calificarse como malo). Esto quiere decir que cada profesión, oficio o ámbito determinado puede tener su propia deontología que indica cuál es el deber de cada persona.", "doc": "U2-4", "page": 9}, {"t": "Ética normativa: Distinguimos las teorías Deontológicas y Teleológicas; incluyendo un tercer grupo: la Ética de la virtud. A grandes rasgos, exponemos las principales diferencias. Las Teorías Deontológicas que tienen como concepto principal el \"deber previamente establecido\", están inspiradas en Kant. Las Teorías Teleológicas se basan en las consecuencias, y su corriente principal es el utilitarismo. Y, la Ética de la virtud se basa en las actitudes de las personas, con la corriente de Aristóteles como base teórica.", "doc": "U2-4", "page": 13}]}, "ENO|UTI": {"a": "ENO", "b": "UTI", "link": "Dentro de la ética normativa, el utilitarismo es la corriente principal de las teorías teleológicas, que se basan en las consecuencias.", "quotes": [{"t": "La deontología forma parte de lo que se conoce como ética normativa (la filosofía que indica qué debería considerarse como bueno y qué es lo que debería calificarse como malo).", "doc": "U2-4", "page": 9}, {"t": "Bentham considera que la base de la deontología es el utilitarismo, lo que significa que los actos de las personas se consideran buenos o malos en función de la felicidad global que puedan generar. Según este marco teórico, el fin de una acción debe ser conseguir la máxima felicidad para el mayor número de personas.", "doc": "U2-4", "page": 11}, {"t": "Ética normativa: Distinguimos las teorías Deontológicas y Teleológicas; incluyendo un tercer grupo: la Ética de la virtud. A grandes rasgos, exponemos las principales diferencias. Las Teorías Deontológicas que tienen como concepto principal el \"deber previamente establecido\", están inspiradas en Kant. Las Teorías Teleológicas se basan en las consecuencias, y su corriente principal es el utilitarismo. Y, la Ética de la virtud se basa en las actitudes de las personas, con la corriente de Aristóteles como base teórica.", "doc": "U2-4", "page": 13}]}, "ENO|ENF": {"a": "ENO", "b": "ENF", "link": "El enfoque de justicia se plantea en la ética normativa, donde se trata lo que los gerentes deben hacer considerando las leyes.", "quotes": [{"t": "La deontología forma parte de lo que se conoce como ética normativa (la filosofía que indica qué debería considerarse como bueno y qué es lo que debería calificarse como malo).", "doc": "U2-4", "page": 9}, {"t": "A continuación se exponen varios temas relacionados con la ética y la moral, y algunos enfoques éticos a tener en cuenta para su aplicación dentro de las empresas.", "doc": "U2-2", "page": 3}, {"t": "En cuanto a la moral se puede justificar desde tres perspectivas: la Metaética (viendo qué son los juicios morales como juicios de valor), la Ética normativa y mediante la propuesta de unas reglas prácticas para la discusión, escapando del \"todo vale\".", "doc": "U2-4", "page": 12}, {"t": "Enfoque de justicia En la ética normativa, donde tocamos el punto de lo que los gerentes deben hacer, siempre habrá que considerar a las leyes en el actuar de un gerente buscando no afectar la relación entre los individuos o la afectación al establecimiento de una buena sociedad. En muchas ocasiones la justicia y la ética toman acciones diferentes en una decisión.", "doc": "U2-2", "page": 16}]}, "ENT|EG": {"a": "ENT", "b": "EG", "link": "El entorno general es uno de los dos tipos de entorno organizacional: el que afecta a todas las empresas (situación política, economía, marco jurídico).", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Entorno general: El cual afecta a todas las empresas, como lo puede ser la situación política, las variaciones en la economía, el marco jurídico-normativo, entre otros.", "doc": "U2-3", "page": 5}, {"t": "En este orden de ideas, es importante destacar que existen dos tipos de entornos que afecta de diversas formas a la empresa: Entorno general: El cual afecta a todas las empresas, como lo puede ser la situación política, las variaciones en la economía, el marco jurídico-normativo, entre otros. Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}]}, "ENT|EE": {"a": "ENT", "b": "EE", "link": "El entorno específico es el otro tipo de entorno organizacional, donde se ubican proveedores, competencia, consumidores, tecnología y mercados.", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}, {"t": "En este orden de ideas, es importante destacar que existen dos tipos de entornos que afecta de diversas formas a la empresa: Entorno general: El cual afecta a todas las empresas, como lo puede ser la situación política, las variaciones en la economía, el marco jurídico-normativo, entre otros. Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}]}, "EE|STK": {"a": "EE", "b": "STK", "link": "Los actores del entorno específico (proveedores, competencia, consumidores) son los componentes de acción directa, constituidos por los grupos de interés de la organización.", "quotes": [{"t": "Entorno específico: Que afecta de manera general, allí se ubican los proveedores, competencia, consumidores, tecnología, mercados.", "doc": "U2-3", "page": 5}, {"t": "el efecto que la empresa puede tener sobre la calidad de vida de una serie de grupos de interés (stakeholders)", "doc": "U2-3", "page": 6}, {"t": "involucrados con ella, los cuales no son únicamente los accionistas y dueños, sino sus empleados, los consumidores, los proveedores, sindicatos, etc., algunos de ellos internos a la organización y otros externos, pero igualmente interesados y afectados con el papel que la empresa puede desempeñar dentro del ambiente.", "doc": "U2-3", "page": 7}, {"t": "Es por ello que en la empresa se puede identificar un entorno directo, representado por los proveedores, los clientes, las competencias, entre otros. Y un entorno indirecto vinculado a la empresa por el impacto que sobre esta tiene la tecnología, las normas o leyes, los cambios políticos, económicos y sociales, la geografía, etcétera.", "doc": "U2-3", "page": 5}, {"t": "Se consideran elementos de acción directa todo aquellos del ambiente que afectan directamente a la organización, por ejemplo los consumidores, la competencia, los sindicatos, etcétera.", "doc": "U2-3", "page": 9}, {"t": "En el ambiente externo se pueden encontrar tanto componentes de acción directa como de acción indirecta, estando constituidos los primeros fundamentalmente por los distintos grupos de interés en la organización, de los cuales se puede considerar como los más importantes a los siguientes:", "doc": "U2-3", "page": 10}]}, "STK|RSE": {"a": "STK", "b": "RSE", "link": "Considerar el efecto de la empresa sobre los grupos de interés hace surgir el concepto de responsabilidad social, que orienta sus prácticas hacia los públicos interesados internos y externos.", "quotes": [{"t": "el efecto que la empresa puede tener sobre la calidad de vida de una serie de grupos de interés (stakeholders)", "doc": "U2-3", "page": 6}, {"t": "involucrados con ella, los cuales no son únicamente los accionistas y dueños, sino sus empleados, los consumidores, los proveedores, sindicatos, etc., algunos de ellos internos a la organización y otros externos, pero igualmente interesados y afectados con el papel que la empresa puede desempeñar dentro del ambiente.", "doc": "U2-3", "page": 7}, {"t": "Con esto surge el concepto de responsabilidad social de la empresa, de acuerdo con el cual las empresas tienen la obligación de buscar el bien de la sociedad general, aun cuando al hacerlo mermen en sus utilidades.", "doc": "U2-3", "page": 7}, {"t": "La empresa puede orientar sus prácticas responsables hacia el interior de la empresa o hacia fuera de la empresa. En cada caso ya sea interno o externo, existen diferentes públicos interesados hacia donde puede focalizar su acción. Algunos públicos interesados están dentro de la empresa, como lo son los colaboradores, accionistas, y la alta gerencia por ejemplo.", "doc": "U2-4", "page": 6}, {"t": "Fuera de la empresa encontramos a los proveedores, clientes, y la comunidad en general. Delimitar el impacto interno y externo que tiene la empresa es fundamental.", "doc": "U2-4", "page": 6}]}, "RSE|ETI": {"a": "RSE", "b": "ETI", "link": "La RSE se define como hacer negocios basados en principios éticos y apegados a la ley; adoptar valores éticos transmite confianza hacia afuera.", "quotes": [{"t": "La RSE es el “hacer negocios basados en principios éticos y apegados a la ley”. La empresa tiene un rol ante la sociedad, ante el entorno en el cual opera.", "doc": "U2-4", "page": 4}, {"t": "La ética, es una de las tantas ramas de la filosofía que estudia las cosas por sus causas, de lo universal y necesario, que se dedica al estudio de los actos humanos, aquellos que se realizan tanto por la voluntad y libertad absoluta, de la persona.", "doc": "U2-2", "page": 13}, {"t": "La decisión de hacer estos negocios rentables, de forma ética y basados en la legalidad es realmente estratégico, ya que con esto se generará:", "doc": "U2-4", "page": 4}, {"t": "Esto se debe a que en una empresa en la que se adoptan valores éticos, existe transparencia en las operaciones y se cumple con los requerimientos legales, transmite mayor confianza a lo externo con sus proveedores, clientes, y con la sociedad en su conjunto.", "doc": "U2-4", "page": 7}]}, "RSE|DS": {"a": "RSE", "b": "DS", "link": "La RSE es el rol de las empresas a favor del desarrollo sostenible: el equilibrio entre crecimiento económico, bienestar social y medio ambiente.", "quotes": [{"t": "La responsabilidad social empresarial es la contribución activa y voluntaria al mejoramiento social, económico y ambiental por parte de las empresas, generalmente con el objetivo de mejorar su situación competitiva, valorativa y su valor añadido.", "doc": "U2-4", "page": 3}, {"t": "La RSE es el rol que le toca jugar a las empresas a favor del desarrollo sostenible, es decir, a favor del equilibrio entre el crecimiento económico, el bienestar social y el aprovechamiento de los recursos naturales y el medio ambiente.", "doc": "U2-4", "page": 5}, {"t": "Este equilibrio es vital para la operación de los negocios. Las empresas deben pasar a formar parte activa de la solución de los retos que tenemos como sociedad, por su propio interés de tener un entorno más estable y próspero.", "doc": "U2-4", "page": 5}, {"t": "El objetivo principal que persigue la responsabilidad social empresarial radica en el impacto positivo que estas prácticas generen en los distintos ámbitos con los que una empresa tiene relación, al mismo tiempo que contribuya a la competitividad y sostenibilidad de la empresa.", "doc": "U2-4", "page": 5}]}, "RSE|ENT": {"a": "RSE", "b": "ENT", "link": "La empresa tiene un rol ante el entorno en el cual opera y la RSE le exige conocer ese entorno: reglas, leyes y actividades relacionadas con ella.", "quotes": [{"t": "La RSE es el “hacer negocios basados en principios éticos y apegados a la ley”. La empresa tiene un rol ante la sociedad, ante el entorno en el cual opera.", "doc": "U2-4", "page": 4}, {"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Las empresas tienen la responsabilidad de conocer el entorno en el que operan. Deben tener un claro conocimiento de todo lo que rodea su empresa, no solo en términos geográficos, sino en términos del conjunto de reglas, leyes que rigen su operación, y todas las actividades relacionadas directa e indirectamente con la empresa.", "doc": "U2-4", "page": 6}, {"t": "La RSE no es una cultura de la filantropía, no se busca que las empresas se conviertan en obras de beneficencia, ya que las empresas están hechas para ser rentables. Esto implica que las empresas adopten una postura activa y responsable en torno al impacto de sus operaciones.", "doc": "U2-4", "page": 5}]}, "POR|ENT": {"a": "POR", "b": "ENT", "link": "Porter recalca la importancia del entorno porque los cuatro elementos de su matriz de ventaja competitiva son elementos del entorno.", "quotes": [{"t": "El entorno organizacional es definido como el conjunto de fuerzas y condiciones que están fuera de los límites de una organización y que tienen influencia sobre la misma para afectar sus operaciones. Dichas fuerzas están en permanente cambio, que exponen a la organización a oportunidades y amenazas.", "doc": "U2-3", "page": 4}, {"t": "Michael Porter, quien ha efectuado importantes aportes en el campo de la competitividad y de la estrategia, recalca aún más, en La Ventaja Competitiva de las Nacio
